name: 網頁實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 用真的憑證打開網頁
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          const tok = process.env.FINMIND_TOKEN;
          const scrub = s => String(s).split(tok).join('***');
          (async () => {
            const b = await chromium.launch(); const log = [];
            for (const [url, vp, name, act] of [
              ['https://opsite1978-max.github.io/twstock-chart/index.html', {width:1280,height:900}, 'idx-2330', ['2330','D']],
              ['https://opsite1978-max.github.io/twstock-chart/mobile.html', {width:390,height:844}, 'mob-2330', ['2330','D']],
            ]){
              const ctx = await b.newContext({ viewport:vp, serviceWorkers:'block' }); const pg = await ctx.newPage();
              pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(name + ' console: ' + scrub(m.text())); });
              pg.on('pageerror', e => log.push(name + ' pageerror: ' + scrub(e.message)));
              pg.on('requestfailed', r => log.push(name + ' failed: ' + scrub(r.url()).slice(0,160) + ' ' + (r.failure() || {}).errorText));
              pg.on('response', r => { if (r.url().includes('finmind')) log.push(name + ' resp ' + r.status() + ' ' + scrub(r.url()).slice(0,140)); });
              await pg.addInitScript(t => { try { const s = JSON.parse(localStorage.getItem('twchart.settings') || '{}'); s.token = t; localStorage.setItem('twchart.settings', JSON.stringify(s)); } catch(e){} }, tok);
              await pg.goto(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { waitUntil:'domcontentloaded' });
              if (act === 'zoom'){ await pg.waitForTimeout(14000); for (let i = 0; i < 3; i++) await pg.click('#fzIn'); await pg.locator('#svF').scrollIntoViewIfNeeded(); } else if (act){ await pg.waitForTimeout(2500); await pg.fill('#sym', act[0]); await pg.click(`#tfSeg button[data-tf="${act[1]}"]`); await pg.click('#loadBtn'); }
              await pg.waitForTimeout(15000);
              log.push(name + ' STATUS: ' + scrub(await pg.textContent('#status').catch(() => '?')) + ' | LEGEND: ' + scrub((await pg.textContent('#legend').catch(() => '')).slice(0, 600)));
              if (name.startsWith('jb')) log.push(name + ' STATS: ' + scrub((await pg.textContent('#stats').catch(() => '')) + ' | ' + (await pg.textContent('#nm').catch(() => '')) + ' | ' + (await pg.textContent('#note').catch(() => '')))); if (name.startsWith('fz')) log.push(name + ' Z: ' + scrub(await pg.textContent('#fzInfo').catch(() => '?'))); if (name.startsWith('fs')) log.push(name + ' FS: ' + scrub(((await pg.textContent('#sig').catch(() => ''))).slice(0, 5000))); if (name.startsWith('txo')) log.push(name + ' CARDS: ' + scrub((await pg.textContent('#cards').catch(() => '')).slice(0, 400)));
              await pg.screenshot({ path:'../out/' + name + '.png', fullPage: name.startsWith('fs') });
              await ctx.close();
            }
            require('fs').writeFileSync('../out/log.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node c.js
      - name: 存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
