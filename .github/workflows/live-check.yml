name: 網頁實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 用真的憑證打開網頁
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          const tok = process.env.FINMIND_TOKEN;
          const scrub = s => String(s).split(tok).join('***');
          (async () => {
            const b = await chromium.launch(); const log = [];
            for (const [url, vp, name, act] of [
              ['https://opsite1978-max.github.io/twstock-chart/ctrl.html', {width:1280,height:900}, 'ctl-d', null],
              ['https://opsite1978-max.github.io/twstock-chart/ctrl.html', {width:390,height:844}, 'ctl-m', null],
            ]){
              const ctx = await b.newContext({ viewport:vp, serviceWorkers:'block' }); const pg = await ctx.newPage();
              pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(name + ' console: ' + scrub(m.text())); });
              pg.on('pageerror', e => log.push(name + ' pageerror: ' + scrub(e.message)));
              pg.on('requestfailed', r => log.push(name + ' failed: ' + scrub(r.url()).slice(0,160) + ' ' + (r.failure() || {}).errorText));
              pg.on('response', r => { if (r.url().includes('finmind')) log.push(name + ' resp ' + r.status() + ' ' + scrub(r.url()).slice(0,140)); });
              await pg.addInitScript(t => { try { const s = JSON.parse(localStorage.getItem('twchart.settings') || '{}'); s.token = t; localStorage.setItem('twchart.settings', JSON.stringify(s)); } catch(e){} }, tok);
              await pg.goto(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { waitUntil:'domcontentloaded' });
              if (act === 'zoom'){ await pg.waitForTimeout(14000); for (let i = 0; i < 3; i++) await pg.click('#fzIn'); await pg.locator('#svF').scrollIntoViewIfNeeded(); } else if (act){ await pg.waitForTimeout(2500); await pg.fill('#sym', act[0]); await pg.click(`#tfSeg button[data-tf="${act[1]}"]`); await pg.click('#loadBtn'); }
              await pg.waitForTimeout(40000);
              log.push(name + ' STATUS: ' + scrub(await pg.textContent('#status').catch(() => '?')) + ' | LEGEND: ' + scrub((await pg.textContent('#legend').catch(() => '')).slice(0, 600)));
              if (name.startsWith('jb')) log.push(name + ' STATS: ' + scrub((await pg.textContent('#stats').catch(() => '')) + ' | ' + (await pg.textContent('#nm').catch(() => '')) + ' | ' + (await pg.textContent('#note').catch(() => '')))); if (name.startsWith('fz')) log.push(name + ' Z: ' + scrub(await pg.textContent('#fzInfo').catch(() => '?'))); if (name.startsWith('fs')) log.push(name + ' FS: ' + scrub(((await pg.textContent('#sig').catch(() => ''))).slice(0, 5000))); if (name.startsWith('ctl')){ log.push(name + ' DIST: ' + scrub(await pg.textContent('#noteDist').catch(() => '?')) + ' | MAIN: ' + scrub(await pg.textContent('#noteMain').catch(() => '?')) + ' | SUM: ' + scrub((await pg.textContent('#sum').catch(() => '')).slice(0, 2500))); const ds = await pg.$('#distSec'); if (ds) await ds.screenshot({ path:'../out/' + name + '-dist.png' }); for (const tf of []){ await pg.click(`#oscSeg button[data-tf="${tf}"]`).catch(() => {}); await pg.waitForTimeout(tf === 'D' ? 1500 : tf === '60' ? 30000 : 60000); log.push(name + ' OSC ' + tf + ': ' + scrub(await pg.textContent('#noteOsc').catch(() => '?'))); const o = await pg.$('#oscSec'); if (o) await o.screenshot({ path:'../out/' + name + '-osc-' + tf + '.png' }); } const sp = await pg.$('#svSp'); if (sp) await sp.screenshot({ path:'../out/' + name + '-sp.png' }); } if (name.startsWith('txo')){ log.push(name + ' HEAT: ' + scrub(await pg.textContent('#heatNote').catch(() => ''))); const h = await pg.$('#heatSec'); if (h) await h.screenshot({ path:'../out/' + name + '-heat.png' }); const l = await pg.$('#lowSec'); if (l) await l.screenshot({ path:'../out/' + name + '-low.png' }); }
              await pg.screenshot({ path:'../out/' + name + '.png', fullPage: name.startsWith('fs') || name.startsWith('txo') || name.startsWith('ctl') });
              await ctx.close();
            }
            require('fs').writeFileSync('../out/log.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node c.js
      - name: 存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
