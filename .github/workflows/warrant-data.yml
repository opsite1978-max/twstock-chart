name: 權證分點
on:
  schedule:
    - cron: '53 13 * * 1-5'   # 台灣 21:53
    - cron: '33 16 * * 1-5'   # 台灣 00:33（補）
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: wt-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - id: t0
        run: echo "t=$(date +%s)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - name: 取出 wt-data 分支
        run: git fetch -q origin wt-data && git worktree add -q wt-out origin/wt-data || mkdir -p wt-out
      - name: 讀權證分點、整理
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          MAX_MIN: '100'
          RESERVE: '700'
          CAP: '5200'
        run: python3 scripts/warrant_data.py wt-out
      - name: 推到 wt-data 分支
        if: always()
        run: |
          rm -rf pub && mkdir pub && cp wt-out/*.json pub/ 2>/dev/null; for x in d g g2 wu wb wl; do [ -d wt-out/$x ] && cp -r wt-out/$x pub/; done; true
          cd pub && git init -q && git checkout -q -b wt-data && git add -A
          git -c user.name=wt-bot -c user.email=wt-bot@users.noreply.github.com commit -qm "權證分點 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" wt-data
      - name: 還沒補完就一小時後再跑一輪
        if: success() && hashFiles('wt_more') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          w=$(( ${{ steps.t0.outputs.t }} + 3720 - $(date +%s) )); [ $w -gt 0 ] && sleep $w
          gh workflow run warrant-data.yml --ref main -R ${{ github.repository }}
