name: 權證成交資料更新
on:
  schedule:
    - cron: '50 8,10,13 * * 1-5'   # 台灣時間 16:50、18:50、21:50
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/warrant_scrape.py', '.github/workflows/warrant-data.yml']
permissions:
  contents: write
concurrency:
  group: warrant-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 抓證交所、櫃買中心權證每日成交
        run: python3 scripts/warrant_scrape.py update
      - name: 存回專案
        if: always()
        run: |
          git add data/warrant
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git -c user.name="warrant-bot" -c user.email="warrant-bot@users.noreply.github.com" commit -qm "權證成交資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 10 + 5)); done
