name: 分K資料格式檢查
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 抓樣本
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir out && cat > p.py <<'PY'
          import json, os, urllib.request, urllib.parse, collections
          tok = os.environ['FINMIND_TOKEN']
          def get(**q):
              req = urllib.request.Request('https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(q), headers={'Authorization': 'Bearer ' + tok})
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=60))
              except Exception as e:
                  return {'err': str(e)[:200]}
              j.pop('token_tail', None)
              return j
          out = []
          for ds, sid, d in [('TaiwanStockKBar','2330','2026-10-08'), ('TaiwanFuturesKBar','TX','2026-10-08'), ('TaiwanFuturesKBar','TX','2026-10-07'), ('TaiwanFuturesKBar','TX','2026-10-09')]:
              j = get(dataset=ds, data_id=sid, start_date=d)
              rows = j.get('data') or []
              rep = {'ds': ds, 'id': sid, 'date': d, 'status': j.get('status'), 'msg': j.get('msg'), 'err': j.get('err'), 'n': len(rows)}
              if rows:
                  rep['keys'] = list(rows[0].keys())
                  rep['dates'] = collections.Counter(r.get('date') for r in rows)
                  rep['contracts'] = collections.Counter(str(r.get('contract_date')) for r in rows).most_common(8)
                  hrs = collections.Counter(str(r.get('minute'))[:2] for r in rows)
                  rep['hours'] = sorted(hrs.items())
                  rep['first'] = rows[:3]; rep['last'] = rows[-3:]
                  ms = sorted(str(r.get('minute')) for r in rows)
                  rep['minmax'] = [ms[0], ms[-1]]
              out.append(rep)
          s = json.dumps(out, ensure_ascii=False, indent=1, default=str)
          s = s.replace(tok, '***')
          open('out/kbar.json', 'w').write(s)
          PY
          python3 p.py
      - name: 存結果
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
