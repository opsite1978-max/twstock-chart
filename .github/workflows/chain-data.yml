name: 產業鏈與資金流向
on:
  schedule:
    - cron: '43 13 * * 1-5'   # 台灣 21:43（分點資料出來後）
    - cron: '13 16 * * 1-5'   # 台灣 00:13（補算）
    - cron: '23 22 * * 0-4'   # 台灣 06:23（補算）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chain-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: 取出 chain-data 分支
        run: git fetch -q origin chain-data && git worktree add -q chain-out origin/chain-data || mkdir -p chain-out
      - name: 產業鏈、價格、法人、主力
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '2600'
          MAX_MIN: '150'
        run: python3 scripts/chain_data.py chain-out
      - name: 推到 chain-data 分支
        if: always()
        run: |
          rm -rf pub && mkdir pub && cp -r chain-out/*.json pub/ 2>/dev/null; [ -d chain-out/d ] && cp -r chain-out/d pub/ || true
          cd pub && git init -q && git checkout -q -b chain-data && git add -A
          git -c user.name=chain-bot -c user.email=chain-bot@users.noreply.github.com commit -qm "產業鏈與資金流 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" chain-data
