name: 籌碼資料格式檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 抓樣本
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir out && cat > p.py <<'PY'
          import json, os, urllib.request, urllib.parse, collections
          tok = os.environ['FINMIND_TOKEN']
          out = []
          for q in [dict(dataset='TaiwanFuturesInstitutionalInvestors', data_id='MTX', start_date='2026-10-05'),
                    dict(dataset='TaiwanFuturesInstitutionalInvestors', data_id='TX', start_date='2026-10-07'),
                    dict(dataset='TaiwanFuturesInstitutionalInvestors', data_id='TMF', start_date='2026-10-07'),
                    dict(dataset='TaiwanFuturesOpenInterestLargeTraders', data_id='TX', start_date='2026-10-07'),
                    dict(dataset='TaiwanFuturesDaily', data_id='MTX', start_date='2026-10-08', end_date='2026-10-08'),
                    dict(dataset='TaiwanOptionPutCallRatio', start_date='2026-10-01'),
                    dict(dataset='TaiwanFuturesInstitutionalInvestorsAfterHours', data_id='TX', start_date='2026-10-07')]:
              q2 = dict(q, token=tok)
              try:
                  j = json.load(urllib.request.urlopen('https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(q2), timeout=90))
              except Exception as e:
                  out.append({'q': q, 'err': str(e)[:200]}); continue
              rows = j.get('data') or []
              out.append({'q': q, 'status': j.get('status'), 'msg': j.get('msg'), 'n': len(rows), 'sample': rows[:8],
                          'keys': list(rows[0].keys()) if rows else None})
          open('out/chip.json', 'w').write(json.dumps(out, ensure_ascii=False, indent=1).replace(tok, '***'))
          PY
          python3 p.py
      - name: 存結果
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
