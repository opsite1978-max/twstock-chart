name: 個股主動買賣資料探查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          cat > p.py <<'PY'
          import os, json, time, urllib.request, urllib.parse, collections, datetime
          T = os.environ['T']; N = [0]
          def js(p, timeout=300):
              N[0] += 1
              req = urllib.request.Request('https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(p), headers={'Authorization': 'Bearer ' + T})
              t0 = time.time()
              with urllib.request.urlopen(req, timeout=timeout) as r: b = r.read()
              j = json.loads(b); return j.get('data') or [], len(b), time.time() - t0
          req = urllib.request.Request('https://api.web.finmindtrade.com/v2/user_info', headers={'Authorization': 'Bearer ' + T})
          print('quota', {k: v for k, v in json.load(urllib.request.urlopen(req)).items() if k in ('user_count', 'api_request_limit_hour')})
          cal = sorted({r['date'] for r in js({'dataset': 'TaiwanStockTradingDate', 'start_date': '2026-05-01'})[0]})
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).date().isoformat()
          days = [d for d in cal if d < today][-80:]
          info = js({'dataset': 'TaiwanFutOptDailyInfo'})[0]
          print('futinfo sample', [x for x in info if '台積' in str(x.get('name')) or x.get('code') in ('CDF', 'DHF')][:6])
          out = {}
          for sid in ['2330', '2317', '2603', '3231']:
              res = {}; sz = 0; nt = 0
              for d in days:
                  rows, b, sec = js({'dataset': 'TaiwanStockPriceTick', 'data_id': sid, 'start_date': d})
                  sz += b; nt += len(rows)
                  agg = {}
                  for r in rows:
                      tm = str(r['Time'])[:8]; hh, mm = int(tm[:2]), int(tm[3:5]); m = hh * 60 + mm
                      if m < 540 or m > 810: continue
                      k = (m - 540) // 5
                      p = float(r['deal_price']); v = float(r['volume']); tt = str(r.get('TickType'))
                      a = agg.get(k)
                      if a is None: a = agg[k] = [p, p, p, p, 0.0, 0.0, 0.0]
                      a[1] = max(a[1], p); a[2] = min(a[2], p); a[3] = p
                      if tt == '1': a[4] += v
                      elif tt == '2': a[5] += v
                      else: a[6] += v
                  res[d] = [[k] + agg[k] for k in sorted(agg)]
              out[sid] = res
              print(sid, 'days', len(days), 'ticks', nt, 'MB', round(sz / 1e6, 1), 'per day MB', round(sz / 1e6 / len(days), 2), 'req', N[0])
          rows, b, sec = js({'dataset': 'TaiwanFuturesTick', 'data_id': 'CDF', 'start_date': days[-1]})
          print('CDF fut tick rows', len(rows), 'MB', round(b / 1e6, 2), rows[:2])
          json.dump(out, open('out/stock5.json', 'w'), separators=(',', ':'))
          PY
          python3 p.py > out/log.txt 2>&1 || true
          sed -i "s/$T/***/g" out/log.txt
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
