name: 多空力道資料探查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 探查
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          cat > p.py <<'PY'
          import os, json, time, urllib.request, urllib.parse, collections
          T = os.environ['T']
          def js(p):
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(p)
              t0 = time.time()
              try:
                  req = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + T})
                  with urllib.request.urlopen(req, timeout=300) as r: b = r.read()
                  j = json.loads(b.decode())
                  return j.get('status'), j.get('msg'), j.get('data') or [], len(b), round(time.time() - t0, 1)
              except Exception as e: return 0, str(e)[:300], [], 0, round(time.time() - t0, 1)
          D = '2026-10-16'
          st, msg, d, n, sec = js({'dataset': 'TaiwanOptionTick', 'data_id': 'TXO', 'start_date': D})
          print('OPTTICK', st, msg, 'rows', len(d), 'bytes', n, 'sec', sec)
          if d:
              print(' keys', sorted(d[0].keys()))
              for x in d[:5] + d[len(d)//2:len(d)//2+5] + d[-5:]: print('  ', json.dumps(x, ensure_ascii=False))
              print(' contract_date', collections.Counter(str(x.get('contract_date')).strip() for x in d).most_common(40))
              print(' option_id', collections.Counter(str(x.get('option_id')) for x in d).most_common(10))
              print(' PutCall', collections.Counter(str(x.get('PutCall')) for x in d).most_common(5))
              ts = sorted(str(x.get('date')) for x in d); print(' date range', ts[0], ts[-1])
              hh = collections.Counter(str(x.get('date'))[11:13] for x in d); print(' by hour', sorted(hh.items()))
              vt = sum(x.get('volume') or 0 for x in d); print(' tick volume sum', vt)
              # 連續同價、成交量分布
              print(' vol dist', collections.Counter(min(x.get('volume') or 0, 20) for x in d).most_common(12))
          st, msg, d2, n, sec = js({'dataset': 'TaiwanOptionDaily', 'data_id': 'TXO', 'start_date': D, 'end_date': D})
          vs = collections.Counter()
          for x in d2: vs[x.get('trading_session')] += x.get('volume') or 0
          print('OPTDAILY volume by session', dict(vs), 'rows', len(d2), 'bytes', n)
          print(' contracts', sorted(set(str(x.get('contract_date')).strip() for x in d2)))
          for x in d2[:3]: print('  ', json.dumps(x, ensure_ascii=False))
          st, msg, d3, n, sec = js({'dataset': 'TaiwanOptionTick', 'data_id': 'TXO', 'start_date': '2026-10-15'})
          print('OPTTICK 10-15 rows', len(d3), 'bytes', n, 'sec', sec)
          if d3:
              ts = sorted(str(x.get('date')) for x in d3); print(' date range', ts[0], ts[-1]); print(' volsum', sum(x.get('volume') or 0 for x in d3))
          st, msg, k, n, sec = js({'dataset': 'TaiwanFuturesKBar', 'data_id': 'TX', 'start_date': D})
          print('KBAR', st, msg, 'rows', len(k), 'bytes', n)
          if k:
              print(' contracts', collections.Counter(str(x.get('contract_date')).strip() for x in k).most_common(8))
              mins = sorted(str(x.get('minute')) for x in k); print(' minute range', mins[0], mins[-1])
              for x in k[:3] + k[-3:]: print('  ', json.dumps(x, ensure_ascii=False))
              print(' dates', collections.Counter(str(x.get('date')) for x in k))
          st, msg, f, n, sec = js({'dataset': 'TaiwanFuturesDaily', 'data_id': 'TX', 'start_date': '2026-10-15', 'end_date': D})
          for x in f[:8]: print(' FUTDAILY', json.dumps(x, ensure_ascii=False))
          for did in ['TXO', 'TX3', 'TX4', 'TXV', 'TXX']:
              st, msg, s, n, sec = js({'dataset': 'taiwan_options_snapshot', 'data_id': did})
              print('OPTSNAP', did, st, msg, 'rows', len(s), 'bytes', n, 'sec', sec)
              for x in s[:3]: print('  ', json.dumps(x, ensure_ascii=False))
              if s: print(' ids sample', [x.get('options_id') for x in s[:: max(1, len(s)//15)]])
          st, msg, s, n, sec = js({'dataset': 'taiwan_futures_snapshot', 'data_id': 'TXF'})
          print('FUTSNAP', st, msg, len(s)); [print('  ', json.dumps(x, ensure_ascii=False)) for x in s[:4]]
          st, msg, s, n, sec = js({'dataset': 'TaiwanOptionVix', 'start_date': '2026-10-15', 'end_date': D})
          print('VIX', st, msg, len(s)); [print('  ', json.dumps(x, ensure_ascii=False)) for x in s[:3] + s[-3:]]
          st, msg, s, n, sec = js({'dataset': 'TaiwanFutOptTickInfo'})
          print('TICKINFO', st, len(s)); [print('  ', json.dumps(x, ensure_ascii=False)) for x in [y for y in s if 'TX' in str(y.get('code'))][:12]]
          PY
          python3 p.py > out/force_probe.txt 2>&1 || true
          sed -i "s/$T/***/g" out/force_probe.txt
      - name: 存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
