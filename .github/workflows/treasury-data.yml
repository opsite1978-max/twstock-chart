name: 庫藏股買回資料更新
on:
  schedule:
    - cron: '17 11 * * 1-5'   # 台灣時間 19:17
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/treasury_scrape.py', '.github/workflows/treasury-data.yml']
permissions:
  contents: write
concurrency:
  group: treasury-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 抓公開資訊觀測站庫藏股彙總表
        run: python3 scripts/treasury_scrape.py
      - name: 存回專案
        run: |
          git add data/treasury.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git config user.name "treasury-bot"; git config user.email "treasury-bot@users.noreply.github.com"; git commit -qm "庫藏股資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 5))
          done
          exit 1
