name: 主力成本線（合約層級）
on:
  schedule:
    - cron: '40 10,14 * * 1-5'   # 台灣時間 18:40、22:40
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/ctrl_data.py', 'scripts/optflow_data.py', '.github/workflows/ctrl-data.yml']
permissions:
  contents: write
concurrency:
  group: ctrl-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 計算主力成本（FinMind，慢速查詢）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '700'
        run: python3 scripts/ctrl_data.py
      - name: 選擇權多空力道（主力、散戶）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '420'
        run: python3 scripts/optflow_data.py
      - name: 存回專案
        run: |
          git add data/ctrl
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git config user.name "ctrl-bot"; git config user.email "ctrl-bot@users.noreply.github.com"; git commit -qm "主力成本線更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git stash -u -q || true   # 其他沒要存的暫存檔先收起來，不然無法 pull --rebase
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          [ "$ok" = 1 ]
