name: 權證分點資料更新
on:
  schedule:
    - cron: '7 * * * *'    # 每小時一次：先回補歷史，補完後每天只抓新的一天
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/wbranch_scrape.py', '.github/workflows/wbranch-data.yml']
permissions:
  contents: write
concurrency:
  group: wbranch-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: 取出原始分點資料（另一個分支，不放網站）
        run: |
          mkdir -p raw && cd raw && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin wbranch-raw; then git checkout -q -b wbranch-raw FETCH_HEAD; else git checkout -q --orphan wbranch-raw; fi
          ls | head
      - name: 抓權證分點（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '3200'
          TIME_BUDGET: '2400'
        run: python3 scripts/wbranch_scrape.py fetch raw
      - name: 存回原始資料分支
        if: always()
        run: |
          cd raw
          git add -A
          if git diff --cached --quiet; then echo "沒有新的原始資料"; exit 0; fi
          git -c user.name="wbranch-bot" -c user.email="wbranch-bot@users.noreply.github.com" commit -qm "權證分點原始資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push -q origin wbranch-raw
      - name: 計算分點勝率與近期動向
        run: python3 scripts/wbranch_scrape.py build raw
      - name: 存回專案
        run: |
          git status --short | head -20 > /tmp/diag.txt
          git add data/wbranch
          if git diff --cached --quiet; then echo "沒有新結果" | tee -a /tmp/diag.txt; exit 0; fi
          git -c user.name="wbranch-bot" -c user.email="wbranch-bot@users.noreply.github.com" commit -qm "權證分點勝率更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main >> /tmp/diag.txt 2>&1 && git push -q origin HEAD:main >> /tmp/diag.txt 2>&1; then ok=1; break; fi
            sleep $((RANDOM % 10 + 5))
          done
          echo "push ok=$ok" >> /tmp/diag.txt
          [ "$ok" = 1 ]
      - name: 診斷紀錄（存到原始資料分支）
        if: always()
        run: |
          mkdir -p raw/_diag
          cp /tmp/diag.txt raw/_diag/commit.txt 2>/dev/null || true
          cp data/wbranch/_lastrun_*.txt raw/_diag/ 2>/dev/null || true
          ls -la data/wbranch > raw/_diag/files.txt 2>&1 || true
          cd raw && git add -A && (git -c user.name="wbranch-bot" -c user.email="wbranch-bot@users.noreply.github.com" commit -qm "診斷紀錄" || true) && git push -q origin wbranch-raw || true
