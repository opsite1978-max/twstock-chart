name: 選擇權K線盤中錄影
on:
  schedule:
    - cron: '32 0 * * 1-5'    # 台灣 08:32（日盤）
    - cron: '52 0 * * 1-5'    # 台灣 08:52（備援：排程延遲時補開）
    - cron: '42 6 * * 1-5'    # 台灣 14:42（夜盤）
    - cron: '7 7 * * 1-5'     # 台灣 15:07（備援）
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: optk-live
  cancel-in-progress: false
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 每分鐘錄週選、月選即時報價，整理成 1 分 K（推到 optk-live 分支）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/optk_live.py
