name: 台指選擇權隱含波動率歷史
on:
  schedule:
    - cron: '40 8,10 * * 1-5'   # 台灣時間 16:40、18:40（選擇權收盤資料公布後）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/iv_scrape.py', '.github/workflows/iv-data.yml']
permissions:
  contents: write
concurrency:
  group: iv-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 計算每日隱含波動率（FinMind，每次最多 45 次查詢）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '45'
        run: python3 scripts/iv_scrape.py update
      - name: 產生 TradingView 版程式碼（不連 FinMind）
        run: python3 scripts/pine_iv.py
      - name: 存回專案
        run: |
          git add data/txo/iv.json data/txo/_lastrun_iv.txt data/pine
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git -c user.name="txo-bot" -c user.email="txo-bot@users.noreply.github.com" commit -qm "隱含波動率歷史更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          [ "$ok" = 1 ]
