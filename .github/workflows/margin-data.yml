name: 融資看盤資料
on:
  schedule:
    - cron: '40 13 * * 1-5'   # 台灣時間 21:40（融資資料晚上公布）
    - cron: '30 15 * * 1-5'   # 台灣時間 23:30 再補一次
    - cron: '20 0 * * 2-6'    # 台灣時間 08:20
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/margin_data.py', '.github/workflows/margin-data.yml']
permissions:
  contents: write
concurrency:
  group: margin-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 加權指數＋融資餘額
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 scripts/margin_data.py
      - name: 存回專案
        run: |
          files=$(git status --porcelain --untracked-files=all data/margin | awk '{print $NF}')
          if [ -z "$files" ]; then echo "沒有新資料"; exit 0; fi
          mkdir -p /tmp/keep && for f in $files; do mkdir -p "/tmp/keep/$(dirname "$f")"; cp "$f" "/tmp/keep/$f"; done
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp -r /tmp/keep/. . && git add $files
            if git diff --cached --quiet; then ok=1; break; fi
            git config user.name "margin-bot"; git config user.email "margin-bot@users.noreply.github.com"; git commit -qm "融資看盤資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((RANDOM % 10 + 5))
          done
          [ "$ok" = 1 ]
