name: 股價成交量與技術選股更新
on:
  schedule:
    - cron: '42 8,10,13 * * 1-5'   # 台灣時間 16:42、18:42、21:42
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/price_scrape.py', '.github/workflows/price-data.yml']
permissions:
  contents: write
concurrency:
  group: price-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: 抓證交所、櫃買中心每日行情，計算指標與回測
        run: python3 scripts/price_scrape.py update
      - name: 存回專案
        if: always()
        run: |
          git add data/price
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git -c user.name="price-bot" -c user.email="price-bot@users.noreply.github.com" commit -qm "股價與技術選股更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          ok=0
          for i in 1 2 3 4 5; do
            if out=$(git pull --rebase origin main 2>&1 && git push origin HEAD:main 2>&1); then ok=1; break; fi
            echo "第 $i 次推送失敗：$out"; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 5))
          done
          if [ $ok != 1 ]; then echo "::error::股價資料推送失敗：$(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; fi
          echo "::notice::$(grep -E 'fetched days|vwb' data/price/_lastrun.txt | tail -2 | tr '\n' ' ')"
