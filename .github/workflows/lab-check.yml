name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TOK: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok = os.environ['TOK']; out = []
          def get(path, q):
              q = dict(q, token=tok)
              try:
                  with urllib.request.urlopen('https://api.finmindtrade.com/api/v4/' + path + '?' + urllib.parse.urlencode(q), timeout=60) as r: return json.load(r)
              except Exception as e: return {'err': str(e).replace(tok, '***')}
          j = get('taiwan_futures_snapshot', {'data_id': 'TX'})
          out.append('FUT status %s msg %s n %d' % (j.get('status'), j.get('msg'), len(j.get('data') or [])))
          for r in (j.get('data') or [])[:40]: out.append('  ' + json.dumps({k: r.get(k) for k in ('futures_id', 'date', 'close', 'total_volume', 'open', 'high', 'low')}, ensure_ascii=False))
          for pid in ('TXU', 'TX4', 'TXO'):
              j = get('taiwan_options_snapshot', {'data_id': pid}); d = j.get('data') or []
              ds = sorted(set(str(r.get('date')) for r in d))
              out.append('OPT %s status %s n %d dates %s .. %s' % (pid, j.get('status'), len(d), ds[:1], ds[-1:]))
              if d: out.append('  keys ' + ','.join(d[0].keys())); out.append('  ' + json.dumps(d[0], ensure_ascii=False))
          j = get('data', {'dataset': 'TaiwanFuturesTick', 'data_id': 'TX', 'start_date': '2026-10-21'}); d = j.get('data') or []
          out.append('TICK n %d last %s' % (len(d), json.dumps(d[-1:], ensure_ascii=False)))
          open('log.txt', 'w').write('\n'.join(out).replace(tok, '***'))
          PY
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
