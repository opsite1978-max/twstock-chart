name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium > ../out/install.txt 2>&1 || true
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          const tok = process.env.FINMIND_TOKEN, scrub = s => String(s).split(tok).join('***'), fs = require('fs'), log = [];
          const L = x => { log.push(scrub(x)); fs.writeFileSync('../out/log.txt', log.join('\n')); };
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport:{ width:1280, height:1000 }, serviceWorkers:'block' });
            await ctx.addInitScript(t => { try { const s = JSON.parse(localStorage.getItem('twchart.settings') || '{}'); s.token = t; localStorage.setItem('twchart.settings', JSON.stringify(s)); localStorage.setItem('flow.tf', '5'); localStorage.removeItem('flow.sym'); } catch(e){} }, tok);
            const pg = await ctx.newPage(); pg.setDefaultTimeout(20000);
            pg.on('pageerror', e => L('pageerror: ' + e.message));
            await pg.goto('https://opsite1978-max.github.io/twstock-chart/flowchart.html?t=' + Date.now());
            for (let k = 0; k < 4; k++){
              await pg.waitForTimeout(k ? 65000 : 25000);
              L('T' + k + ' ' + await pg.evaluate(() => { const B = VIEW.bars, l = B[B.length - 1]; return JSON.stringify({ n:B.length, last:[new Date(l.t * 1000).toISOString().slice(5, 16), l.o, l.h, l.l, l.c, Math.round(l.net * 10) / 10, !!l.live], S:VIEW.S.slice(-3).map(v => v == null ? null : Math.round(v)), P:VIEW.P ? VIEW.P.v.slice(-1)[0] : null, upd:document.getElementById('upd').textContent, lg4:document.getElementById('lg4').textContent.slice(0, 80) }); }));
            }
            await pg.screenshot({ path:'../out/flow.png' });
            await b.close();
          })().catch(e => L('ERR ' + (e.stack || e)));
          JS
          timeout 500 node c.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
