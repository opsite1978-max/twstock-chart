name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out && cat > p.py <<'PY'
          import os, json, urllib.request, urllib.parse, datetime
          T = os.environ['FINMIND_TOKEN']; L = []
          def g(path, **q):
              q['token'] = T
              u = 'https://api.finmindtrade.com/api/v4/' + path + '?' + urllib.parse.urlencode(q)
              try:
                  with urllib.request.urlopen(u, timeout=40) as r: j = json.loads(r.read())
              except Exception as e: return {'err': repr(e)[:200]}
              return j
          L.append('now ' + str(datetime.datetime.utcnow()))
          for did in ('TX', 'TMF', 'TXF'):
              j = g('taiwan_futures_snapshot', data_id=did)
              d = j.get('data') or []
              L.append(f"FUT {did} status {j.get('status')} msg {str(j.get('msg'))[:80]} rows {len(d)} keys {list(d[0].keys()) if d else ''}")
              for r in d[:12]: L.append('   ' + json.dumps({k: r.get(k) for k in ('futures_id', 'date', 'close', 'total_volume', 'high', 'low', 'TickType')}, ensure_ascii=False))
          j = g('taiwan_futures_snapshot')
          d = j.get('data') or []
          L.append(f"FUT all rows {len(d)} newest {max((str(r.get('date')) for r in d), default='')}")
          L.append('   ' + str(sorted({str(r.get('futures_id'))[:3] for r in d})[:60]))
          for p in ('TXO', 'TX4', 'TXZ', 'TXU'):
              j = g('taiwan_options_snapshot', data_id=p); d = j.get('data') or []
              L.append(f"OPT {p} status {j.get('status')} rows {len(d)} newest {max((str(r.get('date')) for r in d), default='')} vol {sum(int(r.get('total_volume') or 0) for r in d)}")
              if d: L.append('   ' + json.dumps(d[0], ensure_ascii=False)[:300])
          j = g('data', dataset='TaiwanFuturesTick', data_id='TX', start_date=datetime.date.today().isoformat())
          d = j.get('data') or []; L.append(f"TICK today rows {len(d)} last {d[-1] if d else ''}")
          open('out/log.txt', 'w').write('\n'.join(L).replace(T, '***'))
          PY
          python3 p.py || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
