name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium > ../out/install.txt 2>&1 || true
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          const tok = process.env.FINMIND_TOKEN, scrub = s => String(s).split(tok).join('***'), fs = require('fs'), log = [];
          const L = x => { log.push(scrub(x)); fs.writeFileSync('../out/log.txt', log.join('\n')); };
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport:{ width:1280, height:900 }, serviceWorkers:'block' });
            await ctx.addInitScript(t => { try { const s = JSON.parse(localStorage.getItem('twchart.settings') || '{}'); s.token = t; localStorage.setItem('twchart.settings', JSON.stringify(s)); } catch(e){} }, tok);
            const pg = await ctx.newPage(); pg.setDefaultTimeout(20000);
            pg.on('pageerror', e => L('pageerror: ' + e.message));
            await pg.goto('https://opsite1978-max.github.io/twstock-chart/txo.html?t=' + Date.now()); await pg.waitForTimeout(45000);
            L('TXO ' + await pg.evaluate(() => { const e = DATA && DATA.exps.find(x => x.S.some(s => s.c.lq > 0)); const near = e && e.S.filter(s => s.c.lq > 0 && s.p.lq > 0).sort((a, b) => Math.abs(a.c.lq - a.p.lq) - Math.abs(b.c.lq - b.p.lq))[0];
              return document.getElementById('liveLine').textContent + ' | exp ' + (e && e.code) + ' | ATM ' + (near && [near.K, near.c.lq, near.p.lq, near.c.px, near.p.px].join('/')) + ' | idx ' + DATA.liveIdx + ' | fut ' + (DATA.fut && DATA.fut.price) + ' | date ' + DATA.date; }));
            await pg.screenshot({ path:'../out/txo.png' });
            await b.close();
          })().catch(e => L('ERR ' + (e.stack || e)));
          JS
          timeout 300 node c.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
