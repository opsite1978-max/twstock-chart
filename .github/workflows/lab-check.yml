name: 資金流看盤搜尋實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium > ../out/install.txt 2>&1 || true
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          const tok = process.env.FINMIND_TOKEN, scrub = s => String(s).split(tok).join('***');
          (async () => {
            const log = []; const fs = require('fs');
            const b = await chromium.launch();
            for (const [vp, name] of [[{width:1280,height:900}, 'd'], [{width:390,height:844}, 'm']]){
              const ctx = await b.newContext({ viewport:vp, serviceWorkers:'block' }); const pg = await ctx.newPage();
              pg.on('console', m => { if (m.type() === 'error') log.push(name + ' console: ' + scrub(m.text())); });
              pg.on('pageerror', e => log.push(name + ' pageerror: ' + scrub(e.message)));
              await pg.addInitScript(t => { try { const s = JSON.parse(localStorage.getItem('twchart.settings') || '{}'); s.token = t; localStorage.setItem('twchart.settings', JSON.stringify(s)); } catch(e){} }, tok);
              await pg.goto('https://opsite1978-max.github.io/twstock-chart/flowchart.html?t=' + Date.now(), { waitUntil:'domcontentloaded' });
              await pg.waitForTimeout(12000);
              const runs = name === 'd' ? [['2330', '60'], ['2330', '240'], ['2317', '15']] : [['2330', '60']];
              for (const [q, tf] of runs){
                await pg.click(`#tfSeg button[data-tf="${tf}"]`); await pg.waitForTimeout(1500);
                await pg.fill('#sym', q); await pg.click('#go');
                for (let k = 0; k < 90; k++){ await pg.waitForTimeout(2000); const st = await pg.$eval('#status', e => e.hidden ? '' : e.textContent).catch(() => ''); if (!st || /失敗/.test(st)) break; }
                await pg.waitForTimeout(1500);
                log.push(name + ' ' + q + ' ' + tf + ' STATUS ' + scrub(await pg.$eval('#status', e => e.hidden ? '(hidden)' : e.textContent)) + ' | ' + scrub(await pg.textContent('#symName')) + ' | ' + scrub(await pg.textContent('#statNote')));
                log.push('   ' + scrub((await pg.textContent('#tblStat')).replace(/\s+/g, ' ')).slice(0, 500));
                await pg.screenshot({ path:'../out/' + name + '-' + q + '-' + tf + '.png' });
              }
              await ctx.close();
            }
            fs.writeFileSync('../out/log.txt', log.join('\n'));
            await b.close();
          })().catch(e => { require('fs').writeFileSync('../out/log.txt', 'ERR ' + scrub(e.stack || e)); });
          JS
          node c.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
