name: 研究版網頁實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const log = [];
            for (const [vp, name, mob] of [[{width:1280,height:900}, 'd', false], [{width:390,height:844}, 'm', true]]){
              const ctx = await b.newContext({ viewport:vp, serviceWorkers:'block', hasTouch:mob }); const pg = await ctx.newPage();
              pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(name + ' console: ' + m.text()); });
              pg.on('pageerror', e => log.push(name + ' pageerror: ' + e.message));
              await pg.goto('https://opsite1978-max.github.io/twstock-chart/force-lab.html?t=' + Date.now(), { waitUntil:'domcontentloaded' });
              await pg.waitForTimeout(5000);
              const p = (await pg.$('#svS')).boundingBox ? await (await pg.$('#svS')).boundingBox() : null;
              const panel = await pg.$('#svS >> xpath=..');
              await panel.screenshot({ path:'../out/' + name + '-a.png' });
              await pg.click('#lzIn'); await pg.click('#lzIn'); await pg.waitForTimeout(300);
              const bb = await (await pg.$('#svS')).boundingBox();
              await pg.mouse.move(bb.x + bb.width * 0.6, bb.y + bb.height * 0.45); await pg.waitForTimeout(300);
              await panel.screenshot({ path:'../out/' + name + '-b.png' });
              log.push(name + ' tip ' + (await pg.textContent('#tipS')));
              await ctx.close();
            }
            require('fs').writeFileSync('../out/log.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node c.js
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
