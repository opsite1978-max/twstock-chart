name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - env:
          TOK: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, collections
          tok = os.environ['TOK']; out = []
          def get(q, path='data'):
              t0 = time.time()
              u = 'https://api.finmindtrade.com/api/v4/' + path + '?' + urllib.parse.urlencode(dict(q, token=tok))
              with urllib.request.urlopen(u, timeout=600) as r: raw = r.read()
              j = json.loads(raw); return j.get('data') or [], len(raw), time.time() - t0
          D = '2026-10-21'
          for fid in ('TMF', 'MTX', 'TX'):
              d, sz, dt = get({'dataset': 'TaiwanFuturesTick', 'data_id': fid, 'start_date': D})
              vol = collections.Counter(); tot = 0; byc = collections.Counter(); sess = collections.Counter()
              for r in d:
                  v = int(r.get('volume') or 0); vol[min(v, 21)] += 1; tot += v; byc[r.get('contract_date')] += v
                  h = r['date'][11:13]; sess['D' if '08' <= h <= '13' else 'N'] += v
              out.append(f'{fid} ticks n={len(d)} bytes={sz/1e6:.1f}MB {dt:.0f}s totvol={tot} sess={dict(sess)} contracts={byc.most_common(3)}')
              out.append('   rows by volume (cap 21): ' + str(sorted(vol.items())[:22]))
              out.append('   sample ' + json.dumps(d[:3], ensure_ascii=False))
          dd, _, _ = get({'dataset': 'TaiwanFuturesDaily', 'data_id': 'MTX', 'start_date': D, 'end_date': D})
          out.append('MTX daily ' + json.dumps([(r['contract_date'], r['trading_session'], r['volume']) for r in dd if r['volume']], ensure_ascii=False)[:400])
          dd, _, _ = get({'dataset': 'TaiwanFuturesDaily', 'data_id': 'TMF', 'start_date': D, 'end_date': D})
          out.append('TMF daily ' + json.dumps([(r['contract_date'], r['trading_session'], r['volume']) for r in dd if r['volume']], ensure_ascii=False)[:400])
          d, sz, dt = get({'dataset': 'TaiwanOptionTick', 'data_id': 'TXO', 'start_date': D})
          vol = collections.Counter(); tot = 0
          for r in d: v = int(r.get('volume') or 0); vol[min(v, 21)] += 1; tot += v
          out.append(f'TXO ticks n={len(d)} bytes={sz/1e6:.1f}MB {dt:.0f}s totvol={tot}')
          out.append('   rows by volume: ' + str(sorted(vol.items())[:22]))
          out.append('   share of volume in rows v<=2: %.3f  v<=5: %.3f' % (sum(k*c for k,c in vol.items() if k<=2)/tot, sum(k*c for k,c in vol.items() if k<=5)/tot))
          for ds, did in (('TaiwanFuturesInstitutionalInvestors', 'MTX'), ('TaiwanOptionInstitutionalInvestors', 'TXO')):
              d, _, _ = get({'dataset': ds, 'data_id': did, 'start_date': D, 'end_date': D})
              out.append(ds + ' keys ' + str(sorted(d[0].keys())) if d else ds + ' none'); out.append('   ' + json.dumps(d[:2], ensure_ascii=False)[:600])
          open('log.txt', 'w').write('\n'.join(out).replace(tok, '***'))
          PY
          git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
