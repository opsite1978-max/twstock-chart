name: 資金流看盤實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          mkdir -p out t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium > ../out/install.txt 2>&1 || true
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const log = []; const fs = require('fs');
            const b = await chromium.launch();
            for (const [vp, name, mob] of [[{width:1280,height:900}, 'd', false], [{width:390,height:844}, 'm', true]]){
              const ctx = await b.newContext({ viewport:vp, serviceWorkers:'block', hasTouch:mob, deviceScaleFactor: mob ? 2 : 1 }); const pg = await ctx.newPage();
              pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(name + ' console: ' + m.text()); });
              pg.on('pageerror', e => log.push(name + ' pageerror: ' + e.message));
              await pg.goto('https://opsite1978-max.github.io/twstock-chart/flowchart.html?t=' + Date.now(), { waitUntil:'domcontentloaded' });
              await pg.waitForTimeout(15000);
              for (const tf of ['60', '5', '1', '240', 'D']){
                await pg.click(`#tfSeg button[data-tf="${tf}"]`); await pg.waitForTimeout(tf === '1' ? 12000 : 5000);
                log.push(name + ' ' + tf + ' ' + (await pg.textContent('#tblStat')).replace(/\s+/g, ' ').slice(0, 400));
                if (name === 'd' || tf === '60') await pg.screenshot({ path:'../out/' + name + '-' + tf + '.png' });
              }
              await pg.click('#tfSeg button[data-tf="60"]'); await pg.waitForTimeout(4000);
              await pg.screenshot({ path:'../out/' + name + '-full.png', fullPage:true });
              await ctx.close();
            }
            fs.writeFileSync('../out/log.txt', log.join('\n'));
            await b.close();
          })().catch(e => { require('fs').writeFileSync('../out/log.txt', 'ERR ' + (e.stack || e)); });
          JS
          node c.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
