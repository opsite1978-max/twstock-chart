name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out && cat > p.py <<'PY'
          import os, json, urllib.request, urllib.parse, time
          T = os.environ['FINMIND_TOKEN']; L = []
          def g(**q):
              q['token'] = T
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(q)
              for k in range(3):
                  try:
                      with urllib.request.urlopen(u, timeout=180) as r: j = json.loads(r.read())
                      return j.get('data') or [], j.get('status'), str(j.get('msg'))[:80]
                  except Exception as e: err = repr(e)[:150]; time.sleep(5)
              return [], None, err
          d, s, m = g(dataset='TaiwanStockPrice', data_id='TAIEX', start_date='2005-01-01')
          L.append(f'TAIEX rows {len(d)} {s} {m} first {d[0] if d else None} last {d[-1] if d else None}')
          json.dump([[r['date'], r['open'], r['max'], r['min'], r['close'], r.get('Trading_money')] for r in d], open('out/taiex.json', 'w'))
          tx = {}
          for y in range(2008, 2027):
              d, s, m = g(dataset='TaiwanFuturesDaily', data_id='TX', start_date=f'{y}-01-01', end_date=f'{y}-12-31')
              L.append(f'TX {y} rows {len(d)} {s} {m}')
              for r in d:
                  if r.get('trading_session') not in (None, 'position'): continue
                  c = str(r.get('contract_date', '')).strip()
                  if len(c) != 6 or not r.get('close'): continue
                  k = r['date']
                  if k not in tx or (r.get('volume') or 0) > tx[k][5]: tx[k] = [k, r['open'], r['max'], r['min'], r['close'], r.get('volume') or 0, c]
              time.sleep(1)
          json.dump(sorted(tx.values()), open('out/tx.json', 'w'))
          L.append(f'TX days {len(tx)}')
          open('out/log.txt', 'w').write('\n'.join(L).replace(T, '***'))
          PY
          python3 p.py || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
