name: 實測（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          TOK: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out t && cd out
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok = os.environ['TOK']; out = []
          def get(path, q):
              with urllib.request.urlopen('https://api.finmindtrade.com/api/v4/' + path + '?' + urllib.parse.urlencode(dict(q, token=tok)), timeout=60) as r: return json.load(r)
          for fid in ('MXF', 'MTX', 'TXF'):
              j = get('taiwan_futures_snapshot', {'data_id': fid}); d = j.get('data') or []
              out.append(fid + ' n %d keys %s' % (len(d), sorted(d[0].keys()) if d else None))
              out.append('  ' + json.dumps([{k: r.get(k) for k in ('futures_id', 'date', 'close', 'total_volume', 'TickType')} for r in d], ensure_ascii=False)[:600])
          j = get('taiwan_options_snapshot', {'data_id': 'TXY'}); d = j.get('data') or []
          out.append('TXY n %d sample %s' % (len(d), json.dumps(d[:2], ensure_ascii=False)[:500]))
          open('log.txt', 'w').write('\n'.join(out).replace(tok, '***'))
          PY
          cd ../t && npm init -y >/dev/null && npm i -s playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium > ../out/install.txt 2>&1 || true
          cat > c.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs'); const tok = process.env.TOK;
          (async () => { const b = await chromium.launch(); const pg = await b.newPage();
            await pg.goto('https://opsite1978-max.github.io/twstock-chart/overview.html');
            const r = await pg.evaluate(async t => { try { const x = await fetch('https://api.web.finmindtrade.com/v2/user_info?token=' + t); const j = await x.json(); return 'OK user_count=' + j.user_count + ' limit=' + j.api_request_limit_hour; } catch(e){ return 'FAIL ' + e.message; } }, tok);
            fs.appendFileSync('../out/log.txt', '\nuser_info from browser: ' + r.split(tok).join('***'));
            await b.close(); })();
          JS
          timeout 120 node c.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
