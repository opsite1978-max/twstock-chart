name: 台指選擇權多空力道（逐筆 Delta 資金流）
on:
  schedule:
    - cron: '25 23 * * 0-5'   # 台灣時間 週一～週六 07:25（夜盤收完）
    - cron: '5 12 * * 1-5'    # 台灣時間 週一～週五 20:05（避開 16:00–19:30 其他功能最忙的時段）
    - cron: '5 19 * * *'      # 台灣時間 每天 03:05：舊資料價格修正，每次最多 30 次查詢，修完就不再查
  workflow_dispatch:
    inputs:
      mode:
        description: 'update＝一般更新、fixprice＝舊資料價格修正、compare＝新舊算法比較'
        default: 'update'
      max_files:
        description: '一般更新這次最多處理幾個日曆日'
        default: '60'
permissions:
  contents: write
concurrency:
  group: force-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 計算（FinMind；本小時用量超過 3,000 次就自動跳過）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          MAX_FILES: ${{ github.event.inputs.max_files || '60' }}
          MAX_MINUTES: '100'
          REQ_BUDGET: '150'
          QUOTA_MAX: '3000'
          FIX_N: '30'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "5 19 * * *" ]; then MODE=fixprice; else MODE=update; fi
          fi
          echo "mode=$MODE"
          python3 scripts/force_data.py "$MODE"
      - name: 存回專案
        run: |
          git add data/force
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git config user.name "force-bot"; git config user.email "force-bot@users.noreply.github.com"; git commit -qm "多空力道資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git stash -u -q || true   # 其他沒要存的暫存檔先收起來，不然無法 pull --rebase
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          [ "$ok" = 1 ]
