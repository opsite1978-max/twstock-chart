name: 台指選擇權 Gamma 曝險歷史
on:
  schedule:
    - cron: '20 8,10 * * 1-5'   # 台灣時間 16:20、18:20（選擇權收盤資料公布後）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/txo_scrape.py', 'scripts/txo_lottery.py', '.github/workflows/txo-data.yml']
permissions:
  contents: write
concurrency:
  group: txo-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 計算每日總 Gamma 曝險（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '400'
        run: python3 scripts/txo_scrape.py update
      - name: 台指期籌碼（法人、大額交易人、散戶多空比）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 scripts/txo_scrape.py chips
      - name: 結算日樂透選擇權回測資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REQ_BUDGET: '600'
        run: python3 scripts/txo_lottery.py update
      - name: 存回專案
        run: |
          # 只存這個流程改到的檔案：先抄出來、對齊最新的 main、再放回去提交（不會和其他流程的提交衝突）
          files=$(git status --porcelain --untracked-files=all data/txo | awk '{print $NF}')
          if [ -z "$files" ]; then echo "沒有新資料"; exit 0; fi
          echo "$files"
          mkdir -p /tmp/keep && for f in $files; do mkdir -p "/tmp/keep/$(dirname "$f")"; cp "$f" "/tmp/keep/$f"; done
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && cp -r /tmp/keep/. . && git add $files
            if git diff --cached --quiet; then ok=1; break; fi
            git -c user.name="txo-bot" -c user.email="txo-bot@users.noreply.github.com" commit -qm "台指選擇權 Gamma 曝險歷史更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((RANDOM % 10 + 5))
          done
          [ "$ok" = 1 ]
