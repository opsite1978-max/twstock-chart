name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FinMind 波動率資料
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import os, json, urllib.request, urllib.parse
          T = os.environ['T']
          def fm(p):
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(p)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Bearer ' + T}), timeout=300) as r: j = json.loads(r.read().decode())
                  return j.get('status'), j.get('msg'), j.get('data') or []
              except Exception as e: return 0, str(e)[:150], []
          for d in ['2008-10-06', '2012-01-02', '2015-08-24', '2018-02-06', '2020-03-16', '2022-01-03', '2024-08-05', '2025-04-07', '2026-02-02', '2026-03-02', '2026-11-11']:
              st, msg, rows = fm({'dataset': 'TaiwanOptionVix', 'start_date': d, 'end_date': d})
              print('VIX', d, st, msg, len(rows), rows[:2], rows[-1:] if rows else '')
          st, msg, rows = fm({'dataset': 'TaiwanOptionVix', 'start_date': '2026-10-01', 'end_date': '2026-10-31'})
          print('VIX month', st, msg, len(rows), sorted({r['date'] for r in rows})[:3])
          PY2
          sed -i "s/$T/***/g" out/fund.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
