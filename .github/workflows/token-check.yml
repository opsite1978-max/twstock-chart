name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 匯率資料來源探查
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import os, json, urllib.request, urllib.parse, time
          T = os.environ['T']
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u, hdr=True):
              try:
                  rq = urllib.request.Request(u, headers=H if hdr else {})
                  with urllib.request.urlopen(rq, timeout=60) as r: return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e: return 0, str(e)[:300]
          def fm(p):
              st, b = get('https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(dict(p, token=T)), False)
              try: j = json.loads(b); return j.get('status'), j.get('msg'), j.get('data') or []
              except Exception: return st, b[:200], []
          for ds, extra in [('TaiwanExchangeRate', {'data_id':'USD'}), ('ExchangeRate', {'data_id':'USD'}), ('TaiwanExchangeRate', {})]:
              st, msg, d = fm(dict({'dataset':ds, 'start_date':'2026-11-01'}, **extra))
              print('FM', ds, extra, st, msg, len(d)); [print('  ', json.dumps(x, ensure_ascii=False)) for x in d[:2] + d[-2:]]
          st, msg, d = fm({'dataset':'TaiwanExchangeRate', 'data_id':'USD', 'start_date':'1990-01-01'}); print('FM full', len(d), d[0]['date'] if d else '')
          for iv, rg in [('1m','7d'),('5m','60d'),('15m','60d'),('30m','60d'),('60m','730d'),('1h','730d'),('1d','max'),('1wk','max')]:
              for host in ['query1', 'query2']:
                  st, b = get(f'https://{host}.finance.yahoo.com/v8/finance/chart/TWD=X?interval={iv}&range={rg}')
                  try:
                      r = json.loads(b)['chart']['result'][0]; ts = r.get('timestamp') or []; q = r['indicators']['quote'][0]
                      print('YH', host, iv, rg, st, len(ts), time.strftime('%Y-%m-%d %H:%M', time.gmtime(ts[0])) if ts else '', time.strftime('%Y-%m-%d %H:%M', time.gmtime(ts[-1])) if ts else '', 'o', q['open'][-1], 'h', q['high'][-1], 'l', q['low'][-1], 'c', q['close'][-1], 'tz', r['meta'].get('exchangeTimezoneName'), r['meta'].get('regularMarketPrice'))
                      break
                  except Exception as e: print('YH', host, iv, rg, st, 'FAIL', b[:150].replace('\n', ' '))
          st, b = get('https://stooq.com/q/d/l/?s=usdtwd&i=d'); print('STOOQ', st, b[:120].replace('\n', ' | '), len(b))
          st, b = get('https://www.tpefx.com.tw/'); print('TPEFX', st, len(b))
          st, b = get('https://rate.bot.com.tw/xrt/flcsv/0/day'); print('BOT', st, b[:200].replace('\n', ' | '))
          st, b = get('https://api.cnyes.com/media/api/v1/charting/history?resolution=5&symbol=FX:USDTWD:FOREX&quote=1'); print('CNYES', st, b[:300])
          st, b = get('https://ws.api.cnyes.com/ws/api/v1/charting/history?resolution=5&symbol=FX:USDTWD:FOREX&quote=1'); print('CNYES2', st, b[:300])
          PY2
          sed -i "s/$T/***/g" out/fund.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
