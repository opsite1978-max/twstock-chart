name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 財報、月營收、本益比資料探查
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY' > out/fund.txt 2>&1 || true
          import os, json, time, urllib.request, urllib.parse, collections
          T = os.environ['T']
          def js(p):
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(dict(p, token=T))
              try:
                  with urllib.request.urlopen(u, timeout=120) as r: j = json.loads(r.read().decode())
                  return j.get('status'), j.get('msg'), j.get('data') or []
              except Exception as e: return 0, str(e)[:200], []
          for sid in ['2330', '2317', '2884']:
              st, msg, d = js({'dataset': 'TaiwanStockFinancialStatements', 'data_id': sid, 'start_date': '2024-01-01'})
              print('FS', sid, st, msg, len(d))
              print(' types', sorted(collections.Counter(x['type'] for x in d).items())[:80])
              for x in d:
                  if x['type'] in ('EPS', 'Revenue', 'IncomeAfterTaxes', 'EquityAttributableToOwnersOfParent', 'NetIncomeAttributableToOwnersOfParent', 'IncomeFromContinuingOperations', 'TotalConsolidatedProfitForThePeriod'):
                      print('  ', x['date'], x['type'], x['value'], x.get('origin_name'))
              st, msg, d = js({'dataset': 'TaiwanStockMonthRevenue', 'data_id': sid, 'start_date': '2025-01-01'})
              print('REV', sid, st, msg, len(d))
              for x in d[-14:]: print('  ', json.dumps(x, ensure_ascii=False))
              st, msg, d = js({'dataset': 'TaiwanStockPER', 'data_id': sid, 'start_date': '2026-10-20'})
              print('PER', sid, st, msg, len(d))
              for x in d[-3:]: print('  ', json.dumps(x, ensure_ascii=False))
          for ds in ['TaiwanStockFinancialStatements']:
              st, msg, d = js({'dataset': ds, 'data_id': '0050', 'start_date': '2025-01-01'})
              print('ETF', ds, st, msg, len(d))
          PY
          sed -i "s/$T/***/g" out/fund.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
