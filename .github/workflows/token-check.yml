name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台指波動率資料探查
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import json, re, urllib.request, urllib.parse, time
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u, data=None):
              try:
                  rq = urllib.request.Request(u, data=data, headers=H)
                  with urllib.request.urlopen(rq, timeout=60) as r: return r.status, r.headers.get('content-type'), r.read()
              except Exception as e: return 0, '', str(e)[:200].encode()
          import io, zipfile
          B = 'https://www.taifex.com.tw/file/taifex/Dailydownload/vix/'
          def ok(b): return b[:2] == b'PK' or (len(b) > 300 and b'<HTML' not in b[:300].upper())
          for ym in ['202607', '202606', '202601', '202501', '202301', '202001', '201501', '200901']:
              for name in ['log2data/' + ym + 'new.txt', 'log2data/' + ym + '.txt', 'log2data/' + ym + 'old.txt', 'logdata/' + urllib.parse.quote(ym + '歷史紀錄波動率指數.zip'), 'logdata/' + urllib.parse.quote(ym + '歷史紀錄波動率指數_新VIX.zip'), 'logdata/' + ym + '.zip']:
                  st, ct, b = get(B + name)
                  if ok(b):
                      print('OK', name, len(b)); 
                      if name.endswith('.txt'): print('   ', b[:400].decode('big5', 'replace').replace('\r', '').replace('\n', ' | '))
          for u in ['https://www.taifex.com.tw/cht/7/vixQA', 'https://www.taifex.com.tw/cht/7/vixMinNew']:
              st, ct, b = get(u); t = re.sub(r'<[^>]+>', ' ', b.decode('utf-8', 'replace')); t = re.sub(r'\s+', ' ', t)
              for k in [m.start() for m in re.finditer('新VIX|舊|歷史|起', t)][:6]: print('   TXT', t[max(0, k-150):k+250])
          # FinMind 資料集清單裡有沒有波動率
          st, ct, b = get('https://api.finmindtrade.com/api/v4/datalist?dataset=TaiwanOptionDaily')
          st, ct, b = get('https://api.finmindtrade.com/api/v4/translation?dataset=TaiwanOptionDaily'); print('FMT', st, b[:200])
          PY2
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
