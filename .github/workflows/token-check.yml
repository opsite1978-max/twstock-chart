name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 選擇權逐筆資料探查
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY' > out/opt.txt 2>&1 || true
          import os, json, time, urllib.request, urllib.parse, collections
          T = os.environ['T']
          def js(p):
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(dict(p, token=T))
              t0 = time.time()
              try:
                  with urllib.request.urlopen(u, timeout=300) as r: b = r.read()
                  j = json.loads(b.decode())
                  return j.get('status'), j.get('msg'), j.get('data') or [], len(b), time.time() - t0
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:200], [], 0, time.time() - t0
              except Exception as e: return 0, str(e)[:200], [], 0, time.time() - t0
          st, msg, d, nb, dt = js({'dataset': 'TaiwanOptionDaily', 'data_id': 'TXO', 'start_date': '2026-11-05', 'end_date': '2026-11-05'})
          print('DAILY', st, msg, len(d), nb, round(dt, 1))
          print(' contracts', collections.Counter(str(x.get('contract_date')).strip() for x in d).most_common(20))
          print(' sessions', collections.Counter(x.get('trading_session') for x in d))
          for x in d[:2]: print(' ', json.dumps(x, ensure_ascii=False))
          st, msg, d, nb, dt = js({'dataset': 'TaiwanOptionDaily', 'data_id': 'TXO', 'start_date': '2026-08-01', 'end_date': '2026-11-05'})
          print('DAILY 3m', st, len(d), nb, round(dt, 1))
          for did in ['TXO', 'TX1', 'TX2', 'TXU', 'TXV', 'TXX']:
              st, msg, d, nb, dt = js({'dataset': 'TaiwanOptionTick', 'data_id': did, 'start_date': '2026-11-05'})
              print('TICK', did, st, msg, 'rows', len(d), 'bytes', nb, 'sec', round(dt, 1))
              if d:
                  print('  keys', list(d[0].keys()))
                  for x in d[:3] + d[-3:]: print('  ', json.dumps(x, ensure_ascii=False))
                  print('  option_id', collections.Counter(x.get('option_id') for x in d).most_common(10))
                  print('  contract', collections.Counter(str(x.get('contract_date')).strip() for x in d).most_common(10))
                  tm = sorted(str(x.get('date')) for x in d); print('  time range', tm[0], tm[-1])
                  print('  series', len(set((x.get('contract_date'), x.get('ExercisePrice'), x.get('PutCall')) for x in d)))
          for did in ['TXO']:
              st, msg, d, nb, dt = js({'dataset': 'TaiwanOptionTick', 'data_id': did, 'start_date': '2026-11-04'})
              print('TICK prevday', did, st, 'rows', len(d), nb, round(dt, 1))
          for ds in ['taiwan_options_snapshot']:
              u = 'https://api.finmindtrade.com/api/v4/' + ds + '?' + urllib.parse.urlencode({'data_id': 'TXO', 'token': T})
              try:
                  with urllib.request.urlopen(u, timeout=60) as r: j = json.loads(r.read())
                  d = j.get('data') or []
                  print('SNAP', j.get('status'), len(d)); 
                  for x in d[:3]: print('  ', json.dumps(x, ensure_ascii=False))
              except Exception as e: print('SNAP err', str(e)[:200])
          try:
              with urllib.request.urlopen('https://api.web.finmindtrade.com/v2/user_info?' + urllib.parse.urlencode({'token': T}), timeout=30) as r: j = json.loads(r.read())
              print('USER level', j.get('level'), j.get('level_title'), 'limit', j.get('api_request_limit'), j.get('api_request_limit_hour'), 'used', j.get('user_count'))
          except Exception as e: print('USER err', str(e)[:100])
          PY
          sed -i "s/$T/***/g" out/opt.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
