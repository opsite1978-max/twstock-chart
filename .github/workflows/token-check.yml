name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台指波動率資料探查
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import json, re, urllib.request, urllib.parse, time
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u, data=None):
              try:
                  rq = urllib.request.Request(u, data=data, headers=H)
                  with urllib.request.urlopen(rq, timeout=60) as r: return r.status, r.headers.get('content-type'), r.read()
              except Exception as e: return 0, '', str(e)[:200].encode()
          import io, zipfile
          B = 'https://www.taifex.com.tw/file/taifex/Dailydownload/vix/'
          for ym in ['202611', '202610', '202501', '202301', '202001', '201801', '201501', '201201', '200901', '200612']:
              st, ct, b = get(B + 'log2data/' + ym + 'new.txt')
              ok = st == 200 and b'<HTML' not in b[:200].upper()
              print('DAY', ym, st, len(b), ok)
              if ok and ym in ('202611', '202001', '200901'): print('   ', b[:600].decode('big5', 'replace').replace('\r', '').replace('\n', ' | '))
          for ym in ['202610', '202501', '202301', '202001', '201801', '201501']:
              u = B + 'logdata/' + urllib.parse.quote(ym + '歷史紀錄波動率指數_新VIX.zip')
              st, ct, b = get(u)
              ok = b[:2] == b'PK'
              print('MIN', ym, st, len(b), ok)
              if ok:
                  z = zipfile.ZipFile(io.BytesIO(b)); names = z.namelist(); print('   files', len(names), names[:3])
                  if ym in ('202610', '201501'):
                      t = z.read(names[0]).decode('big5', 'replace').replace('\r', '')
                      ls = t.split('\n'); print('   lines', len(ls)); print('   ', ' | '.join(ls[:6])); print('   ', ' | '.join(ls[-4:]))
          for u in ['https://www.taifex.com.tw/cht/7/vixMinNew']:
              st, ct, b = get(u); t = b.decode('utf-8', 'replace')
              for m in re.findall(r"window.open\('([^']+)'\)", t)[:12]: print('   CUR', m)
          PY2
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
