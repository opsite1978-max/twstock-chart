name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 成本估算比較
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 scripts/spreadosc.py > out/osc.txt 2>&1 || true
          sed -i "s/$T/***/g" out/osc.txt
      - name: 查詢憑證狀態（只記錄狀態，不記錄憑證）
        if: false
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY' > out/log.txt 2>&1
          import os, json, urllib.request, urllib.parse
          t = os.environ.get('T', '')
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r: b = r.read().decode(); return r.status, (b[:250] + ' ... ' + b[-250:] + ' len=' + str(len(b)))
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:600]
              except Exception as e: return 0, str(e)[:300]
          import datetime
          td = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).date().isoformat()
          D = 'https://api.finmindtrade.com/api/v4/data?'
          def cnt(url, key):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r: j = json.loads(r.read().decode())
              except Exception as e: return 'ERR ' + str(e)[:120]
              d = j.get('data') or []
              ev = [x for x in d if str(x.get(key, ''))[-8:] >= '15:00:00' or str(x.get(key,'')) >= '15:00:00']
              last = max((str(x.get(key, '')) for x in d), default='')
              return f"status={j.get('status')} msg={j.get('msg')} rows={len(d)} night_rows={len(ev)} max_{key}={last}"
          def js(params):
              try:
                  with urllib.request.urlopen(D + urllib.parse.urlencode(dict(params, token=t)), timeout=60) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e: return {'status': e.code, 'msg': e.read().decode()[:200]}
              except Exception as e: return {'status': 0, 'msg': str(e)[:200]}
          from collections import Counter
          j = js({'dataset': 'TaiwanFuturesInstitutionalInvestors', 'data_id': 'TX', 'start_date': '2026-10-07'})
          d = j.get('data') or []
          print('INST', j.get('status'), len(d))
          for x in d[-6:]: print('INST row', json.dumps(x, ensure_ascii=False)[:600])
          j = js({'dataset': 'TaiwanFuturesInstitutionalInvestorsAfterHours', 'data_id': 'TX', 'start_date': '2026-10-07'})
          d = j.get('data') or []
          print('INSTAH', j.get('status'), j.get('msg'), len(d))
          for x in d[-3:]: print('INSTAH row', json.dumps(x, ensure_ascii=False)[:600])
          j = js({'dataset': 'TaiwanFuturesDaily', 'data_id': 'TX', 'start_date': '2026-10-12'})
          d = j.get('data') or []
          for x in d: 
              if str(x.get('contract_date')).strip() in ('202610',): print('TX', json.dumps(x, ensure_ascii=False)[:400])
          for ds in ['TaiwanFuturesOpenInterestLargeTraders', 'TaiwanFuturesInstitutionalInvestors']:
              j = js({'dataset': ds, 'data_id': 'TX', 'start_date': '2025-01-01'})
              d = j.get('data') or []
              print('DEPTH', ds, len(d), d[0].get('date') if d else None)
          PY
          cat out/log.txt | sed 's/[A-Za-z0-9._-]\{40,\}/***/g'
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
