name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 產業鏈頁面結構（缺的產業）
        run: |
          mkdir -p out
          for c in 5300 U000 T000 AB10 R000 O000; do curl -s -A "Mozilla/5.0" "https://ic.tpex.org.tw/introduce.php?ic=$c" -o out/$c.html; done
          echo ok > out/fund.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
