name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台指波動率資料探查
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import json, re, urllib.request, urllib.parse, time
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u, data=None):
              try:
                  rq = urllib.request.Request(u, data=data, headers=H)
                  with urllib.request.urlopen(rq, timeout=60) as r: return r.status, r.headers.get('content-type'), r.read()
              except Exception as e: return 0, '', str(e)[:200].encode()
          for u in ['https://www.taifex.com.tw/cht/7/vixMinNew', 'https://www.taifex.com.tw/cht/7/vixDaily3MNew', 'https://www.taifex.com.tw/cht/7/vixMin3MNew']:
              st, ct, b = get(u); t = b.decode('utf-8', 'replace')
              print('PAGE', u, st, len(b))
              k = t.find('<main') if '<main' in t else t.find('id="printhere"')
              body = re.sub(r'<script[\s\S]*?</script>', '', t)
              for m in re.findall(r'<(?:form|a|button|input)[^>]*(?:action|onclick|href|download)[^>]*>', body):
                  if re.search(r'vix|down|txt|csv|zip|Down|file', m, re.I): print('   ', m[:220])
              for m in re.findall(r'<script[^>]*>([\s\S]*?)</script>', t):
                  if re.search(r'vix|down|file', m, re.I): print('   SCRIPT', re.sub(r'\s+', ' ', m)[:900])
              tx = re.sub(r'<[^>]+>', ' ', body); tx = re.sub(r'\s+', ' ', tx)
              k = tx.find('波動率'); print('   TEXT', tx[k:k+1500])
          PY2
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
