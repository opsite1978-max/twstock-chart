name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台指波動率資料探查
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import json, re, urllib.request, urllib.parse, time
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u, data=None):
              try:
                  rq = urllib.request.Request(u, data=data, headers=H)
                  with urllib.request.urlopen(rq, timeout=60) as r: return r.status, r.headers.get('content-type'), r.read()
              except Exception as e: return 0, '', str(e)[:200].encode()
          for u in ['https://www.taifex.com.tw/cht/7/vixMinNew', 'https://www.taifex.com.tw/cht/7/vixDaily', 'https://www.taifex.com.tw/cht/7/vixQAnew', 'https://www.taifex.com.tw/cht/7/vix']:
              st, ct, b = get(u); t = b.decode('utf-8', 'replace')
              print('PAGE', u, st, ct, len(b))
              for m in sorted(set(re.findall(r'(?:href|src|value)=["\']([^"\']*(?:vix|VIX|txt|zip|csv)[^"\']*)', t)))[:40]: print('   ', m)
          for u in ['https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/20261110new.txt', 'https://www.taifex.com.tw/file/taifex/Dailydownload/vix/log2data/20261110.txt', 'https://www.taifex.com.tw/file/taifex/Dailydownload/vixMinNew/20261110new.txt']:
              st, ct, b = get(u); print('FILE', u, st, ct, len(b)); print('   ', b[:300].decode('big5', 'replace').replace('\n', ' | '))
          for q in ['VIX', '波動率', '臺指選擇權波動率指數']:
              st, ct, b = get('https://ess.api.cnyes.com/ess/api/v1/siteSearch/main?q=' + urllib.parse.quote(q) + '&limit=20&category=TW,FUND,FX,INDEX')
              print('CNSEARCH', q, st, b[:600].decode('utf-8', 'replace'))
          for sym in ['TWS:VIXTWN:INDEX', 'TWF:VIXTWN:INDEX', 'TWS:TWVIX:INDEX', 'TWF:VIX:INDEX', 'GI:VIXTWN:INDEX', 'TWS:VIX:INDEX']:
              st, ct, b = get('https://ws.api.cnyes.com/ws/api/v1/charting/history?resolution=D&symbol=' + sym + '&quote=1')
              print('CN', sym, st, b[:200].decode('utf-8', 'replace'))
          for s in ['^VIXTWN', 'VIXTWN.TW', '^TWVIX']:
              st, ct, b = get('https://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(s) + '?interval=1d&range=1mo')
              print('YH', s, st, b[:200].decode('utf-8', 'replace'))
          PY2
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
