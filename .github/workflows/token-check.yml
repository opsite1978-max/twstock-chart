name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 特殊端點
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out; B=https://api.finmindtrade.com/api/v4
          q(){ echo "== $1" >> out/sp.txt; curl -s -m 120 -H "Authorization: Bearer $T" "$B/$1" -o r.bin -w "http %{http_code} size %{size_download} type %{content_type}\n" >> out/sp.txt; head -c 700 r.bin | tr -d '\000' >> out/sp.txt; echo >> out/sp.txt; }
          for ds in TaiwanStockMarginMaintenance TaiwanStockBrokerDailyConcentration TaiwanStockTradingDailyReportSecIdAgg TaiwanStockTreasuryStock TaiwanStockTreasuryStockBuyBack TaiwanStockTreasuryShares; do
            q "data?dataset=$ds&data_id=2425&start_date=2026-10-01&end_date=2026-11-20"
          done
          q "data?dataset=TaiwanStockMarginMaintenance&start_date=2026-11-19&end_date=2026-11-19"
          q "data?dataset=TaiwanStockTradingDailyReport&data_id=2425&start_date=2026-11-19"
          q "data?dataset=TaiwanStockMarginPurchaseShortSale&data_id=2425&start_date=2026-11-10"
          q "datalist?dataset=TaiwanStockTreasuryStock"
          sed -i "s/$T/***/g" out/*.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
