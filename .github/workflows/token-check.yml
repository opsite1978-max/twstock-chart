name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 分點資料能查多久以前、一次能不能查多天、每小時上限
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out; A=https://api.finmindtrade.com/api/v4/data
          curl -s -H "Authorization: Bearer $T" "https://api.web.finmindtrade.com/v2/user_info" | python3 -c "import json,sys;j=json.load(sys.stdin);print({k:j.get(k) for k in ('user_count','api_request_limit','api_request_limit_hour','level','level_title')})" > out/user.txt 2>&1
          for d in 2021-06-01 2022-06-01 2023-06-01 2024-06-03 2025-06-03; do
            n=$(curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReport&data_id=2330&start_date=$d" | python3 -c "import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print(len(d),sorted({r['date'] for r in d})[:3],j.get('msg','')[:80])")
            echo "$d $n" >> out/hist.txt
          done
          curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReport&data_id=2330&start_date=2026-11-02&end_date=2026-11-06" | python3 -c "import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print('range',len(d),sorted({r['date'] for r in d}),j.get('msg','')[:120])" > out/range.txt
          curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReportSecIdAgg&data_id=2330&securities_trader_id=1020&start_date=2026-10-01&end_date=2026-11-13" | python3 -c "import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print('agg',len(d),d[:2],j.get('msg','')[:120])" > out/agg.txt
          curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReportSecIdAgg&securities_trader_id=1020&start_date=2026-11-13&end_date=2026-11-13" | python3 -c "import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print('agg-all',len(d),d[:2],j.get('msg','')[:120])" >> out/agg.txt
          curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReport&start_date=2026-11-13" | python3 -c "import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print('noid',len(d),j.get('msg','')[:120])" >> out/range.txt
          sed -i "s/$T/***/g" out/*.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
