name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EODHD 探查
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import json, urllib.request
          def go(u, method='GET'):
              rq = urllib.request.Request(u, method=method, headers={'Origin': 'https://opsite1978-max.github.io', 'Access-Control-Request-Method': 'GET', 'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(rq, timeout=60) as r:
                      hd = {k: v for k, v in r.headers.items() if 'access-control' in k.lower() or k.lower() == 'content-type'}
                      return r.status, hd, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, {k: v for k, v in e.headers.items() if 'access-control' in k.lower()}, e.read().decode('utf-8', 'replace')[:200]
              except Exception as e: return 0, {}, str(e)[:200]
          B = 'https://eodhd.com/api/'
          for path in ['eod/AAPL.US?api_token=demo&fmt=json&from=2026-10-25', 'intraday/AAPL.US?api_token=demo&fmt=json&interval=5m', 'real-time/AAPL.US?api_token=demo&fmt=json', 'eod/2330.TW?api_token=demo&fmt=json&from=2026-10-25', 'exchange-symbol-list/TW?api_token=demo&fmt=json', 'search/TSMC?api_token=demo']:
              st, hd, b = go(B + path)
              print(path.split('?')[0], st, hd, b[:300].replace('\n', ' '))
          st, hd, b = go(B + 'eod/AAPL.US?api_token=demo&fmt=json', 'OPTIONS'); print('OPTIONS', st, hd)
          PY2
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
