name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 權證分點
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out; A=https://api.finmindtrade.com/api/v4/data
          for W in 066186 066073 03xxxx; do
          curl -s -H "Authorization: Bearer $T" "$A?dataset=TaiwanStockTradingDailyReport&data_id=$W&start_date=2026-11-13" | python3 -c "
          import json,sys;j=json.load(sys.stdin);d=j.get('data') or [];print('$W rows',len(d),j.get('msg','')[:100])
          br={}
          for r in d:
            b=br.setdefault(r['securities_trader_id']+' '+r['securities_trader'],[0,0,0]);b[0]+=r['buy'];b[1]+=r['sell'];b[2]+=1
          print(len(br),sorted(br.items(),key=lambda kv:-(kv[1][0]+kv[1][1]))[:15])" >> out/wbr3.txt
          done
          sed -i "s/$T/***/g" out/*.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
