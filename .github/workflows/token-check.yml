name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FinMind 美股
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY2' > out/fund.txt 2>&1 || true
          import os, json, urllib.request, urllib.parse
          T = os.environ['T']
          def fm(p):
              u = 'https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(p)
              rq = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + T, 'Origin': 'https://opsite1978-max.github.io'})
              try:
                  with urllib.request.urlopen(rq, timeout=300) as r:
                      cors = r.headers.get('access-control-allow-origin'); j = json.loads(r.read().decode())
                  return j.get('status'), j.get('msg'), j.get('data') or [], cors
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:200], [], None
              except Exception as e: return 0, str(e)[:150], [], None
          for p in [{'dataset': 'USStockInfo'},
                    {'dataset': 'USStockPrice', 'data_id': 'AAPL', 'start_date': '1980-01-01'},
                    {'dataset': 'USStockPrice', 'data_id': 'NVDA', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPrice', 'data_id': 'TSM', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPrice', 'data_id': 'SPY', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPrice', 'data_id': '^GSPC', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPrice', 'data_id': 'BRK.B', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPrice', 'data_id': 'BRK-B', 'start_date': '2026-11-01'},
                    {'dataset': 'USStockPriceMinute', 'data_id': 'AAPL', 'start_date': '2026-11-10', 'end_date': '2026-11-10'},
                    {'dataset': 'USStockPriceMinute', 'data_id': 'AAPL', 'start_date': '2026-10-01', 'end_date': '2026-11-11'},
                    {'dataset': 'USStockPriceMinute', 'data_id': 'AAPL', 'start_date': '2025-01-06', 'end_date': '2025-01-06'}]:
              st, msg, d, cors = fm(p)
              print(json.dumps(p), st, msg, len(d), 'cors', cors)
              if d:
                  print('   first', json.dumps(d[0], ensure_ascii=False)); print('   last ', json.dumps(d[-1], ensure_ascii=False))
                  if p['dataset'] == 'USStockInfo':
                      print('   sample', [ (x.get('stock_id'), x.get('stock_name')) for x in d[:8]], 'n', len(d))
                      print('   has', [x for x in d if x.get('stock_id') in ('TSM', 'SPY', 'QQQ', '^GSPC', 'SOXX')][:6])
          PY2
          sed -i "s/$T/***/g" out/fund.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
