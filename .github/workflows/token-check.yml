name: FinMind 憑證檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 特殊端點
        env:
          T: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p out; B=https://api.finmindtrade.com/api/v4
          q(){ echo "== $1" >> out/sp.txt; curl -s -m 120 -H "Authorization: Bearer $T" "$B/$1" -o r.bin -w "http %{http_code} size %{size_download} type %{content_type}\n" >> out/sp.txt; head -c 700 r.bin | tr -d '\000' >> out/sp.txt; echo >> out/sp.txt; }
          q "taiwan_stock_trading_daily_report_secid_agg?data_id=2330&start_date=2026-10-01&end_date=2026-11-13"
          q "taiwan_stock_trading_daily_report_secid_agg?data_id=2330&securities_trader_id=9268&start_date=2026-06-01&end_date=2026-11-13"
          q "taiwan_stock_trading_daily_report_secid_agg?securities_trader_id=9268&start_date=2026-11-13&end_date=2026-11-13"
          q "taiwan_stock_warrant_trading_daily_report?data_id=066186&date=2026-11-13"
          q "taiwan_stock_warrant_trading_daily_report?securities_trader_id=9268&date=2026-11-13"
          q "taiwan_stock_warrant_trading_daily_report?date=2026-11-13"
          q "taiwan_stock_trading_daily_report?securities_trader_id=9268&date=2026-11-13"
          q "storage_objects?dataset=TaiwanStockWarrantTradingDailyReport&date=2026-11-13"
          q "storage_objects?dataset=TaiwanStockTradingDailyReportSecIdAgg&date=2026-11-13"
          q "data?dataset=TaiwanStockInfoWithWarrantSummary&data_id=066186&start_date=2026-11-13"
          q "data?dataset=TaiwanStockInfoWithWarrantSummary&start_date=2026-11-13"
          sed -i "s/$T/***/g" out/*.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
