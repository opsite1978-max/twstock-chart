name: 股期資料格式檢查（暫時）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 抓樣本
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir out && cat > p.py <<'PY'
          import json, os, urllib.request, urllib.parse, collections
          tok = os.environ['FINMIND_TOKEN']
          out = []
          Q = [dict(dataset='TaiwanFuturesDaily', data_id='CDF', start_date='2026-09-01'),
               dict(dataset='TaiwanFuturesInstitutionalInvestors', data_id='CDF', start_date='2026-10-01'),
               dict(dataset='TaiwanFuturesOpenInterestLargeTraders', data_id='CDF', start_date='2026-10-05'),
               dict(dataset='TaiwanOptionDaily', data_id='CDO', start_date='2026-10-08', end_date='2026-10-08'),
               dict(dataset='TaiwanStockInstitutionalInvestorsBuySell', data_id='2330', start_date='2026-10-01'),
               dict(dataset='TaiwanDailyShortSaleBalances', data_id='2330', start_date='2026-10-01'),
               dict(dataset='TaiwanStockSecuritiesLending', data_id='2330', start_date='2026-10-01'),
               dict(dataset='TaiwanStockDividend', data_id='2330', start_date='2025-01-01'),
               dict(dataset='TaiwanFutOptDailyInfo', start_date='2026-10-08')]
          for q in Q:
              q2 = dict(q, token=tok)
              try:
                  j = json.loads(urllib.request.urlopen('https://api.finmindtrade.com/api/v4/data?' + urllib.parse.urlencode(q2), timeout=120).read())
              except Exception as e:
                  body = ''
                  if hasattr(e, 'read'):
                      try: body = e.read().decode()[:200]
                      except Exception: pass
                  out.append({'q': q, 'err': str(e)[:150], 'body': body}); continue
              rows = j.get('data') or []
              info = {'q': q, 'n': len(rows), 'keys': list(rows[0].keys()) if rows else None, 'first': rows[:3], 'last': rows[-3:]}
              if q['dataset'] == 'TaiwanFuturesDaily':
                  pos = [r for r in rows if r['trading_session'] == 'position']
                  byd = collections.defaultdict(int)
                  for r in pos: byd[r['date']] += r['open_interest']
                  info['oi_by_date'] = sorted(byd.items())[-12:]
                  info['contracts'] = sorted(set(r['contract_date'] for r in rows))
              if q['dataset'] == 'TaiwanOptionDaily':
                  info['contracts'] = collections.Counter(r['contract_date'] for r in rows).most_common()
                  info['oi'] = sum(r['open_interest'] for r in rows if r['trading_session'] == 'position')
              if q['dataset'] == 'TaiwanFutOptDailyInfo':
                  info['opts'] = [(r['code'], r['name']) for r in rows if r['type'] == 'TaiwanOptionDaily'][:300]
                  info['first'] = info['last'] = None
              out.append(info)
          open('out/fs.json', 'w').write(json.dumps(out, ensure_ascii=False, indent=1, default=str).replace(tok, '***'))
          PY
          python3 p.py
      - name: 存結果
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
