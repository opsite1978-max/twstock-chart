name: probe-finmind-sponsor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          FM: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir out; cd out
          python3 - <<'PY' > result.txt 2>&1
          import os, json, urllib.request, time
          tok = os.environ.get('FM', '').strip()
          print('secret present:', bool(tok), 'length ok:', len(tok) > 50)
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + tok})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode())
                  except Exception: return e.code, {}
          s, j = get('https://api.web.finmindtrade.com/v2/user_info')
          print('user_info', s, {k: j.get(k) for k in ('level', 'level_title', 'api_request_limit', 'user_count')})
          s, j = get('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanSecuritiesTraderInfo')
          d = j.get('data') or []; print('trader info', s, len(d), d[:2])
          t0 = time.time()
          s, j = get('https://api.finmindtrade.com/api/v4/taiwan_stock_warrant_trading_daily_report?securities_trader_id=9200&date=2026-10-08')
          d = j.get('data') or []; print('warrant by broker 9200', s, j.get('msg'), len(d), round(time.time() - t0, 1), 's', d[:3])
          s, j = get('https://api.finmindtrade.com/api/v4/taiwan_stock_warrant_trading_daily_report?data_id=064107&date=2026-10-08')
          d = j.get('data') or []; print('warrant by code 064107', s, j.get('msg'), len(d), d[:3])
          s, j = get('https://api.finmindtrade.com/api/v4/taiwan_stock_trading_daily_report?data_id=2330&date=2026-10-08')
          d = j.get('data') or []; print('stock branch 2330', s, j.get('msg'), len(d))
          s, j = get('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockWarrantTradingDailyReport&date=2026-10-08')
          print('bulk day (sponsorpro?)', s, j.get('msg'), len(j.get('data') or []))
          PY
          sed -i "s/$FM/***/g" result.txt 2>/dev/null || true
      - name: save
        run: |
          cd out; git init -q -b probe-out
          git -c user.name=bot -c user.email=bot@x add -A; git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
