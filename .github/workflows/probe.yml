name: probe-tdcc
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          curl -sS -m 90 -A "$UA" -L -o od.csv -w "opendata %{http_code} %{size_download}\n" "https://opendata.tdcc.com.tw/getOD.ashx?id=1-5" >> codes.txt 2>&1 || true
          head -c 600 od.csv > od_head.txt || true
          wc -l od.csv >> codes.txt || true
          curl -sS -m 60 -A "$UA" -c cj.txt -b cj.txt -o q1.html -w "qry-get %{http_code} %{size_download}\n" "https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" >> codes.txt 2>&1 || true
          TOK=$(grep -oE 'name="SYNCHRONIZER_TOKEN"[^>]*value="[^"]+"' q1.html | grep -oE 'value="[^"]+"' | head -1 | cut -d'"' -f2)
          echo "token=$TOK" >> codes.txt
          grep -oE '<option value="[0-9]{8}"' q1.html | head -60 > dates.txt || true
          wc -l dates.txt >> codes.txt
          D1=$(head -1 dates.txt | grep -oE '[0-9]{8}'); D9=$(sed -n 30p dates.txt | grep -oE '[0-9]{8}')
          for D in $D1 $D9; do
            curl -sS -m 60 -A "$UA" -c cj.txt -b cj.txt -e "https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" \
              --data-urlencode "SYNCHRONIZER_TOKEN=$TOK" --data-urlencode "SYNCHRONIZER_URI=/portal/zh/smWeb/qryStock" \
              --data-urlencode "method=submit" --data-urlencode "firDate=$D1" --data-urlencode "scaDate=$D" \
              --data-urlencode "sqlMethod=StockNo" --data-urlencode "stockNo=2330" --data-urlencode "stockName=" \
              -o "q_$D.html" -w "qry-post $D %{http_code} %{size_download}\n" "https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" >> codes.txt 2>&1 || true
            TOK=$(grep -oE 'name="SYNCHRONIZER_TOKEN"[^>]*value="[^"]+"' "q_$D.html" | grep -oE 'value="[^"]+"' | head -1 | cut -d'"' -f2)
            echo "token2=$TOK" >> codes.txt
          done
          # speed test: 20 quick queries
          T0=$(date +%s); n=0
          for S in 2317 2454 2303 1301 2882 2308 2412 1216 2002 2891; do
            curl -sS -m 60 -A "$UA" -c cj.txt -b cj.txt -e "https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" \
              --data-urlencode "SYNCHRONIZER_TOKEN=$TOK" --data-urlencode "SYNCHRONIZER_URI=/portal/zh/smWeb/qryStock" \
              --data-urlencode "method=submit" --data-urlencode "firDate=$D1" --data-urlencode "scaDate=$D9" \
              --data-urlencode "sqlMethod=StockNo" --data-urlencode "stockNo=$S" --data-urlencode "stockName=" \
              -o "s_$S.html" -w "speed $S %{http_code} %{size_download} %{time_total}\n" "https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" >> codes.txt 2>&1 || true
            TOK=$(grep -oE 'name="SYNCHRONIZER_TOKEN"[^>]*value="[^"]+"' "s_$S.html" | grep -oE 'value="[^"]+"' | head -1 | cut -d'"' -f2)
          done
          echo "elapsed $(( $(date +%s) - T0 ))" >> codes.txt
          rm -f od.csv cj.txt
      - name: save
        run: |
          cd out; git init -q -b probe-out
          git -c user.name=bot -c user.email=bot@x add -A; git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
