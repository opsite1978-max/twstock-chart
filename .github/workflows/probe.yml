name: probe-warrant-tick
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          curl -sS -m 120 -A "$UA" -o q.json -w "tpex_warrant_quts %{http_code} %{size_download}\n" "https://www.tpex.org.tw/openapi/v1/tpex_warrant_quts" >> codes.txt 2>&1 || true
          python3 - <<'PY' >> codes.txt
          import json, collections
          try:
              d = json.load(open('q.json', encoding='utf-8-sig'))
              print('rows', len(d)); print(json.dumps(d[:3], ensure_ascii=False)[:1200])
              ks = collections.Counter(tuple(x.keys()) for x in d); print(list(ks)[:2])
          except Exception as e:
              s = open('q.json', encoding='utf-8', errors='replace').read(1500); print('parse fail', e, s)
          PY
          rm -f q.json
      - name: save
        run: |
          cd out; git init -q -b probe-out
          git -c user.name=bot -c user.email=bot@x add -A; git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
