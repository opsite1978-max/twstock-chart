name: probe-warrant
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          curl -sS -m 90 -A "$UA" -o oa_daily.json -w "oa_daily %{http_code} %{size_download}\n" "https://www.tpex.org.tw/openapi/v1/tpex_warrant_daily_quts" >> codes.txt 2>&1 || true
          curl -sS -m 90 -A "$UA" -o oa_issue.json -w "oa_issue %{http_code} %{size_download}\n" "https://www.tpex.org.tw/openapi/v1/tpex_warrant_issue" >> codes.txt 2>&1 || true
          curl -sS -m 90 -A "$UA" -o oa_37.json -w "oa_37O %{http_code} %{size_download}\n" "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap37_O" >> codes.txt 2>&1 || true
          for se in AL EW WW; do
            curl -sS -m 90 -A "$UA" -o "web_$se.json" -w "web_$se %{http_code} %{size_download}\n" "https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?l=zh-tw&o=json&d=115/10/07&se=$se" >> codes.txt 2>&1 || true
          done
          curl -sS -m 90 -A "$UA" -o www_new.json -w "www_new %{http_code} %{size_download}\n" "https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date=2026%2F10%2F07&type=AL&response=json" >> codes.txt 2>&1 || true
          curl -sS -m 90 -A "$UA" -o twse_0999P.json -w "twse0999P %{http_code} %{size_download}\n" "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260915&type=0999P&response=json" >> codes.txt 2>&1 || true
          python3 - <<'PY' >> codes.txt
          import json,glob
          for f in sorted(glob.glob('*.json')):
              try: d=json.load(open(f,encoding='utf-8-sig'))
              except Exception as e: print(f,'parse fail',e); continue
              if isinstance(d,list):
                  print(f,'list',len(d), json.dumps(d[0],ensure_ascii=False)[:400] if d else '')
                  w=[x for x in d if any(str(v).startswith('7') and len(str(v))==6 for v in x.values())][:1]
                  print('  sample7', json.dumps(w,ensure_ascii=False)[:300])
              else:
                  tabs=d.get('tables') or []
                  for t in tabs:
                      if t and t.get('data'):
                          dd=t['data']; w=[r for r in dd if str(r[0]).startswith('7') or (len(r)>1 and str(r[1]).startswith('7'))]
                          print(f,'table',t.get('title'),len(dd),'fields',t.get('fields'),'| warrant-like',len(w), w[:1])
                  if 'aaData' in d: print(f,'aaData',len(d['aaData']), d['aaData'][:1])
          PY
          rm -f *.json
      - name: save
        run: |
          cd out; git init -q -b probe-out
          git -c user.name=bot -c user.email=bot@x add -A; git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
