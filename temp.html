<!doctype html>
<html lang="zh-Hant">
<head>

<title>個股溫度</title>

<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#e3e6eb;--line2:#cfd4dc;--fg:#1b1f27;--muted:#5d6675;--dim:#8a93a2;

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--panel:#161a21;--panel2:#1d222b;--line:#262c36;--line2:#343c48;--fg:#e8ebf0;--muted:#9aa3b2;--dim:#6e7787;

:root[data-theme="dark"]{--bg:#0e1116;--panel:#161a21;--panel2:#1d222b;--line:#262c36;--line2:#343c48;--fg:#e8ebf0;--muted:#9aa3b2;--dim:#6e7787;
  --accent:#e0b04a;--up:#ff5a52;--down:#2fc285;--cold:#5b9bf0;--warm:#f0c040;--hot:#ff5a52}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:12px}
header h1{font-size:20px;margin:0;font-weight:800}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.sub{color:var(--muted);font-size:12.5px}
.sp{flex:1}
.btn,.seg button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-block}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14.5px}
.note{color:var(--muted);font-size:12.5px;line-height:1.65}
.big{font:800 26px/1.1 var(--mono)}
.u{color:var(--up)}.d{color:var(--down)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line2);white-space:nowrap}
.pill.pre{background:var(--hot);color:#fff;border-color:var(--hot)}
.pill.run{background:var(--panel2);color:var(--muted)}
.pill.hot{color:var(--hot);border-color:var(--hot)}
.pill.warm{color:var(--warm);border-color:var(--warm)}
.pill.cold{color:var(--cold);border-color:var(--cold)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--panel2);position:sticky;top:0}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
td small{display:block;color:var(--dim);font-size:11px}
.thermo{display:flex;align-items:center;gap:8px;min-width:132px}
.thermo .t{font:800 15px var(--mono);width:34px;text-align:right}
.thermo .b{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.thermo .b i{display:block;height:100%;border-radius:99px}
.four{display:grid;grid-template-columns:repeat(4,30px);gap:3px;align-items:end;height:30px}
.four i{display:block;border-radius:2px 2px 0 0;background:var(--accent);opacity:.85}
.det td{white-space:normal;text-align:left;background:var(--panel2);cursor:default;font-size:13px;line-height:1.7}
.det .row4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.det b{font-weight:700}
.legend4{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.mt{margin-top:14px}
@media (max-width:640px){.hide-m{display:none}.big{font-size:22px}.det .row4{grid-template-columns:1fr;position:sticky;left:10px;width:calc(100vw - 54px)}}
</style>

    '<div class="card"><h3>今天的分布</h3><div class="pills">' + ['pre', 'hot', 'warm', 'run', 'cold'].map(k => '<span class="pill ' + ST[k][1] + '">' + ST[k][0] + ' ' + cnt(k) + '</span>').join('') + '</div><div class="note" style="margin-top:8px">' + (cnt('pre') ? '' : '今天沒有符合「即將發動前期」的股票：大盤回檔中，多數高溫股不是已經漲過，就是還在月線下。') + '</div></div>' +
    '<div class="card"><h3>回測（樣本 150 檔）</h3><div class="note">「發動」＝之後 20 個交易日內漲到平常波動的 2 倍以上（至少 10%），而且中途沒先大跌。<br>隨便挑：<b>' + D.bt.base + '%</b>　每天溫度前 5 名：<b class="u">' + D.bt.top + '%</b>　即將發動前期：<b class="u">' + D.bt.pre + '%</b>（' + D.bt.npre + ' 次）</div></div>';
  $('flt').innerHTML = [['all', '全部'], ['pre', '即將發動前期'], ['hot', '高溫'], ['warm', '升溫中'], ['run', '已發動']].map(([k, t]) => '<button data-k="' + k + '" aria-pressed="' + (F === k) + '">' + t + '</button>').join('');
}
function detail(r){
  const t = (v, u = '%', d = 0) => v == null ? '—' : num(v, d) + u;
  return '<tr class="det"><td colspan="10"><div class="row4">' +
    '<div><b>量能 ' + r[3] + ' 分</b>：近 5 日量是 60 日均量的 ' + num(r[11], 2) + ' 倍；過去 20 天最低曾縮到 ' + num(r[12], 2) + ' 倍。「先縮後醒」最好。</div>' +
    '<div><b>籌碼 ' + r[4] + ' 分</b>：前 15 大分點 5 日淨買佔成交量 ' + t(r[13], '%', 1) + '，賣超家數比買超家數多 ' + t(r[14], '%') + '（籌碼往少數人集中）。中高度集中最好，極端大買常是隔日沖或已經漲過。</div>' +
    '<div><b>賣壓消化 ' + r[5] + ' 分</b>：從 60 日高點以來累積換手 ' + t(r[15]) + '；獲利盤 ' + t(r[16]) + '、套牢盤 ' + t(r[17]) + '；60 日漲跌 ' + sgn(r[10]) + '%（低基期加分）。</div>' +
    '<div><b>型態 ' + r[6] + ' 分</b>：在 60 日區間的 ' + t(r[18]) + ' 位置；距月線 ' + sgn(r[19]) + '%；波動寬度在近半年第 ' + t(r[20], '') + ' 百分位（從收斂開始擴張最好）。</div>' +
    '</div></td></tr>';
}
function render(){
  head();
  const L = DATA.rows.filter(r => F === 'all' || r[7] === F);
  $('tb').innerHTML = L.length ? L.map((r, k) => {
    const s = ST[r[7]];
    return '<tr data-c="' + r[0] + '"><td>' + (k + 1) + '</td><td><b>' + r[1] + '</b><small>' + r[0] + '・' + num(r[21], r[21] >= 100 ? 0 : 2) + '</small></td>' +
      '<td><div class="thermo"><span class="t" style="color:' + tcol(r[2]) + '">' + Math.round(r[2]) + '</span><span class="b"><i style="width:' + r[2] + '%;background:' + tcol(r[2]) + '"></i></span></div></td>' +
      '<td class="hide-m"><div class="four">' + [3, 4, 5, 6].map(i => '<i style="height:' + Math.max(2, r[i] * .3) + 'px" title="' + ['量能', '籌碼', '賣壓消化', '型態'][i - 3] + ' ' + r[i] + '"></i>').join('') + '</div></td>' +
      '<td><span class="pill ' + s[1] + '">' + s[0] + '</span></td><td class="' + cls(r[8]) + '">' + sgn(r[8]) + '%</td><td class="' + cls(r[9]) + '">' + sgn(r[9]) + '%</td>' +
      '<td class="hide-m">' + num(r[11], 2) + '</td><td class="hide-m ' + cls(r[13]) + '">' + (r[13] == null ? '—' : sgn(r[13]) + '%') + '</td>' +
      '<td><a class="btn" style="font-size:12px;padding:3px 8px" href="zhanshen-me.html?s=' + r[0] + '" target="_blank" rel="noopener">戰神</a></td></tr>' + (OPEN === r[0] ? detail(r) : '');
  }).join('') : '<tr><td colspan="10" style="text-align:center;color:var(--dim)">今天沒有符合的股票</td></tr>';
  $('how').innerHTML =
    '<div class="card"><h3>溫度怎麼算（0～100 度）</h3><div class="note">四項各佔 25 分，每一項都是「今天和其他股票相比排第幾」換成分數：<br>' +
    '<b>量能</b>：先量縮、最近開始放量。<br><b>主力籌碼</b>：前 15 大分點淨買佔量中高、賣超家數多於買超家數（籌碼集中）。<br>' +
    '<b>賣壓消化</b>：從前高以來換手夠多、獲利盤多套牢盤少、3 個月內還沒大漲。<br><b>型態</b>：波動從收斂開始擴張、站上月線、位置不在低檔。<br>' +
    '<b>即將發動前期</b>＝溫度 ≥ 65、20 日漲幅 < 15%、5 日漲幅 < 8%、站上月線（熱了但還沒噴）。<b>已發動</b>＝20 日已漲 ≥ 15% 或 5 日已漲 ≥ 8%。</div></div>' +
    '<div class="card"><h3>每月回測</h3><div class="tblwrap" style="border:0"><table><thead><tr><th>月份</th><th>隨便挑</th><th>溫度前 5</th><th>即將發動前期</th></tr></thead><tbody>' +
    DATA.bt.m.map(m => '<tr style="cursor:default"><td>' + m[0] + '</td><td>' + m[1] + '%</td><td class="' + (m[2] > m[1] ? 'u' : 'd') + '">' + m[2] + '%</td><td>' + (m[3] == null ? '—' : m[3] + '%<small>' + m[4] + ' 次</small>') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<div class="note">好的月份很準，盤整、回檔的月份（7 月、10 月）幾乎沒用：這是第一版的弱點，正式版會用 2019 年起全市場資料定權重，並依大盤狀態調整。</div></div>' +
    '<div class="card"><h3>這是樣本</h3><div class="note">目前只用 150 檔研究樣本股、一年多的日 K 和 2 個月的分點資料。正式版會涵蓋全市場、每天收盤後自動更新，戰神看盤也會顯示這檔股票的溫度。溫度是勝算參考，不是買賣建議。</div></div>';
}
$('flt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; F = b.dataset.k; OPEN = null; render(); });
$('tb').addEventListener('click', e => { if (e.target.closest('a')) return; const tr = e.target.closest('tr[data-c]'); if (!tr) return; OPEN = OPEN === tr.dataset.c ? null : tr.dataset.c; render(); });
render();
</script>
</body>
</html>
