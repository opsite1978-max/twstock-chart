<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>產業鏈地圖</title>
<meta name="description" content="台股產業上中下游、龍頭績優股、各產業資金流向、主力買賣超與異常分點">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#e3e6eb;--line2:#cfd4dc;--fg:#1b1f27;--muted:#5d6675;--dim:#8a93a2;
  --accent:#b07d1d;--up:#e5322d;--down:#0f9a5f;--upbg:rgba(229,50,45,.12);--dnbg:rgba(15,154,95,.12);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--panel:#161a21;--panel2:#1d222b;--line:#262c36;--line2:#343c48;--fg:#e8ebf0;--muted:#9aa3b2;--dim:#6e7787;
  --accent:#e0b04a;--up:#ff5a52;--down:#2fc285;--upbg:rgba(255,90,82,.16);--dnbg:rgba(47,194,133,.16)}}
:root[data-theme="dark"]{--bg:#0e1116;--panel:#161a21;--panel2:#1d222b;--line:#262c36;--line2:#343c48;--fg:#e8ebf0;--muted:#9aa3b2;--dim:#6e7787;
  --accent:#e0b04a;--up:#ff5a52;--down:#2fc285;--upbg:rgba(255,90,82,.16);--dnbg:rgba(47,194,133,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em}
header .sub{color:var(--muted);font-size:12.5px}
header .sp{flex:1}
.btn,.seg button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 10px}
.btn{cursor:pointer;text-decoration:none;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line2);cursor:pointer;background:var(--panel)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0 12px}
.bar label{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:4px 0 12px}
.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.note{color:var(--muted);font-size:12.5px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hot{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.hot h3{margin:0 0 6px;font-size:13.5px}
.hot ol{margin:0;padding-left:20px}
.hot li{margin:2px 0;cursor:pointer}
.hot li b{font-family:var(--mono);font-weight:600}
/* 產業排行 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th[aria-sort] ::after{content:''}
.tbl th.on{color:var(--fg)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{font-family:var(--sans);font-weight:700}
.tbl tr{cursor:pointer}
.tbl tr:hover td{background:var(--panel2)}
.tbl td small{color:var(--dim);font-weight:400;font-family:var(--sans);margin-left:4px}
.u{color:var(--up)}.d{color:var(--down)}
.dbar{display:inline-block;width:64px;height:8px;position:relative;vertical-align:middle;margin-left:6px;background:var(--panel2);border-radius:4px}
.dbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.tag{display:inline-block;font:600 11px var(--sans);padding:1px 6px;border-radius:9px;border:1px solid currentColor}
.tblwrap{overflow:auto;max-height:none;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
@media (max-width:760px){.hide-m{display:none}.tbl td,.tbl th{padding:6px 5px}.dbar{width:36px}}
/* 產業鏈 */
.chainhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.chainhead h2{margin:0;font-size:18px}
.sumline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.sumline b{font-family:var(--mono);color:var(--fg);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:26px;position:relative}
.col{display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.col>h3{margin:0;font-size:13px;color:var(--bg);background:var(--fg);border-radius:6px;text-align:center;padding:4px;letter-spacing:.3em}
.col:not(:last-child)::after{content:'▶';position:absolute;right:-20px;top:4px;color:var(--dim);font-size:13px}
@media (max-width:760px){.flow{grid-template-columns:minmax(0,1fr);gap:22px}.col:not(:last-child)::after{content:'▼';right:auto;left:50%;top:auto;bottom:-20px}}
.seg-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg-card.flowin{box-shadow:inset 3px 0 0 var(--up)}.seg-card.flowout{box-shadow:inset 3px 0 0 var(--down)}
.seg-h{padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.seg-h b{font-size:13.5px}
.seg-h span{font:11.5px var(--mono);color:var(--muted)}
.seg-b{padding:8px;display:flex;flex-wrap:wrap;gap:5px}
.seg-b.empty{color:var(--dim);font-size:12px}
.subg{width:100%;margin:2px 0 0}
.subg>div:first-child{font-size:11.5px;color:var(--muted);margin:2px 2px 3px;font-weight:600}
.subg>div:last-child{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:3px 7px;border-radius:7px;border:1px solid var(--line2);cursor:pointer;font-size:12.5px;line-height:1.35;background:var(--panel);max-width:100%}
.chip .cd{font:10.5px var(--mono);color:var(--dim)}
.chip .vv{font:600 11px var(--mono)}
.chip.lead{border-color:var(--accent);border-width:1.5px}
.chip .bd{font-size:11px}
.chip.nodata{opacity:.45}
.chip.more{color:var(--accent);border-style:dashed;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 0}
.legend .sw{display:inline-block;width:28px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
/* 個股 */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--panel);border-top:1px solid var(--line2);box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;transform:translateY(105%);transition:transform .2s}
.sheet:not(.on){visibility:hidden}
.sheet.on{transform:none}
@media (min-width:900px){.sheet{left:auto;right:16px;bottom:16px;width:420px;border:1px solid var(--line2);border-radius:12px}}
.sheet h3{margin:0 0 2px;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font:600 14px var(--mono)}
.mem{font-size:12.5px;color:var(--muted);margin:6px 0}
.mem a{cursor:pointer;text-decoration:underline dotted}
.x{float:right;cursor:pointer;border:0;background:none;font-size:20px;color:var(--muted)}
.load{padding:40px;text-align:center;color:var(--muted)}
.srch{position:relative}
.srch .res{position:absolute;z-index:15;top:100%;left:0;right:0;min-width:260px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;max-height:300px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.srch .res div{padding:6px 10px;cursor:pointer;font-size:13px}
.srch .res div:hover{background:var(--panel2)}
/* 異常分點 */
.tp{display:inline-block;font:600 11px/1.5 var(--sans);padding:0 6px;border-radius:9px;margin:1px 3px 1px 0;white-space:nowrap;color:#fff}
.tp.buy{background:#d8322c}.tp.sell{background:#12935a}.tp.hd{background:#d9822b}.tp.dt{background:#7b8494}.tp.new{background:#7a4fd0}.tp.ct{background:transparent;color:var(--fg);border:1px solid var(--line2)}.tp.grp{background:#2f6fd6}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.flt button{font:600 12px var(--sans);border:1px solid var(--line2);background:var(--panel);color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.flt button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.flt button small{font:11px var(--mono);opacity:.75;margin-left:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:10px 0}
.grpw{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin:6px 0 12px}
.grpw .card{padding:9px 11px}
.grpw .card h4{margin:0 0 4px;font-size:13px}
.grpw .card .note{margin:0 0 5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.buy{background:#d8322c}.dot.sell{background:#12935a}.dot.hd{background:#d9822b}.dot.dt{background:#7b8494}.dot.new{background:#7a4fd0}.dot.ct{border:1.5px solid var(--muted)}
.lk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.tbl td.wrap{white-space:normal;font-family:var(--sans);text-align:left}
.tbl td .sm{display:block;font:11px var(--sans);color:var(--dim);font-weight:400}
.rk{width:100%;border-collapse:collapse;font-size:12.5px}
.rk td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rk td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.rk td.s{color:var(--muted);font-size:11.5px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}
.mini th{color:var(--muted);font-weight:600;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line2);font-size:11.5px}
.mini td{padding:4px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini th:first-child,.mini td:first-child{text-align:left;font-family:var(--sans)}
.mini tr[data-b],.mini tr[data-c]{cursor:pointer}
.mini tr[data-b]:hover td,.mini tr[data-c]:hover td{background:var(--panel2)}
.sheet h4{margin:12px 0 2px;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip .zz{font-size:10px}
.sheet.wide{max-height:85vh}
@media (min-width:900px){.sheet.wide{width:min(760px,calc(100vw - 32px))}}
.wchart{width:100%;display:block;margin:6px 0 2px}
.wchart text{font:10.5px var(--mono);fill:var(--muted)}
.wleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.wleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#wSel{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
#wSel .chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wplan{font-size:13px;line-height:1.65;margin:8px 0;border-left:3px solid var(--accent,#f08c00)}
.wplan small{color:var(--muted);font-size:11.5px;line-height:1.5;display:inline-block;margin-top:2px}
.wdayc{font-size:13px;line-height:1.6;padding:8px 12px}
.wday{cursor:pointer}
small.o,span.o:not(.pill){color:#d9822b}
.kv b+small{margin-top:1px}
.pill{display:inline-block;font:600 11px/1.5 var(--sans);padding:0 6px;border-radius:9px;margin:1px 3px 1px 0;white-space:nowrap;border:1px solid var(--line2);color:var(--fg)}
.pill.r{background:#d8322c;color:#fff;border-color:#d8322c}.pill.o{background:#d9822b;color:#fff;border-color:#d9822b}.pill.p{background:#7a4fd0;color:#fff;border-color:#7a4fd0}.pill.g{background:#7b8494;color:#fff;border-color:#7b8494}.pill.b{background:#2f6fd6;color:#fff;border-color:#2f6fd6}
.secth{margin:16px 0 6px;font-size:15px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.secth small{font-weight:400;color:var(--muted);font-size:12px}
.back{cursor:pointer;border:0;background:none;color:var(--accent);font:600 12.5px var(--sans);padding:0;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>產業鏈地圖</h1>
    <span class="sub" id="asof">讀取中…</span>
    <span class="sp"></span>
    <span class="srch"><input id="q" placeholder="找股票：代號或名稱" autocomplete="off" size="16"><div class="res" id="qres" hidden></div></span>
    <a class="btn" href="zhanshen-me.html">戰神看盤</a>
    <button class="btn" id="themeBtn" title="切換深色／淺色">◐</button>
  </header>
  <div class="bar" id="topBar">
    <label>期間 <span class="seg" id="perSeg"><button data-v="1">1 日</button><button data-v="5">5 日</button><button data-v="20">20 日</button></span></label>
    <label>公司上色 <span class="seg" id="colSeg"><button data-v="z">主力</button><button data-v="f">法人</button><button data-v="r">漲跌</button></span></label>
  </div>
  <div class="tabs" role="tablist"><button role="tab" id="tabFlow" aria-selected="true">產業資金流向</button><button role="tab" id="tabChain" aria-selected="false">產業鏈圖</button><button role="tab" id="tabBrk" aria-selected="false">異常分點</button><button role="tab" id="tabWt" aria-selected="false">權證佈局</button></div>
  <section id="viewFlow"></section>
  <section id="viewChain" hidden></section>
  <section id="viewBrk" hidden></section>
  <section id="viewWt" hidden></section>
  <p class="note" id="foot"></p>
</div>
<div class="sheet" id="sheet" aria-live="polite"></div>
<script>
'use strict';
const BASE = 'https://raw.githubusercontent.com/opsite1978-max/twstock-chart/chain-data/';
const LS = { get(k, d){ try { const v = localStorage.getItem('chain:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } }, set(k, v){ try { localStorage.setItem('chain:' + k, JSON.stringify(v)); } catch (e){} } };
const ST = { wdir:1, wmore:false, amore:false, bkind:LS.get('bkind', 'b'), gmore:false, bday:-1, btype:'all', bind:'', bsort:'v', bmore:false, per:LS.get('per', 5), col:LS.get('col', 'z'), ind:LS.get('ind', 'D000'), tab:LS.get('tab', 'flow'), sort:LS.get('sort', 'zl'), sortDir:LS.get('sortDir', -1), theme:LS.get('theme', '') };
let CH = null, SK = null, BRK = null, IND = new Map(), MEM = new Map(), ANOM = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const num = (x, d = 1) => x == null || !isFinite(x) ? '—' : x.toLocaleString('zh-TW', { minimumFractionDigits:d, maximumFractionDigits:d });
const sgn = (x, d = 1) => x == null || !isFinite(x) ? '—' : (x > 0 ? '+' : '') + num(x, d);
const cls = x => x > 0 ? 'u' : x < 0 ? 'd' : '';
function applyTheme(){ if (ST.theme) document.documentElement.dataset.theme = ST.theme; else delete document.documentElement.dataset.theme; }
applyTheme();
$('themeBtn').onclick = () => { const dark = ST.theme ? ST.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; ST.theme = dark ? 'light' : 'dark'; LS.set('theme', ST.theme); applyTheme(); };

async function load(){
  const t = Math.floor(Date.now() / 600e3);
  const [a, b, k] = await Promise.all([fetch(BASE + 'chain.json?t=' + t, { cache:'no-store' }), fetch(BASE + 'stocks.json?t=' + t, { cache:'no-store' }), fetch(BASE + 'brk.json?t=' + t, { cache:'no-store' }).catch(() => null)]);
  if (!a.ok) throw new Error('產業鏈資料還沒準備好（HTTP ' + a.status + '），第一次建立約需 1～2 小時，請稍後再開。');
  CH = await a.json(); SK = b.ok ? await b.json() : { s:{}, days:[], zdays:[] };
  try { BRK = k && k.ok ? await k.json() : null; } catch (e){ BRK = null; }
  if (BRK){ const last = BRK.days.length - 1; for (const r of BRK.a) if (r[0] === last && !(r[3].length === 1 && r[3][0] === '當沖大戶')){ if (!ANOM.has(r[1])) ANOM.set(r[1], []); ANOM.get(r[1]).push(r); } }
  for (const ind of CH.inds){
    IND.set(ind.code, ind);
    for (const col of ind.cols) for (const sg of col.segs) for (const c of sg.s || []){ if (!MEM.has(c)) MEM.set(c, []); MEM.get(c).push({ ind:ind.code, iname:ind.name, pos:col.t, seg:sg.n }); }
  }
  const d = SK.date || '', zn = (SK.zdays || []).length;
  $('asof').textContent = (d ? '資料日期 ' + d : '還沒有價格資料') + '・主力已算 ' + zn + ' 天';
}
const S = c => SK && SK.s[c] || null;
const nameOf = c => (S(c) && S(c).n) || c;
// 期間欄位
const K = () => ST.per;
const fOf = o => o ? o['f' + K()] : null;              // 法人（億）
const zaOf = o => o ? o['za' + K()] : null;            // 主力（億）
const zqOf = o => o ? o['z' + K()] : null;             // 主力（張）
const kOf = o => o ? o['k' + K()] : null;              // 集中度（%）
const rOf = o => o ? o['r' + K()] : null;              // 漲跌（%）
function good(o){ return o && o.pe > 0 && o.pe <= 40 && o.yoy > 0 && (o.cap || 0) >= 50; }
// 一群股票的合計
function agg(codes){
  let cap = 0, rw = 0, m = 0, m20 = 0, mk = 0, f = 0, za = 0, zq = 0, vol = 0, nz = 0, n = 0, zfull = 0;
  for (const c of new Set(codes)){
    const o = S(c); if (!o) continue; n++;
    const wgt = o.cap || (o.m20 || 0) * 50, r = rOf(o); if (r != null && wgt){ cap += wgt; rw += wgt * r; }   // 市值加權（沒有市值時用成交金額代替）
    m += o.m || 0; m20 += o.m20 || 0; mk += (K() === 1 ? o.m : K() === 5 ? (o.m5 != null ? o.m5 : o.m) : o.m20) || 0;
    if (fOf(o) != null) f += fOf(o);
    if (zaOf(o) != null){ za += zaOf(o); zq += zqOf(o) || 0; nz++; if (o['zn' + K()] >= Math.min(K(), (SK.zdays || []).length)) zfull++; }
    if (o['v' + K()] != null && zqOf(o) != null) vol += o['v' + K()];
  }
  return { n, r:cap ? rw / cap : null, m, m20, heat:m20 ? (mk / m20 - 1) * 100 : null, f, za, nz, zfull, k:vol ? zq / vol * 100 : null, cap };
}
const indCodes = ind => [...new Set(ind.cols.flatMap(col => col.segs.flatMap(sg => sg.s || [])))];
function zlWord(k){ return k == null ? '' : k >= 5 ? '主力大買' : k >= 1.5 ? '主力偏買' : k <= -5 ? '主力大賣' : k <= -1.5 ? '主力偏賣' : '中性'; }
function dbar(v, max){ if (v == null || !max) return ''; const w = Math.min(50, Math.abs(v) / max * 50); return '<span class="dbar"><i style="' + (v >= 0 ? 'left:50%;width:' + w + '%;background:var(--up)' : 'right:50%;width:' + w + '%;background:var(--down)') + '"></i></span>'; }

// ───── 產業資金流向 ─────
const COLS = [
  ['name', '產業', r => r.name],
  ['r', '漲跌％', r => r.a.r],
  ['heat', '資金熱度', r => r.a.heat, 'hide-m'],
  ['f', '法人（億）', r => r.a.f],
  ['zl', '主力（億）', r => r.a.za],
  ['k', '主力集中度', r => r.a.k],

    h += '<h4>目前還抱著的權證（推演能放多久）</h4><table class="mini"><tr><th>股票</th><th>約當張</th><th>回本股價</th><th>剩餘</th><th>大約還能放</th><th class="hide-m">最快到期</th></tr>' + HL.map(([tg]) => one(tg, 0, 1) + one(tg, 5, -1)).join('') + '</table>' +
      '<p class="note" style="margin:0 0 6px">只算資料期間內買進、還沒賣掉的部分。權證最後約 20 個交易日時間價值掉最快，主力通常在那之前出場，所以「大約還能放」＝剩餘天數 − 20。</p>';
  }
  if (WT && WT.base != null) h += '<p class="note" style="margin:0 0 6px">全部分點平均勝率 ' + WT.base + '%。' + (j.fl ? '大買權證 ' + j.fl[0] + ' 次，隔天就賣掉 6 成以上 ' + j.fl[1] + ' 次。' : '') + '</p>';
  h += '<h4>它在佈局哪些股票 ' + perSegHtml('wbPer') + '</h4><table class="mini"><tr><th>股票</th><th>看多淨額</th><th class="hide-m">認購淨</th><th class="hide-m">認售淨</th><th>約當張</th><th>天</th></tr>' +
    (L.length ? L.map(([tg, o]) => '<tr data-w="' + tg + '"><td>' + esc(nameOf(tg)) + ' <span style="font:10.5px var(--mono);color:var(--dim)">' + tg + '</span></td><td class="' + cls(o[0]) + '">' + fmtM(o[0]) + '</td><td class="hide-m ' + cls(o[1]) + '">' + fmtM(o[1]) + '</td><td class="hide-m ' + cls(-o[2]) + '">' + fmtM(o[2]) + '</td><td class="' + cls(o[3]) + '">' + sgn(o[3] / 1000, 0) + '</td><td>' + o[4] + '</td></tr>').join('') : '<tr><td colspan="6" style="color:var(--dim)">這段期間沒有明顯進出</td></tr>') + '</table>';
  const ep = j.ep.slice().reverse().slice(0, 40);
  h += '<h4>過去的佈局與結果</h4><table class="mini"><tr><th>日期</th><th>股票</th><th>方向</th><th>金額</th><th>結果</th><th>報酬</th></tr>' +
    (ep.length ? ep.map(e => '<tr data-w="' + e[1] + '"><td>' + mmdd(j.d[e[0]]) + '</td><td>' + esc(nameOf(e[1])) + '</td><td class="' + (e[2] > 0 ? 'u' : 'd') + '">' + (e[2] > 0 ? '看多' : '看空') + '</td><td>' + fmtM(e[3], false) + '</td><td>' + (e[5] == null ? '<small>等待中</small>' : e[5] ? '<b class="u">✓ 贏</b>' : '<b class="d">✗ 輸</b>') + '</td><td class="' + cls(e[6]) + '">' + (e[6] != null ? sgn(e[6], 1) + '%<small>' + e[7] + ' 天</small>' : '') + '</td></tr>').join('') : '<tr><td colspan="6" style="color:var(--dim)">還沒有單日 ≥ 50 萬的佈局</td></tr>') + '</table>';
  h += '<p class="note" style="margin:0">報酬是標的股票（不是權證）往佈局方向走了多少；贏＝' + (WT ? WT.th.hor : 10) + ' 天內先往佈局方向走 5%。</p>';
  sh.innerHTML = h;
  if ($('wbBack')) $('wbBack').onclick = () => openWStock(from, b);
  $('wbPer').onclick = e => { const bt = e.target.closest('button'); if (!bt) return; ST.per = +bt.dataset.v; LS.set('per', ST.per); syncSeg(); render(); openWBranch(b, from); };
  bindW(sh);
}
const JC = new Map();
async function getJ(path, base = BASE){
  if (JC.has(base + path)) return JC.get(base + path);
  const p = fetch(base + path + '?t=' + Math.floor(Date.now() / 600e3), { cache:'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  JC.set(base + path, p); return p;
}
function perSegHtml(id){ return '<span class="seg" id="' + id + '" style="font-size:12px">' + [1, 5, 20].map(k => '<button data-v="' + k + '" aria-pressed="' + (k === ST.per) + '" style="padding:2px 8px">' + k + ' 日</button>').join('') + '</span>'; }
async function stockBranches(c){
  const j = await getJ('br/' + c + '.json'), box = $('brSec');
  if (!box) return;
  if (!j){ box.innerHTML = '<p class="note">這檔沒有分點明細（成交金額太小，或還沒讀到）。</p>'; return; }
  const nb = j.d.length, K = Math.min(ST.per, nb), t0 = nb - K;
  let vol = 0; for (let t = t0; t < nb; t++) vol += j.v[t] || 0;
  const agg = [];
  for (const [b, list] of Object.entries(j.r)){
    let bq = 0, sq = 0, bv = 0, sv = 0, n = 0;
    for (const e of list) if (e[0] >= t0){ bq += e[1]; sq += e[2]; bv += e[1] * e[3]; sv += e[2] * e[4]; n++; }
    if (!n) continue;
    agg.push({ b, net:bq - sq, val:(bv - sv) * 1000 / 1e8, bp:bq ? bv / bq : 0, sp:sq ? sv / sq : 0, sh:vol ? (bq - sq) / vol * 100 : 0, n });
  }
  const buy = agg.filter(x => x.net > 0).sort((a, b) => b.net - a.net).slice(0, 6), sell = agg.filter(x => x.net < 0).sort((a, b) => a.net - b.net).slice(0, 6);
  const tr = x => '<tr data-b="' + esc(x.b) + '"><td>' + esc(j.n[x.b] || x.b) + ' ' + hdInfo(x.b, j.hd[x.b]) + '</td><td class="' + cls(x.net) + '">' + sgn(x.net, 0) + '</td><td class="' + cls(x.sh) + '">' + sgn(x.sh, 1) + '%</td><td>' + num(x.net > 0 ? x.bp : x.sp, 2) + '</td>' + (K > 1 ? '<td>' + x.n + '</td>' : '') + '</tr>';
  const head = '<tr><th>分點</th><th>張</th><th>佔量</th><th>均價</th>' + (K > 1 ? '<th>天</th>' : '') + '</tr>';
  box.innerHTML = '<h4>主要分點 ' + perSegHtml('brPer') + '<span class="note" style="font-weight:400">' + mmdd(j.d[t0]) + '～' + mmdd(j.d[nb - 1]) + (ST.per > nb ? '（目前只有 ' + nb + ' 天）' : '') + '</span></h4>' +
    '<table class="mini">' + head + '<tr><td colspan="5" style="color:var(--up);font-weight:700">買超</td></tr>' + buy.map(tr).join('') + '<tr><td colspan="5" style="color:var(--down);font-weight:700">賣超</td></tr>' + sell.map(tr).join('') + '</table>' +
    '<p class="note" style="margin:0">只計入每天買賣超前 15 大的分點；均價是買超方的買進均價、賣超方的賣出均價。</p>';
  $('brPer').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.per = +b.dataset.v; LS.set('per', ST.per); syncSeg(); render(); stockBranches(c); };
  bindB(box, c);
}
async function openBranch(b, from){
  const sh = $('sheet'); sh.classList.remove('wide');
  sh.innerHTML = '<button class="x" onclick="document.getElementById(\'sheet\').classList.remove(\'on\')">×</button>' + (from ? '<button class="back" id="bkBack">‹ 回 ' + esc(nameOf(from)) + '</button>' : '') + '<h3>' + esc(bName(b)) + '</h3><p class="note">讀取中…</p>';
  sh.classList.add('on'); sh.scrollTop = 0;
  if ($('bkBack')) $('bkBack').onclick = () => openStock(from);
  const j = await getJ('bk/' + safeB(b) + '.json');
  if (!j){ sh.querySelector('.note').textContent = '找不到這個分點的資料。'; return; }
  const nb = j.d.length, K = Math.min(ST.per, nb), t0 = nb - K;
  const by = {};
  for (const e of j.r){ if (e[0] < t0) continue; const o = by[e[1]] = by[e[1]] || { bq:0, sq:0, bv:0, sv:0, n:0 }; o.bq += e[2]; o.sq += e[3]; o.bv += e[2] * e[4]; o.sv += e[3] * e[5]; o.n++; }
  const L = Object.entries(by).map(([c, o]) => { let vol = 0; for (let t = t0; t < nb; t++) vol += (j.vol[c] || [])[t] || 0; return { c, net:o.bq - o.sq, val:(o.bv - o.sv) * 1000 / 1e8, sh:vol ? (o.bq - o.sq) / vol * 100 : 0, n:o.n, px:o.bq - o.sq > 0 ? (o.bq ? o.bv / o.bq : 0) : (o.sq ? o.sv / o.sq : 0) }; });
  const tot = L.reduce((s, x) => s + x.val, 0), gb = L.filter(x => x.val > 0).reduce((s, x) => s + x.val, 0), gs = L.filter(x => x.val < 0).reduce((s, x) => s + x.val, 0);
  const buy = L.filter(x => x.val > 0).sort((a, b) => b.val - a.val).slice(0, 10), sell = L.filter(x => x.val < 0).sort((a, b) => a.val - b.val).slice(0, 10);
  const tr = x => '<tr data-c="' + x.c + '"><td>' + esc(nameOf(x.c)) + ' <span style="font:10.5px var(--mono);color:var(--dim)">' + x.c + '</span>' + (ANOM.has(x.c) ? ' ⚡' : '') + '</td><td class="' + cls(x.net) + '">' + sgn(x.net, 0) + '</td><td class="' + cls(x.val) + '">' + sgn(x.val, 2) + '</td><td class="' + cls(x.sh) + '">' + sgn(x.sh, 1) + '%</td><td>' + num(x.px, 2) + '</td></tr>';
  const head = '<tr><th>股票</th><th>張</th><th>億</th><th>佔量</th><th>均價</th></tr>';
  const h0 = j.hd;
  let h = '<button class="x" onclick="document.getElementById(\'sheet\').classList.remove(\'on\')">×</button>' + (from ? '<button class="back" id="bkBack">‹ 回 ' + esc(nameOf(from)) + '</button>' : '') +
    '<h3>' + esc(j.n) + ' <span style="font:13px var(--mono);color:var(--dim)">' + esc(j.id) + '</span></h3>';
  h += '<div class="kv"><div><small>淨買賣（' + K + ' 日）</small><b class="' + cls(tot) + '">' + sgn(tot, 2) + ' 億</b></div><div><small>買超合計</small><b class="u">' + sgn(gb, 2) + ' 億</b></div><div><small>賣超合計</small><b class="d">' + sgn(gs, 2) + ' 億</b></div></div>';
  h += '<p class="note" style="margin:0 0 6px">' + (h0 && h0[0] ? '隔日沖傾向：過去 ' + nb + ' 天大買 ' + h0[0] + ' 次，隔天就賣掉一半以上 ' + h0[1] + ' 次（' + Math.round(h0[1] / h0[0] * 100) + '%）' + (j.tag ? '，<b style="color:#d9822b">隔日沖常客</b>——它大買的股票隔天常有賣壓。' : '。') : '隔日沖傾向：大買次數還太少，無法判斷。') + '</p>';
  h += '<h4>' + perSegHtml('bkPer') + '<span class="note" style="font-weight:400">' + mmdd(j.d[t0]) + '～' + mmdd(j.d[nb - 1]) + '</span></h4>';
  h += '<table class="mini">' + head + '<tr><td colspan="5" style="color:var(--up);font-weight:700">買超最多</td></tr>' + buy.map(tr).join('') + '<tr><td colspan="5" style="color:var(--down);font-weight:700">賣超最多</td></tr>' + sell.map(tr).join('') + '</table>';
  h += '<p class="note" style="margin:0">只含產業鏈裡成交金額 3,000 萬以上、而且這個分點擠進當天前 15 大的股票。</p>';
  sh.innerHTML = h;
  if ($('bkBack')) $('bkBack').onclick = () => openStock(from);
  $('bkPer').onclick = e => { const bt = e.target.closest('button'); if (!bt) return; ST.per = +bt.dataset.v; LS.set('per', ST.per); syncSeg(); render(); openBranch(b, from); };
  bindB(sh, from);
}
// ───── 搜尋 ─────
$('q').oninput = () => {
  const t = $('q').value.trim(), box = $('qres');
  if (!t || !CH){ box.hidden = true; return; }
  const hit = [...MEM.keys()].filter(c => c.startsWith(t) || nameOf(c).includes(t)).sort((a, b) => (b === t) - (a === t) || (b.startsWith(t)) - (a.startsWith(t)) || ((S(b) || {}).cap || 0) - ((S(a) || {}).cap || 0)).slice(0, 20);
  box.innerHTML = hit.length ? hit.map(c => '<div data-c="' + c + '">' + esc(nameOf(c)) + ' ' + c + '　<span style="color:var(--dim)">' + MEM.get(c).map(m => m.iname).filter((x, i, a) => a.indexOf(x) === i).join('、') + '</span></div>').join('') : '<div style="color:var(--dim)">產業鏈裡找不到</div>';
  box.hidden = false;
  for (const el of box.querySelectorAll('[data-c]')) el.onclick = () => { box.hidden = true; $('q').value = ''; const m = MEM.get(el.dataset.c)[0]; ST.ind = m.ind; LS.set('ind', m.ind); setTab('chain'); openStock(el.dataset.c); };
};
document.addEventListener('click', e => { if (!e.target.closest('.srch')) $('qres').hidden = true; });
// ───── 切換 ─────
function setTab(t){ ST.tab = t; LS.set('tab', t); for (const [id, k] of [['Flow', 'flow'], ['Chain', 'chain'], ['Brk', 'brk'], ['Wt', 'wt']]){ $('tab' + id).setAttribute('aria-selected', String(t === k)); $('view' + id).hidden = t !== k; } $('colSeg').parentElement.style.display = t === 'brk' || t === 'wt' ? 'none' : ''; render(); }
$('tabFlow').onclick = () => setTab('flow'); $('tabChain').onclick = () => setTab('chain'); $('tabBrk').onclick = () => setTab('brk'); $('tabWt').onclick = () => setTab('wt');
function syncSeg(){ for (const b of $('perSeg').children) b.setAttribute('aria-pressed', String(+b.dataset.v === ST.per)); for (const b of $('colSeg').children) b.setAttribute('aria-pressed', String(b.dataset.v === ST.col)); }
$('perSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.per = +b.dataset.v; LS.set('per', ST.per); syncSeg(); render(); };
$('colSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.col = b.dataset.v; LS.set('col', ST.col); syncSeg(); render(); };
function render(){ if (!CH) return; if (ST.tab === 'chain') renderChain(); else if (ST.tab === 'brk') renderBrk(); else if (ST.tab === 'wt') renderWt(); else renderFlow(); }
syncSeg();
load().then(() => {
  $('foot').innerHTML = '產業上中下游與公司名單：' + esc(CH.src || '櫃買中心產業價值鏈資訊平台') + '（只列上市、上櫃公司；一家公司可能出現在好幾個環節）。價格、法人、主力分點、市值、本益比、月營收：FinMind，每天晚上 9 點多更新。僅供研究參考，不是投資建議。';
  setTab(['chain', 'brk', 'wt'].includes(ST.tab) ? ST.tab : 'flow');
}).catch(e => { $('viewFlow').innerHTML = '<div class="load">' + esc(e.message) + '</div>'; });
</script>
