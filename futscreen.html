<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>股期選股</title>
<meta name="theme-color" content="#131722">
<link rel="manifest" href="manifest-m.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#131722; --panel:#1b2130; --panel2:#222a3b; --line:#2a3245;
    --text:#d6dbe6; --muted:#8a93a6; --accent:#4c8dff;
    --up:#ef5350; --down:#26a69a; --fut:#c98500;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f4f5f8; --panel2:#ffffff; --line:#d8dce4;
    --text:#1f2430; --muted:#667085; --up:#e53935; --down:#089981; --fut:#b07800;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 2px 0 0;font-weight:600;white-space:nowrap}
  select,button,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;height:34px}
  button{cursor:pointer;white-space:nowrap}
  .spacer{flex:1}
  main{max-width:1100px;margin:0 auto;padding:10px 12px 40px}
  .muted{color:var(--muted)}
  .msg{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin:10px 0;line-height:1.7}
  .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 10px}
  .sum button{height:auto;padding:10px 12px;text-align:left;border-radius:10px;background:var(--panel);border:2px solid var(--line)}
  .sum button.on{border-color:var(--accent)}
  .sum .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .sum .t{font-size:13px;color:var(--muted)}
  .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px;font-size:13px}
  .bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .bar input[type=checkbox]{height:auto;width:16px;height:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .it{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block;color:inherit;text-decoration:none}
  .it:hover{border-color:var(--accent)}
  .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .hd .nm{font-size:16px;font-weight:700}
  .hd .px{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .badge{display:inline-block;font-weight:700;padding:0 10px;border-radius:999px;border:2px solid var(--line);font-size:13px}
  .chk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:8px 0}
  .chk span{text-align:center;font-size:11.5px;border-radius:6px;padding:3px 0;background:var(--panel2);border:1px solid var(--line)}
  .chk b{display:block;font-size:13px}
  .kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;font-size:12px;font-variant-numeric:tabular-nums}
  .kv div span{display:block;color:var(--muted);font-size:11px}
  .kv div b{font-size:13.5px}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>股期選股</h1>
  <span class="muted" id="upd"></span>
  <span class="spacer"></span>
  <button onclick="location.href='futstock.html'">股期籌碼</button>
  <button onclick="location.href='index.html'">看盤</button>
</header>
<main>
  <div class="sum" id="sum"></div>
  <div class="bar">
    <label><input type="checkbox" id="liq" checked> 只看股期未平倉 1,000 口以上</label>
    <label>排序 <select id="sort"><option value="score">分數</option><option value="rr">報酬風險比</option><option value="oi">股期未平倉</option><option value="dist">離進場區最近</option></select></label>
    <span class="muted" id="cnt"></span>
  </div>
  <div id="list"></div>
  <p class="note">每個交易日晚上 10 點左右，依「股期籌碼與套利」頁的進場燈號，逐檔計算所有有股票期貨的股票（收盤資料）。六項條件：趨勢、主力買盤（扣除套利後）、價差、股期籌碼（多空平衡點）、結算時機、價位風險報酬；● 符合、○ 中性、✕ 不符合。分數 +3 以上且結算時機與風險報酬都沒有不符合＝可進場；−2 以下＝避開；其他＝觀望。價位都是股期價。點任一檔可以看完整分析。這只是依規則自動篩選，不是投資建議。</p>
</main>
<script>
'use strict';
let SET = {};
try { SET = JSON.parse(localStorage.getItem('twchart.settings') || '{}') || {}; } catch(e){}
if (SET.themeName === 'light') document.documentElement.dataset.theme = 'light';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d) => v == null || isNaN(v) ? '–' : (+v).toLocaleString('en-US', { minimumFractionDigits:d || 0, maximumFractionDigits:d || 0 });
const pc = (v, d = 1) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const md = d => d ? +d.slice(5,7) + '/' + +d.slice(8,10) : '';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const NAMES = ['趨勢', '主力', '價差', '籌碼', '結算', '價位'];
const SIG = { go:['可進場', 'var(--up)'], wait:['觀望', 'var(--fut)'], avoid:['避開', 'var(--down)'] };
let DATA = null, VIEW = store.get('fsc.view') || 'go';

async function boot(){
  try {
    const r = await fetch('data/futscreen/latest.json?t=' + Date.now());
    if (!r.ok) throw new Error('還沒有選股資料（每個交易日晚上 10 點左右更新）');
    DATA = await r.json();
  } catch(e){ $('#list').innerHTML = `<div class="msg">${esc(e.message)}</div>`; return; }
  const day = (DATA.rows.find(r => r.d) || {}).d;
  $('#upd').textContent = `${md(day)} 收盤・更新 ${DATA.updated.slice(5)}`;
  draw();
}
function dist(r){ return r.P <= r.zHi ? 0 : (r.P / r.zHi - 1) * 100; }       // 離進場區上緣多遠
function draw(){
  const ok = DATA.rows.filter(r => !r.err && (!$('#liq').checked || r.oi >= 1000));
  const near = r => r.sig === 'wait' && r.score >= 1;
  const groups = { go:ok.filter(r => r.sig === 'go'), near:ok.filter(near), all:ok };
  $('#sum').innerHTML = [['go', '可進場', groups.go.length, 'var(--up)'], ['near', '接近進場（觀望、分數 +1 以上）', groups.near.length, 'var(--fut)'], ['all', '全部（含避開）', ok.length, 'var(--muted)']]
    .map(([k, t, n, c]) => `<button data-v="${k}" class="${VIEW === k ? 'on' : ''}"><div class="n" style="color:${c}">${n}</div><div class="t">${t}</div></button>`).join('');
  document.querySelectorAll('#sum button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; store.set('fsc.view', VIEW); draw(); });
  const key = $('#sort').value;
  const list = [...groups[VIEW] || []].sort((a, b) => key === 'rr' ? b.rr - a.rr : key === 'oi' ? b.oi - a.oi : key === 'dist' ? dist(a) - dist(b) : (b.score - a.score) || (b.rr - a.rr));
  $('#cnt').textContent = `${list.length} 檔（共分析 ${DATA.rows.length} 檔，失敗 ${DATA.rows.filter(r => r.err).length}）`;
  if (!list.length){
    $('#list').innerHTML = `<div class="msg">${VIEW === 'go' ? '今天沒有符合「可進場」的股票。可以看看「接近進場」：差一兩個條件，條件轉好時最先變成可進場。' : '沒有符合的股票。'}</div>`; return;
  }
  $('#list').innerHTML = '<div class="grid">' + list.map(card).join('') + '</div>';
}
function card(r){
  const s = SIG[r.sig] || ['–', 'var(--line)'], nd = r.P < 100 ? 2 : 0, F = v => fmt(v, nd);
  const ic = v => v > 0 ? ['●', 'var(--up)'] : v < 0 ? ['✕', 'var(--down)'] : ['○', 'var(--muted)'];
  const chk = r.chk.map((v, k) => { const [t, c] = ic(v); return `<span title="${esc(NAMES[k] + '：' + (r.why ? r.why[k] : ''))}"><b style="color:${c}">${t}</b>${NAMES[k]}</span>`; }).join('');
  const zone = r.P <= r.zHi ? '現價已在進場區' : `離進場區 ${pc(-dist(r))}`;
  return `<a class="it" style="border-left-color:${s[1]}" href="futstock.html?s=${r.id}">
    <div class="hd"><span class="nm">${r.id} ${esc(r.name)}</span><span class="badge" style="border-color:${s[1]};color:${s[1]}">${s[0]}</span><span class="muted">${r.score > 0 ? '+' : ''}${r.score} 分</span><span class="px">股期 ${F(r.P)}</span></div>
    <div class="chk">${chk}</div>
    <div class="kv">
      <div><span>進場區</span><b>${F(r.zLo)}～${F(r.zHi)}</b></div>
      <div><span>停損</span><b style="color:var(--down)">${F(r.stop)}</b></div>
      <div><span>目標一</span><b style="color:var(--up)">${F(r.T1)}</b></div>
      <div><span>報酬風險比</span><b>${r.rr.toFixed(1)}</b></div>
      <div><span>位置</span><b>${zone}</b></div>
      <div><span>多空平衡點</span><b>${r.bal ? fmt(r.bal, nd ? 2 : 1) : '–'}</b></div>
      <div><span>距結算</span><b>${r.left} 天</b></div>
      <div><span>股期未平倉</span><b>${fmt(r.oi)} 口</b></div>
    </div></a>`;
}
$('#liq').onchange = draw; $('#sort').onchange = () => { store.set('fsc.sort', $('#sort').value); draw(); };
{ const s = store.get('fsc.sort'); if (s) $('#sort').value = s; }
boot();
</script>
<script src="autoreload.js"></script>
</body>
</html>
