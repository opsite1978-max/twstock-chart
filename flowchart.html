<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#131722">
<link rel="manifest" href="manifest-m.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --bg:#131722; --panel:#1b2130; --panel2:#222a3b; --line:#2a3245; --grid:#1f2636;
    --text:#d6dbe6; --muted:#8a93a6; --accent:#4c8dff;
    --up:#ef5350; --down:#26a69a; --flow:#4c8dff; --gold:#ffca28; --bb:#8f9bb3; --sig:#ffb020; --early:#b98cff;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f4f5f8; --panel2:#ffffff; --line:#d8dce4; --grid:#eef0f4;
    --text:#1f2430; --muted:#667085; --up:#e53935; --down:#089981; --flow:#2563eb; --gold:#b98900; --bb:#7a869e; --sig:#e08a00; --early:#7c4dff;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
    padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;height:32px;cursor:pointer;white-space:nowrap}
  .spacer{flex:1}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:var(--panel);height:30px;padding:0 10px}
  .seg button.on{background:var(--accent);color:#fff}
  #wrap{position:relative}
  #chart{width:100%}
  .legend{position:absolute;left:8px;top:4px;z-index:3;pointer-events:none;font-size:12px;line-height:1.55;font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
  .legend b{font-weight:700}
  .legend2{position:absolute;left:8px;z-index:3;pointer-events:none;font-size:12px;font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
  .muted{color:var(--muted)} .up{color:var(--up)} .dn{color:var(--down)}
  main{max-width:1180px;margin:0 auto;padding:10px 12px 40px}
  .msg{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin:10px;line-height:1.7}
  h2{font-size:15px;margin:14px 0 6px} h2 .muted{font-size:12px;font-weight:400;margin-left:6px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .card .lb{font-size:12px;color:var(--muted)} .card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums} .card .s{font-size:12px;color:var(--muted)}
  .tblx{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:500} td:first-child,th:first-child{text-align:left}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 2px}
  @media (max-width:520px){ .seg button{padding:0 8px} header button{height:30px;padding:0 8px;font-size:13px} table{font-size:11.5px} th,td{padding:5px 4px} }

<body>
<header>
  <h1>資金流看盤</h1>
  <span class="muted" style="font-size:12px" id="upd"></span>
  <span class="spacer"></span>
  <button onclick="location.href='force.html'">多空力道</button>
  <button onclick="location.href='force-lab.html'">研究版</button>
  <button onclick="location.href='index.html'">看盤</button>
</header>
<div class="bar">
  <input id="sym" list="symList" placeholder="代號、名稱、TX 或「2330期」" autocomplete="off" style="font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;height:32px;width:min(260px,58vw)">
  <datalist id="symList"></datalist>
  <button id="go" style="background:var(--accent);border-color:var(--accent);color:#fff">載入</button>
  <span class="muted" style="font-size:12px" id="symName"></span>
</div>
<div class="bar">
  <div class="seg" id="tfSeg"><button data-tf="1">1分</button><button data-tf="5">5分</button><button data-tf="15">15分</button><button data-tf="30">30分</button><button data-tf="60">60分</button><button data-tf="240">4時</button><button data-tf="D">日</button></div>
  <div class="seg" id="lnSeg"><button data-k="FR">資金流殘差</button><button data-k="F">淨流量力道</button></div>
  <div class="seg"><button id="zIn">＋</button><button id="zOut">－</button><button id="zEnd">最新</button></div>
</div>
<div id="status" class="msg">讀取中…</div>
<div id="wrap"><div id="chart"></div><div class="legend" id="lg"></div><div class="legend2" id="lg2"></div><div class="legend2" id="lg3"></div><div class="legend2" id="lg4"></div></div>
<main>
  <div class="cards" id="cards"></div>
  <h2>資金流低點訊號：這個週期的歷史表現<span class="muted" id="statNote"></span></h2>
  <div class="tblx" id="tblStat"></div>
  <h2>提前訊號：和低點訊號比早多少<span class="muted">真正低點＝訊號前後各 12 根的最低點；「早」＝訊號出現在低點之前</span></h2>
  <div class="tblx" id="tblEarly"></div>
  <div id="painSec">
  <h2>散戶凹單指標：日線回測<span class="muted">收盤時指標在這個區間，之後台指期的漲跌</span></h2>
  <div class="tblx" id="tblPain"></div>
  <p class="note" id="painNote"></p>
  </div>
  <h2>最近的低點訊號</h2>
  <div class="tblx" id="tblSig"></div>
  <p class="note" id="note"></p>
</main>
<script>
'use strict';
let SET = {};
try { SET = JSON.parse(localStorage.getItem('twchart.settings') || '{}') || {}; } catch(e){}
if (SET.themeName === 'light') document.documentElement.dataset.theme = 'light';
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store = { get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch(e){} } };
const fmt = (v, d) => v == null || isNaN(v) ? '–' : (+v).toLocaleString('en-US', { minimumFractionDigits:d || 0, maximumFractionDigits:d || 0 });
const sgn = (v, d) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const avg = a => a.length ? a.reduce((t, v) => t + v, 0) / a.length : null;
const iso = t => new Date(t * 1000).toISOString();
const tlabel = (t, tf) => { const s = iso(t); return tf === 'D' ? s.slice(0, 10) : +s.slice(5, 7) + '/' + +s.slice(8, 10) + ' ' + s.slice(11, 16); };
const dayT = (d, m) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 1000 + m * 60;
const ST = { tf:store.get('flow.tf', '60'), k:store.get('flow.k', 'FR') };
let IDX = null, CAL = [], CALSET = new Set(), BASE5 = null, BASE1 = null, CHART = null, SER = {}, VIEW = null;
const TXSYM = { kind:'tx', id:'TX', name:'台指期（選擇權資金流）' };
let SYM = (() => { try { const v = JSON.parse(store.get('flow.sym', 'null')); return v && v.kind ? v : TXSYM; } catch(e){ return TXSYM; } })();
let STOCKS = new Map(), SFUT = [], NREQ = 0;
const twToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const shiftDay = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
async function finmind(params){
  const tok = (SET.token || '').trim(); if (!tok) throw new Error('個股與個股期貨需要 FinMind 憑證：請到看盤頁「⚙ 設定」填入');
  const qs = new URLSearchParams(params); qs.set('token', tok); NREQ++;
  let r; try { r = await fetch('https://api.finmindtrade.com/api/v4/data?' + qs); } catch(e){ throw new Error('連不上 FinMind，請檢查網路'); }
  const j = await r.json().catch(() => null);
  if (r.status === 402 || (j && j.status === 402)) throw new Error('本小時 FinMind 查詢次數已用完，請稍後再試');
  if (!r.ok || !j || j.status !== 200) throw new Error('FinMind：' + ((j && j.msg) || r.status) + (/level|sponsor|backer/i.test((j && j.msg) || '') ? '（逐筆資料需要贊助會員）' : ''));
  return j.data || [];
}
// 清單：股票用看盤頁存好的清單（同一個網站，不用再查）；個股期貨清單每天查一次
async function loadLists(){
  try { const c = JSON.parse(store.get('twchart.stocklist', 'null')); if (c && c.list) STOCKS = new Map(c.list); } catch(e){}
  try {
    if (!STOCKS.size && (SET.token || '').trim()){
      const rows = await finmind({ dataset:'TaiwanStockInfo' }), latest = new Map();
      for (const r of rows){ const q = latest.get(r.stock_id); if (!q || (r.date || '') > (q.date || '')) latest.set(r.stock_id, r); }
      const list = [...latest.values()].map(r => [r.stock_id, r.stock_name]).sort((a, b) => a[0].localeCompare(b[0]));
      store.set('twchart.stocklist', JSON.stringify({ d:twToday(), list })); STOCKS = new Map(list);
    }
  } catch(e){}
  try {
    const c = JSON.parse(store.get('flow.futlist', 'null'));
    if (c && c.d === twToday() && c.list) SFUT = c.list;
    else if ((SET.token || '').trim()){
      const rows = await finmind({ dataset:'TaiwanFutOptDailyInfo' }), byName = new Map([...STOCKS].map(([id, nm]) => [nm, id]));
      SFUT = rows.filter(r => r.type === 'TaiwanFuturesDaily' && /期貨$/.test(r.name || '') && !/^(TX|MTX|TMF|TE|TF|XIF|GTF|G2F|E4F|ZEF|ZFF|SPF|UDF|UNF|F1F|BTF|SXF|SOF|SHF|TJF|RHF|RTF|XJF|XAF|XBF|XEF|TGF|GDF|BRF|TJF)$/.test(r.code))
        .map(r => { const nm = r.name.replace(/^小型/, '').replace(/期貨$/, ''); return [r.code, r.name, byName.get(nm) || '']; }).filter(x => x[2]);
      store.set('flow.futlist', JSON.stringify({ d:twToday(), list:SFUT }));
    }
  } catch(e){}
  const dl = $('#symList'); const opts = ['<option value="TX 台指期">'];
  for (const [id, nm] of STOCKS) if (/^\d{4}$/.test(id)) opts.push(`<option value="${id} ${nm}">`);
  for (const [code, nm] of SFUT) opts.push(`<option value="${code} ${nm}">`);
  dl.innerHTML = opts.join('');
}
function parseSym(txt){
  txt = (txt || '').trim(); if (!txt) return null;
  if (/^(TX|MTX|TMF|台指|大台|小台|微台|加權)/i.test(txt)) return TXSYM;
  const first = txt.split(/\s+/)[0], up = first.toUpperCase();
  const fut = SFUT.find(x => x[0] === up);
  if (fut) return { kind:'sfut', id:fut[0], name:fut[1], under:fut[2] };
  const isFut = /期貨?$/.test(first), key = first.replace(/期貨?$/, '');
  let sid = STOCKS.has(key) ? key : null;
  if (!sid) for (const [id, nm] of STOCKS) if (nm === key){ sid = id; break; }
  if (!sid) for (const [id, nm] of STOCKS) if (/^\d{4}$/.test(id) && nm.includes(key)){ sid = id; break; }
  if (!sid && /^\d{4,6}[A-Z]?$/.test(key)) sid = key;
  if (!sid) return null;
  if (isFut){ const f = SFUT.filter(x => x[2] === sid).sort((a, b) => a[1].length - b[1].length)[0]; if (!f) throw new Error(sid + ' 沒有個股期貨'); return { kind:'sfut', id:f[0], name:f[1], under:sid }; }
  return { kind:'stock', id:sid, name:STOCKS.get(sid) || '' };
}
// 每天的逐筆整理成每分鐘：[分鐘, 開, 高, 低, 收, 主動買, 主動賣, 無法判斷, 時段]；過去的日子存在這台裝置，不再用額度
const tdb = (() => { let p = null; return () => p || (p = new Promise(res => {
  try { const r = indexedDB.open('flow-tick', 1); r.onupgradeneeded = () => r.result.createObjectStore('d');
    r.onsuccess = () => { const db = r.result; try { const q = db.transaction('d').objectStore('d').count(); q.onsuccess = () => { if (q.result > 3000) try { db.transaction('d', 'readwrite').objectStore('d').clear(); } catch(e){} }; } catch(e){} res(db); };
    r.onerror = r.onblocked = () => res(null); } catch(e){ res(null); } })); })();
async function tGet(k){ const db = await tdb(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('d').objectStore('d').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch(e){ res(null); } }); }
async function tPut(k, v){ const db = await tdb(); if (!db) return; try { db.transaction('d', 'readwrite').objectStore('d').put(v, k); } catch(e){} }
function minuteAgg(list){   // list: [分鐘, 價, 量, 方向(1/−1/0), 時段]
  const out = new Map();
  for (const [m, p, v, sd, ss] of list){
    let a = out.get(m); if (!a){ a = [m, p, p, p, p, 0, 0, 0, ss]; out.set(m, a); }
    a[2] = Math.max(a[2], p); a[3] = Math.min(a[3], p); a[4] = p;
    if (sd > 0) a[5] += v; else if (sd < 0) a[6] += v; else a[7] += v;
  }
  return [...out.values()].sort((x, y) => x[0] - y[0]);
}
async function tickDay(sym, date){
  const key = sym.kind + ':' + sym.id + ':' + date, today = twToday(), stable = sym.kind === 'stock' ? date < today : date <= shiftDay(today, -2);
  if (stable){ const v = await tGet(key); if (v) return v; }
  let out = [];
  if (sym.kind === 'stock'){
    const rows = await finmind({ dataset:'TaiwanStockPriceTick', data_id:sym.id, start_date:date });
    const list = [];
    for (const r of rows){ const tm = String(r.Time || ''); const m = +tm.slice(0, 2) * 60 + +tm.slice(3, 5); if (!(m >= 540 && m <= 810)) continue;
      const tt = String(r.TickType); list.push([m, +r.deal_price, +r.volume || 0, tt === '1' ? 1 : tt === '2' ? -1 : 0, 'D']); }
    out = minuteAgg(list);
  } else {
    const rows = await finmind({ dataset:'TaiwanFuturesTick', data_id:sym.id, start_date:date });
    // 每個時段只用成交量最大的單一月份；方向用價格跳動推估（比上一筆高＝主動買）
    const sess = new Map();
    for (const r of rows){ const c = String(r.contract_date || '').trim(); if (!/^\d{6}$/.test(c)) continue;
      const ds = String(r.date || ''), m = +ds.slice(11, 13) * 60 + +ds.slice(14, 16);
      const ss = m <= 300 ? 'P' : m >= 525 && m <= 825 ? 'D' : m >= 900 ? 'N' : null; if (!ss) continue;
      let q = sess.get(ss); if (!q){ q = { vol:new Map(), rows:[] }; sess.set(ss, q); }
      q.vol.set(c, (q.vol.get(c) || 0) + (+r.volume || 0)); q.rows.push([ds, m, c, +r.price, +r.volume || 0]); }
    const list = [];
    for (const [ss, q] of sess){ const main = [...q.vol].sort((a, b) => b[1] - a[1])[0][0]; let last = null, side = 0;
      q.rows.filter(x => x[2] === main).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).forEach(([ds, m, c, p, v]) => {
        if (last != null){ if (p > last) side = 1; else if (p < last) side = -1; } last = p; list.push([m, p, v, side, ss]); }); }
    out = minuteAgg(list);
  }
  if (stable && out.length) tPut(key, out);
  return out;
}
async function tradingDays(n){
  let c = null; try { c = JSON.parse(store.get('flow.cal', 'null')); } catch(e){}
  if (!c || c.d !== twToday()){ const rows = await finmind({ dataset:'TaiwanStockTradingDate', start_date:shiftDay(twToday(), -200) }); c = { d:twToday(), list:[...new Set(rows.map(r => r.date))].sort() }; store.set('flow.cal', JSON.stringify(c)); }
  return c.list.filter(d => d <= twToday()).slice(-n);
}
const NDAYS = { '1':5, '5':10, '15':20, '30':30, '60':40, '240':80 };
const TCACHE = new Map();
async function loadTicks(sym, tf){
  const days = await tradingDays(NDAYS[tf] || 40), per = new Array(days.length); let done = 0, i = 0;
  const t0 = NREQ;
  await Promise.all(Array.from({ length:3 }, async () => { while (i < days.length){ const k = i++;
    const ck = sym.kind + ':' + sym.id + ':' + days[k];
    if (!TCACHE.has(ck)) TCACHE.set(ck, tickDay(sym, days[k]).catch(e => { TCACHE.delete(ck); throw e; }));
    per[k] = await TCACHE.get(ck); done++;
    $('#status').textContent = `下載逐筆成交 ${done}／${days.length} 天（這次用了 ${NREQ - t0} 次 FinMind 查詢；看過的日子會存在這台裝置）…`; } }));
  const out = [];
  days.forEach((d, k) => { for (const a of per[k] || []){
    const [m, o, h, l, c, bv, sv, uv, ss] = a;
    let td = d, s0;
    if (ss === 'D'){ s0 = dayT(d, sym.kind === 'stock' ? 540 : 525); }
    else if (ss === 'N'){ s0 = dayT(d, 900); }
    else { td = shiftDay(d, -1); s0 = dayT(td, 900); }
    out.push({ t:dayT(d, m), o, h, l, c, net:bv - sv, gross:bv + sv, v:bv + sv + uv, td:td + (ss === 'P' ? 'N' : ss), s:ss === 'P' ? 'N' : ss, s0 }); } });
  out.sort((a, b) => a.t - b.t);
  return { bars:out, req:NREQ - t0, days:days.length };
}
async function dailyPrice(sym){
  const start = shiftDay(twToday(), -400);
  if (sym.kind === 'stock'){
    const rows = await finmind({ dataset:'TaiwanStockPrice', data_id:sym.id, start_date:start });
    return rows.filter(r => r.close > 0).map(r => ({ t:dayT(r.date, 0), o:r.open, h:r.max, l:r.min, c:r.close, net:null, td:r.date, s:'X', k:0 }));
  }
  const rows = await finmind({ dataset:'TaiwanFuturesDaily', data_id:sym.id, start_date:start }), best = new Map();
  for (const r of rows){ if (r.trading_session !== 'position' || !/^\d{6}$/.test(String(r.contract_date).trim()) || !(r.close > 0)) continue; const q = best.get(r.date); if (!q || r.volume > q.volume) best.set(r.date, r); }
  return [...best.values()].sort((a, b) => a.date < b.date ? -1 : 1).map(r => ({ t:dayT(r.date, 0), o:r.open, h:r.max, l:r.min, c:r.close, net:null, td:r.date, s:'X', k:0 }));
}

async function getJSON(p){ const r = await fetch(p + '?v=' + Math.floor(Date.now() / 60000)); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }
function nextTD(x){ for (const d of CAL) if (d > x) return d; let t = new Date(x + 'T00:00:00Z'); do { t = new Date(t.getTime() + 864e5); } while (t.getUTCDay() === 0 || t.getUTCDay() === 6); return t.toISOString().slice(0, 10); }
function rowObj(cols, r, extra){ const o = {}; cols.forEach((c, i) => o[c] = r[i]); o.v = o.v || 0; return Object.assign(o, extra); }

/* ───────── 讀資料（網站每晚算好的逐筆資金流，不用 FinMind） ───────── */
async function loadBase5(){
  if (BASE5) return BASE5;
  IDX = await getJSON('data/force/index.json'); CAL = IDX.cal || []; CALSET = new Set(CAL);
  $('#upd').textContent = '資料 ' + (IDX.updated || '');
  const months = await Promise.all((IDX.months || []).map(m => getJSON('data/force/m5/' + m + '.json').catch(() => null)));
  const out = [];
  for (const m of months){ if (!m) continue;
    for (const s of m.sessions){ const s0 = s.bars[0][0]; for (const r of s.bars) out.push(rowObj(m.cols, r, { td:s.td, s:s.s, s0, step:300 })); } }
  out.sort((a, b) => a.t - b.t);
  return BASE5 = trimTail(out);
}
async function loadBase1(){
  if (BASE1) return BASE1;
  await loadBase5();

/* ───────── 資金流低點：從超賣區（≤ −60）往上穿回 −60 ───────── */

/* ───────── 圖表 ───────── */

/* ───────── 散戶凹單指標（只適用台指期） ─────────

   指標＝（價格 − 散戶平均成本）÷ 一次追繳的距離。一次追繳＝小台、微台「原始保證金 − 維持保證金」：
   期交所 2026/8 公告小台原始 175,250、維持 134,500 元，差 40,750 元＝815 點，約指數的 1.75%（保證金隨指數調整，所以用比例）。

// 每根 K 棒的指標值：用「這根之前已經公布」的最新散戶成本（每天 16:00 公布）
function painSeries(bars, rows, tf){
  const out = new Array(bars.length).fill(null), info = new Array(bars.length).fill(null), mk = [];
  let k = -1;
  bars.forEach((b, i) => {
    while (k + 1 < rows.length && dayT(rows[k + 1].d, 960) <= b.t) k++;
    if (k < 0) return;
    const r = rows[k]; if (r.after == null || !r.net) return;

  try { const s2 = parseSym($('#sym').value); if (!s2){ err(new Error('找不到這個代號或名稱')); return; } SYM = s2; store.set('flow.sym', JSON.stringify(SYM)); $('#sym').value = SYM.kind === 'tx' ? 'TX 台指期' : SYM.id + ' ' + SYM.name; $('#sym').blur(); await render(); } catch(e){ err(e); }
}
$('#go').onclick = goSym; $('#sym').addEventListener('keydown', e => { if (e.key === 'Enter') goSym(); }); $('#sym').addEventListener('change', () => { if (/\s/.test($('#sym').value)) goSym(); });
document.querySelectorAll('#tfSeg button').forEach(b => b.onclick = () => { ST.tf = b.dataset.tf; store.set('flow.tf', ST.tf); render().catch(err); });
document.querySelectorAll('#lnSeg button').forEach(b => b.onclick = () => { ST.k = b.dataset.k; store.set('flow.k', ST.k); render().catch(err); });
const zoom = f => { const ts = CHART.timeScale(), r = ts.getVisibleLogicalRange(); if (!r) return; const mid = r.to - 3, w = (r.to - r.from) * f; ts.setVisibleLogicalRange({ from:mid - w + 3, to:mid + 3 }); };
$('#zIn').onclick = () => zoom(1 / 1.5); $('#zOut').onclick = () => zoom(1.5);
$('#zEnd').onclick = () => { const n = VIEW.bars.length, show = Math.min(n, window.innerWidth < 700 ? 120 : 220); CHART.timeScale().setVisibleLogicalRange({ from:n - show, to:n + 3 }); };
/* ───────── 台指期盤中即時（資金流＋K 棒） ─────────
   網站的逐筆資金流每天早晚才算一次（期交所逐筆資料收盤後才公布），所以盤中改用即時報價推估：
   每分鐘抓台指期和最近 2 個結算日的選擇權即時報價（3 個 FinMind 額度），用成交量增加的部分、成交價靠買價或賣價判斷主動買賣，乘上 Delta 算淨流量，和多空力道頁的即時模式同一套。
   推估值存在這台裝置，重新整理不會不見；開啟頁面之前的盤中資料要等網站晚上算好才會補上。 */
const FLV = { busy:false, strk:null, t:'', err:'', n:0 };
const FL_MC = 'ABCDEFGHIJKL', FL_MP = 'MNOPQRSTUVWX';
function flProduct(code){ const m = /^(\d{4})(\d{2})(?:([WF])(\d))?$/.exec(code); if (!m) return null; const y = +m[1], mo = +m[2], n = +m[4];
  return { prod:!m[3] ? 'TXO' : m[3] === 'W' ? 'TX' + n : 'TX' + ('UVXYZ'[n - 1] || ''), cl:FL_MC[mo - 1] + (y % 10), pl:FL_MP[mo - 1] + (y % 10) }; }
function flNcdf(x){ const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
function flPickFut(rows){
  const tm = r => Date.parse(String(r.date).slice(0, 19).replace(' ', 'T') + '+08:00') || 0;
  const c = rows.filter(r => /^TXF[A-L]\d$/.test(r.futures_id) && r.close > 0); if (!c.length) return null;
  const newest = Math.max(...c.map(tm));
  return c.filter(r => newest - tm(r) < 10 * 60e3).sort((a, b) => b.total_volume - a.total_volume)[0];
}
const flShift = (d, n) => new Date(Date.parse(d) + n * 864e5).toISOString().slice(0, 10);
// 現在的時段：日盤 08:45–13:45、夜盤 15:00–隔天 05:00（x＝開盤那天）
function flSession(){
  const tw = new Date(Date.now() + 8 * 3600e3), wd = tw.getUTCDay(), m = tw.getUTCHours() * 60 + tw.getUTCMinutes(), d = tw.toISOString().slice(0, 10);
  if (wd >= 1 && wd <= 5 && m >= 525 && m <= 826) return { s:'D', x:d, a:525 };
  if (wd >= 1 && wd <= 5 && m >= 900) return { s:'N', x:d, a:900 };
  if (wd >= 2 && wd <= 6 && m <= 301) return { s:'N', x:flShift(d, -1), a:900 };
  return null;
}
const flKey = (s, x) => 'fl.live:' + s + ':' + x;
function flGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function flPut(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function flClean(){ try { const old = flShift(twToday(), -4); for (let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if (k && k.startsWith('fl.live:') && k.slice(-10) < old) localStorage.removeItem(k); } } catch(e){} }
async function flSnap(path, id){
  const r = await fetch('https://api.finmindtrade.com/api/v4/' + path + '?' + new URLSearchParams({ data_id:id, token:(SET.token || '').trim() }), { cache:'no-store' });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.status !== 200) throw new Error((j && j.msg) || ('即時報價 ' + r.status));
  return j.data || [];
}
async function flPoll(){
  if (FLV.busy || document.hidden || !SYM || SYM.kind !== 'tx' || !(SET.token || '').trim()) return false;
  const ses = flSession(); if (!ses) return false;
  FLV.busy = true;
  try {
    if (!FLV.strk || Date.now() - FLV.strkAt > 3600e3){ FLV.strk = await getJSON('data/force/strikes.json'); FLV.strkAt = Date.now(); }
    const S = FLV.strk, nowS = Math.floor(Date.now() / 1000) + 8 * 3600;
    const ex = (S.exps || []).filter(e => dayT(e.exp, 810) > nowS).slice(0, 2);
    const prods = new Map(); for (const e of ex){ const lp = flProduct(e.code); if (!lp) continue; if (!prods.has(lp.prod)) prods.set(lp.prod, []); prods.get(lp.prod).push({ e, lp }); }
    const [fr, ...ors] = await Promise.all([flSnap('taiwan_futures_snapshot', 'TX')].concat([...prods.keys()].map(p => flSnap('taiwan_options_snapshot', p).catch(() => []))));
    const f = flPickFut(fr); if (!f) throw new Error('取不到台指期即時價');
    const ft = Date.parse(String(f.date).slice(0, 19).replace(' ', 'T') + '+08:00') / 1000 + 8 * 3600;
    if (ft < dayT(ses.x, ses.a)){ FLV.err = ''; FLV.t = ''; return false; }                 // 這個時段還沒有成交（休市日）
    const key = flKey(ses.s, ses.x), st = flGet(key) || { bars:[], pv:{}, fut:null, last:0 };
    const fresh = Date.now() - st.last < 3 * 60e3;                                         // 上次抓價超過 3 分鐘：這次只當基準，不把中間累積的量算進同一分鐘
    const px = +f.close, tm = Math.floor(Math.min(nowS, dayT(ses.x, ses.s === 'D' ? 824 : 1739)) / 60) * 60;
    let bar = st.bars[st.bars.length - 1];
    if (!bar || bar.t !== tm){ bar = { t:tm, o:px, h:px, l:px, c:px, net:0, gross:0, cb:0, cs:0, pb:0, ps:0, unk:0, v:0 }; st.bars.push(bar); }
    bar.h = Math.max(bar.h, px); bar.l = Math.min(bar.l, px); bar.c = px;
    const fv = +f.total_volume || 0; if (fresh && st.fut != null && fv >= st.fut) bar.v += fv - st.fut; st.fut = fv;
    let n = 0;
    [...prods.values()].forEach((list, pi) => { for (const r of ors[pi] || []){
      const m = /^[A-Z0-9]{3}(\d+)([A-X])(\d)$/.exec(r.options_id); if (!m) continue;
      const suf = m[2] + m[3], it = list.find(q => q.lp.cl === suf || q.lp.pl === suf); if (!it) continue;
      const call = it.lp.cl === suf, K = +m[1], tv = +r.total_volume || 0, pv = st.pv[r.options_id]; st.pv[r.options_id] = tv;
      if (!fresh || pv == null || tv <= pv) continue;
      const dv = tv - pv, c = +r.close, bp = +r.buy_price, sp = +r.sell_price;
      let side = 0; if (bp > 0 && sp > 0){ if (c >= sp) side = 1; else if (c <= bp) side = -1; else side = Math.sign(c - (bp + sp) / 2); }
      if (!side){ bar.unk += dv; continue; }
      const row = it.e.rows.find(x => x[0] === K), iv = row && row[10] ? row[10] / 100 : it.e.iv / 100;
      const T = Math.max(600, dayT(it.e.exp, 810) - nowS) / (365 * 86400);
      const F = it.e.F * px / (S.fut || it.e.F), sd = iv * Math.sqrt(T), d1 = (Math.log(F / K) + sd * sd / 2) / sd;
      const dl = call ? flNcdf(d1) : flNcdf(d1) - 1;
      bar.net += side * dl * dv * 0.25; bar.gross += Math.abs(dl) * dv * 0.25;
      if (call) bar[side > 0 ? 'cb' : 'cs'] += dv; else bar[side > 0 ? 'pb' : 'ps'] += dv; n++;
    } });
    st.last = Date.now(); flPut(key, st);
    FLV.t = String(f.date).slice(11, 19); FLV.n = n; FLV.err = '';
    return true;
  } catch(e){ FLV.err = e.message || String(e); return false; }
  finally { FLV.busy = false; }
}
// 存著的即時分鐘資料 → 和網站資料一樣的格式（step＝60 或 300 秒），只接在網站資料最後一根之後
function flLiveBase(step, base){
  const lastT = base.length ? base[base.length - 1].t : 0, out = [];
  const keys = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('fl.live:')) keys.push(k); } } catch(e){}
  keys.sort((a, b) => a.slice(-10).localeCompare(b.slice(-10)) || (a.includes(':D:') ? -1 : 1));
  for (const k of keys){
    const [, , s, x] = k.split(':'), st = flGet(k); if (!st || !st.bars) continue;
    const td = s === 'D' ? x : nextTD(x), s0 = dayT(x, s === 'D' ? 525 : 900);
    let cur = null;
    for (const b of st.bars){
      const t = s0 + Math.floor((b.t - s0) / step) * step; if (t <= lastT) continue;
      if (!cur || cur.t !== t){ cur = { t, o:b.o, h:b.h, l:b.l, c:b.c, net:0, gross:0, cb:0, cs:0, pb:0, ps:0, unk:0, v:0, td, s, s0, step, live:true }; out.push(cur); }
      cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c;
      for (const f of ['net', 'gross', 'cb', 'cs', 'pb', 'ps', 'unk', 'v']) cur[f] += b[f] || 0;
    }
  }
  return out.sort((a, b) => a.t - b.t);
}

/* ───────── 自動更新：有新資料就重畫（分頁沒在看時不檢查） ─────────
   台指期：網站每天算好的資料一更新就換上（不用 FinMind 額度）；
   股票、個股期貨：盤中與收盤後每 5 分鐘重抓今天的逐筆（每次 1 個額度，逐筆資料公布後才會有今天的資金流） */
const AU = { last:0, busy:false, msg:'' };
function auTw(){ const d = new Date(Date.now() + 8 * 3600e3); return { wd:d.getUTCDay(), m:d.getUTCHours() * 60 + d.getUTCMinutes() }; }
async function auRerender(){
  const ts = CHART.timeScale(), r = ts.getVisibleLogicalRange(), n0 = VIEW && VIEW.bars ? VIEW.bars.length : 0;
  await render();
  const n1 = VIEW && VIEW.bars ? VIEW.bars.length : 0;
  if (r && n0) ts.setVisibleLogicalRange(r.to >= n0 - 1.5 ? { from:r.from + n1 - n0, to:r.to + n1 - n0 } : r);
}
async function auCheck(){
  if (AU.busy || document.hidden || !SYM) return;
  const { wd, m } = auTw(), hhmm = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  AU.busy = true;
  try {
    if (SYM.kind === 'tx'){
      const j = await (await fetch('data/force/index.json?t=' + Date.now(), { cache:'no-store' })).json();
      if (IDX && j.updated !== IDX.updated){ BASE5 = null; BASE1 = null; await auRerender(); AU.msg = '已換上新資料 ' + hhmm; }
      else AU.msg = '自動更新：已是最新（' + hhmm + ' 檢查）';
    } else if (ST.tf !== 'D' && wd >= 1 && wd <= 5 && m >= 540 && m <= 1080){       // 平日 09:00～18:00
      const today = twToday(), ck = SYM.kind + ':' + SYM.id + ':' + today;
      TCACHE.delete(ck); await auRerender(); AU.msg = '自動更新 ' + hhmm;
    } else AU.msg = '自動更新：盤中與收盤後（平日 09:00～18:00）每 5 分鐘重抓今天的逐筆';
  } catch(e){ AU.msg = '自動更新失敗：' + (e.message || e); }
  finally { AU.busy = false; $('#upd').textContent = '資料 ' + ((IDX && IDX.updated) || '') + '・' + AU.msg; }
}
setInterval(() => { if (SYM && SYM.kind === 'tx' ? Date.now() - AU.last >= 10 * 60e3 : Date.now() - AU.last >= 5 * 60e3){ AU.last = Date.now(); auCheck(); } }, 30e3);
AU.last = Date.now();
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - AU.last >= 5 * 60e3){ AU.last = Date.now(); auCheck(); } });
// 台指期盤中：每分鐘抓即時報價推估資金流、接上 K 棒
function flStatus(){ if (!SYM || SYM.kind !== 'tx') return; const ses = flSession(), hasTok = !!(SET.token || '').trim();
  $('#upd').textContent = '資料 ' + ((IDX && IDX.updated) || '') + '・' + (!hasTok ? '盤中即時需要 FinMind 憑證（看盤頁⚙設定）' : FLV.err ? '即時更新失敗：' + FLV.err : ses ? (FLV.t ? '即時 ' + FLV.t + '（每分鐘推估）' : '即時更新中') : '盤中（08:45、15:00 開盤後）每分鐘即時更新'); }
async function flTick(){ if (!SYM || SYM.kind !== 'tx' || document.hidden || !VIEW) return; if (await flPoll()) await auRerender(); flStatus(); }
flClean();
setInterval(flTick, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flTick(); });
setTimeout(flTick, 4000);
function err(e){ console.error(e); $('#status').hidden = false; $('#status').className = 'msg'; $('#status').textContent = '讀取失敗：' + (e.message || e); }
(function start(){
  if (!window.LightweightCharts){ setTimeout(start, 200); return; }
  try { buildChart(); $('#sym').value = SYM.kind === 'tx' ? 'TX 台指期' : SYM.id + ' ' + SYM.name; loadLists(); render().then(() => flTick()).catch(err); } catch(e){ err(e); }
})();
