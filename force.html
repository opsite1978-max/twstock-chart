<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選擇權多空力道</title>
<meta name="theme-color" content="#131722">
<link rel="manifest" href="manifest-m.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#131722; --panel:#1b2130; --panel2:#222a3b; --line:#2a3245; --grid:#252d3e;
    --text:#d6dbe6; --muted:#8a93a6; --accent:#4c8dff;
    --up:#ef5350; --down:#26a69a; --call:#3987e5; --put:#d95926; --pain:#199e70; --gold:#ffca28; --force:#26c6da; --gam:#9085e9;
    --upA:rgba(239,83,80,.10); --downA:rgba(38,166,154,.10); --warm:rgba(138,147,166,.10);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f4f5f8; --panel2:#ffffff; --line:#d8dce4; --grid:#e6e9ef;
    --text:#1f2430; --muted:#667085; --up:#e53935; --down:#089981; --call:#2a78d6; --put:#eb6834; --pain:#1baf7a; --gold:#b98900; --force:#00838f; --gam:#6250d6;
    --upA:rgba(229,57,53,.08); --downA:rgba(8,153,129,.08); --warm:rgba(102,112,133,.08);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 2px 0 0;font-weight:600;white-space:nowrap}
  button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;height:34px;cursor:pointer;white-space:nowrap}
  input{cursor:text;width:64px}
  .spacer{flex:1}
  main{max-width:1180px;margin:0 auto;padding:10px 12px 40px}
  .muted{color:var(--muted)} .small{font-size:12px}
  .msg{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin:10px 0;line-height:1.7}
  .msg.err{color:#ff6e6e;border-color:#ff6e6e55}
  section{margin-top:14px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600} h2 .muted{font-weight:400;font-size:12px;margin-left:6px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:relative}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:2px 4px 6px}
  .legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:3px}
  .legend i.bar{width:10px;height:10px;vertical-align:-1px;border-radius:2px}
  .legend i.dash{height:0;border-top:2px dashed currentColor;background:none!important}
  svg{display:block;width:100%;overflow:visible}
  svg text{font-family:inherit;font-variant-numeric:tabular-nums}
  canvas{display:block;width:100%;touch-action:pan-y}
  .tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.6;min-width:170px;box-shadow:0 4px 14px #0006;display:none;z-index:3;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.7}
  .top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
  .kpi .lb{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
  .kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-weight:700;font-size:13px;padding:1px 10px;border-radius:999px;border:2px solid var(--line)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:var(--panel);height:32px;padding:0 11px}
  .seg button.on{background:var(--accent);color:#fff}
  .bar2{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:8px 0}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:500} td:first-child,th:first-child{text-align:left}
  .tblx{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .up{color:var(--up)} .dn{color:var(--down)}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:10px}
  details>summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:15px;list-style:none;display:flex;gap:8px;align-items:center}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:'▸';color:var(--muted);transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  details>summary .muted{font-weight:400;font-size:12px}
  details>.in{padding:0 10px 12px}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  @media (max-width:760px){ .g2{grid-template-columns:minmax(0,1fr)} }
  @media (max-width:520px){ table{font-size:11.5px} th,td{padding:5px 4px} .kpi .v{font-size:19px} .seg button{padding:0 8px} }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chips button{height:30px;padding:0 10px;font-size:12.5px}
  .chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .warn{color:#e0a800}
</style>
<script>
/* 憑證失效偵測（同其他頁） */
(() => { const of = window.fetch.bind(window); let dead = null;
  window.fetch = async (u, o) => { const s = String(u && u.url || u);
    if (!/finmindtrade\.com/.test(s) || !/[?&]token=/.test(s)) return of(u, o);
    try { return await of(u, o); }
    catch(e){
      if (dead === null){ try { const r = await of(s.replace(/([?&])token=[^&]*&?/, '$1').replace(/[?&]$/, ''), o); dead = r.ok; } catch(e2){ dead = false; } setTimeout(() => { dead = null; }, 60000); }
      if (dead) return new Response(JSON.stringify({ status:401, msg:'憑證已失效（FinMind 拒絕這把憑證），請到看盤頁「⚙ 設定」貼上新的 FinMind 憑證' }), { status:401, headers:{ 'Content-Type':'application/json' } });
      throw e;
    } }; })();
</script>
</head>
<body>
<header>
  <h1>選擇權多空力道</h1>
  <span class="muted small" id="upd"></span>
  <span class="spacer"></span>
  <button onclick="location.href='txo.html'">選擇權</button>
  <button onclick="location.href='ctrl.html'">主力控盤</button>
  <button onclick="location.href='index.html'">看盤</button>
</header>
<main>
  <div id="status" class="msg">讀取中…</div>
  <div id="app" hidden>
    <div class="top" id="top"></div>

    <section>
      <div class="bar2">
        <div class="seg" id="tfSeg"><button data-tf="1">1分</button><button data-tf="5">5分</button><button data-tf="15">15分</button><button data-tf="60">60分</button><button data-tf="240">4時</button><button data-tf="D">日</button></div>
        <div class="seg" id="modeSeg"><button data-m="calm">穩健</button><button data-m="std">標準</button><button data-m="fast">敏感</button></div>
        <button id="blendBtn" title="主線另外混入 25% 的外資部位偏向（盤後資料，只用到前一天公布的）">加入法人背景</button>
        <button id="liveBtn" title="盤中用 FinMind 即時報價每分鐘推估（需要 FinMind 贊助會員憑證）">開啟即時</button>
        <span class="spacer"></span>
        <div class="seg"><button id="zIn">＋</button><button id="zOut">－</button><button id="zEnd">最新</button></div>
      </div>
      <div class="panel" id="mainPanel">
        <div class="legend" id="lgMain"></div>
        <canvas id="cv"></canvas>
        <div class="tip" id="tip"></div>
      </div>
      <p class="note" id="noteMain"></p>
    </section>

    <details id="dGo" open>
      <summary>GO 訊號紀錄與回測<span class="muted">每個訊號都在該根 K 棒收盤才確認、下一根開盤進場，不重繪</span></summary>
      <div class="in">
        <div class="bar2"><span class="small muted">交易成本（來回，點）</span><input id="costIn" type="number" min="0" step="0.5" value="2"><span class="small muted" id="btScope"></span></div>
        <div class="tblx" id="tblGo"></div>
        <h2 style="margin-top:12px">回測結果<span class="muted">真實歷史資料；參數沒有針對這段期間調整過</span></h2>
        <div class="tblx" id="tblBt"></div>
        <div class="g2" style="margin-top:10px"><div class="tblx" id="tblSplit"></div><div class="tblx" id="tblBucket"></div></div>
        <p class="note" id="noteBt"></p>
      </div>
    </details>

    <details id="dPanic">
      <summary>恐慌與衰竭<span class="muted">恐慌指數 0～100、價格與力道背離</span></summary>
      <div class="in">
        <div class="tblx" id="tblPanic"></div>
        <p class="note" id="notePanic"></p>
      </div>
    </details>

    <details id="dMap">
      <summary>履約價壓力地圖<span class="muted">各履約價未平倉、增減、Gamma 與 Delta 加權</span></summary>
      <div class="in">
        <div class="chips" id="expChips"></div>
        <div class="bar2">
          <div class="seg" id="mapSeg"><button data-k="oi">未平倉</button><button data-k="doi">今日增減</button><button data-k="vol">成交量</button><button data-k="gam">Gamma 加權</button><button data-k="del">Delta 加權</button></div>
          <div class="seg" id="rngSeg"><button data-r="3">±3%</button><button data-r="5">±5%</button><button data-r="8">±8%</button></div>
        </div>
        <div class="panel"><div class="legend" id="lgMap"></div><svg id="svMap"></svg><div class="tip" id="tipMap"></div></div>
        <p class="note" id="noteMap"></p>
        <h2 style="margin-top:12px">未平倉集中區移動<span class="muted">近 60 個交易日；看漲牆、看跌牆、未平倉重心往哪裡移</span></h2>
        <div class="panel"><div class="legend" id="lgMig"></div><svg id="svMig"></svg><div class="tip" id="tipMig"></div></div>
        <p class="note" id="noteMig"></p>
      </div>
    </details>

    <details id="dPcr">
      <summary>賣權／買權比與波動率結構<span class="muted">成交量比、未平倉比、價平隱含波動率、偏斜</span></summary>
      <div class="in">
        <div class="tblx" id="tblPcr"></div>
        <div class="panel" style="margin-top:10px"><div class="legend" id="lgPcr"></div><svg id="svPcr"></svg><div class="tip" id="tipPcr"></div></div>
        <p class="note" id="notePcr"></p>
      </div>
    </details>

    <details id="dInst">
      <summary>法人部位雷達<span class="muted">外資、投信、自營商的期貨與選擇權未平倉（盤後公布）</span></summary>
      <div class="in">
        <div class="tblx" id="tblInst"></div>
        <div class="tblx" id="tblInstO" style="margin-top:10px"></div>
        <p class="note" id="noteInst"></p>
      </div>
    </details>

    <details id="dQ">
      <summary>資料品質與計算方式<span class="muted">資料等級、來源、更新時間、各公式</span></summary>
      <div class="in" id="qBox"></div>
    </details>
  </div>
</main>
<script>
'use strict';
let SET = {};
try { SET = JSON.parse(localStorage.getItem('twchart.settings') || '{}') || {}; } catch(e){}
if (SET.themeName === 'light') document.documentElement.dataset.theme = 'light';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d) => v == null || isNaN(v) ? '–' : (+v).toLocaleString('en-US', { minimumFractionDigits:d || 0, maximumFractionDigits:d || 0 });
const sgn = (v, d) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);
const pct = (v, d = 0) => v == null || isNaN(v) ? '–' : (+v).toFixed(d) + '%';
const avg = a => a.length ? a.reduce((t, v) => t + v, 0) / a.length : null;
const med = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const clsUp = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const store = { get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch(e){} } };
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text){ const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function ticks(lo, hi, n){ const span = hi - lo || 1, s0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(s0))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(s => span / s <= n) || 10 * mag; const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(6)); return out; }
function legend(id, items){ $(id).innerHTML = items.map(([t, c, k]) => `<span><i class="${k || ''}" style="${k === 'dash' ? 'color:' + c : 'background:' + c}"></i>${esc(t)}</span>`).join(''); }
function setStatus(t, err){ const s = $('#status'); s.hidden = !t; s.textContent = t || ''; s.className = 'msg' + (err ? ' err' : ''); }
// 時間：資料裡的秒數是「台灣時間當成 UTC」，所以一律用 UTC 函式讀
const iso = t => new Date(t * 1000).toISOString();
const hm = t => iso(t).slice(11, 16);
const mdhm = t => { const s = iso(t); return +s.slice(5, 7) + '/' + +s.slice(8, 10) + ' ' + s.slice(11, 16); };
const md = d => +d.slice(5, 7) + '/' + +d.slice(8, 10);
const dayT = (d, m) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 1000 + m * 60;
const twNow = () => Math.floor(Date.now() / 1000) + 8 * 3600;
const ATANH6 = Math.atanh(0.6);

/* ───────── 狀態 ───────── */
const ST = {
  tf: store.get('force.tf', '15'), mode: store.get('force.mode', 'std'), blend: store.get('force.blend', '0') === '1',
  mapK: store.get('force.mapK', 'oi'), mapR: +store.get('force.mapR', '5'), mapE: null,
  view: { n: null, end: null }, live: false,
};
const MODES = { calm:{ span:8, q:0.95, name:'穩健' }, std:{ span:5, q:0.90, name:'標準' }, fast:{ span:3, q:0.80, name:'敏感' } };
const STATE_TXT = { BULL:['多方優勢', 'up'], BEAR:['空方優勢', 'dn'], NEUTRAL:['方向不明', ''], PANIC:['恐慌擴張', 'warn'], EXH_UP:['空方衰竭（看多背離）', 'up'], EXH_DN:['多方衰竭（看空背離）', 'dn'] };
let IDX = null, BASE5 = [], DAILY = [], INST = [], STRK = null, M1CACHE = null, LIVE = { bars: [], prevVol: new Map(), timer: null, msg: '', fut: null };
let VIEW = null;        // 目前時間框架算好的資料

async function getJSON(p){ const r = await fetch(p + (p.includes('?') ? '&' : '?') + 'v=' + Math.floor(Date.now() / 60000)); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }

/* ───────── 交易日曆 ───────── */
let CAL = [], CALSET = new Set();
function nextTD(x){ for (const d of CAL) if (d > x) return d; let t = new Date(x + 'T00:00:00Z'); do { t = new Date(t.getTime() + 864e5); } while (t.getUTCDay() === 0 || t.getUTCDay() === 6); return t.toISOString().slice(0, 10); }
function prevTD(x){ let p = null; for (const d of CAL){ if (d >= x) break; p = d; } return p; }

/* ───────── 讀資料 ───────── */
function rowObj(cols, r, extra){ const o = { t:r[0], o:r[1], h:r[2], l:r[3], c:r[4], net:r[5] || 0, gross:r[6] || 0, cb:r[7] || 0, cs:r[8] || 0, pb:r[9] || 0, ps:r[10] || 0, unk:r[11] || 0, vix:r[12], v:cols.length > 13 ? (r[13] || 0) : 0 }; return Object.assign(o, extra); }
async function loadAll(){
  setStatus('讀取多空力道資料…');
  IDX = await getJSON('data/force/index.json');
  CAL = IDX.cal || []; CALSET = new Set(CAL);
  const [months, daily, inst, strk] = await Promise.all([
    Promise.all((IDX.months || []).map(m => getJSON('data/force/m5/' + m + '.json').catch(() => null))),
    getJSON('data/force/daily.json').catch(() => ({ days: [] })),
    getJSON('data/force/inst.json').catch(() => ({ days: [] })),
    getJSON('data/force/strikes.json').catch(() => null),
  ]);
  BASE5 = [];
  for (const m of months){ if (!m) continue;
    for (const s of m.sessions){ const s0 = s.bars[0][0]; s.bars.forEach(r => BASE5.push(rowObj(m.cols, r, { td:s.td, s:s.s, k:Math.floor((r[0] - s0) / 300), s0 }))); } }
  BASE5.sort((a, b) => a.t - b.t);
  DAILY = daily.days || []; INST = inst.days || []; STRK = strk;
  $('#upd').textContent = '資料更新 ' + (IDX.updated || '–');
}
// 1 分鐘：把最近幾個日曆日的檔案拼成交易時段（規則同每晚程式）
async function loadM1(){
  if (M1CACHE) return M1CACHE;
  setStatus('讀取 1 分鐘資料…');
  const files = (IDX.files || []).slice(-26);
  const js = await Promise.all(files.map(x => getJSON('data/force/m1/' + x + '.json').catch(() => null)));
  const out = []; const sess = new Map();
  js.forEach((j, i) => { if (!j || !j.bars) return; const x = files[i];
    for (const r of j.bars){ const m = r[0]; let td, s;
      if (m <= 300){ td = CALSET.has(x) ? x : nextTD(x); s = 'N'; } else if (m >= 525 && m <= 825){ td = x; s = 'D'; } else if (m >= 900){ td = nextTD(x); s = 'N'; } else continue;
      const key = td + s; if (!sess.has(key)) sess.set(key, []);
      sess.get(key).push([dayT(x, m)].concat(r.slice(1)));
    } });
  for (const [key, bars] of sess){ bars.sort((a, b) => a[0] - b[0]); const td = key.slice(0, 10), s = key.slice(10);
    const s0 = bars[0][0]; bars.forEach(r => out.push(rowObj(j0cols, r, { td, s, k:Math.floor((r[0] - s0) / 60), s0 }))); }
  out.sort((a, b) => a.t - b.t);
  M1CACHE = out; setStatus('');
  return out;
}
const j0cols = ['t','o','h','l','c','net','gross','cb','cs','pb','ps','unk','vix','v'];

/* ───────── 時間框架整理 ───────── */
function aggregate(base, tf, unit = 5){
  if (tf === unit || tf === 1) return base;
  const out = []; let cur = null;
  for (const b of base){
    let key, s0 = b.s0;
    if (tf === 'D'){ key = b.td; } else { key = b.td + b.s + Math.floor((b.t - s0) / (tf * 60)); }
    if (!cur || cur.key !== key){
      cur = { key, t:tf === 'D' ? dayT(b.td, 0) : s0 + Math.floor((b.t - s0) / (tf * 60)) * tf * 60, o:b.o, h:b.h, l:b.l, c:b.c, net:0, gross:0, cb:0, cs:0, pb:0, ps:0, unk:0, vix:null, v:0,
        td:b.td, s:tf === 'D' ? 'X' : b.s, k:tf === 'D' ? 0 : Math.floor((b.t - s0) / (tf * 60)), live:false, t1:b.t };
      out.push(cur);
    }
    cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c; cur.t1 = b.t;
    for (const f of ['net', 'gross', 'cb', 'cs', 'pb', 'ps', 'unk', 'v']) cur[f] += b[f];
    if (b.vix != null) cur.vix = b.vix;
    if (b.live) cur.live = true;
  }
  return out;
}

/* ───────── 外資部位偏向（盤後資料，只用已公布的） ───────── */
function robustZ(x, hist){ if (hist.length < 20 || x == null) return null; const m = med(hist), mad = med(hist.map(v => Math.abs(v - m))) * 1.4826;

let PANIC_T = 80;

/* ───────── 回測 ───────── */
function backtest(V, base){

/* ───────── 建立目前畫面資料 ───────── */
async function rebuild(){
  const tf = ST.tf === 'D' ? 'D' : +ST.tf;
  let base = tf === 1 ? await loadM1() : BASE5;

  const P = STRK.fut || (e && e.F) || (ex[0] && ex[0].F);

  const svg = $('#svMap'); svg.innerHTML = '';

  LIVE.busy = true;
  try {
    const ex = (STRK && STRK.exps || []).filter(e => Date.UTC(+e.exp.slice(0, 4), +e.exp.slice(5, 7) - 1, +e.exp.slice(8, 10), 13, 30) / 1000 > now).slice(0, 4);
    if (!ex.length) throw new Error('沒有可用的結算日資料');
    const prods = new Map(); for (const e of ex){ const lp = liveProduct(e.code); if (!lp) continue; if (!prods.has(lp.prod)) prods.set(lp.prod, []); prods.get(lp.prod).push({ e, lp }); }
    const [fr, ...ors] = await Promise.all([snap('taiwan_futures_snapshot', 'TX')].concat([...prods.keys()].map(p => snap('taiwan_options_snapshot', p).catch(() => []))));
    const f = fr.filter(r => /^TXF[A-L]\d$/.test(r.futures_id) && r.close > 0).sort((a, b) => b.total_volume - a.total_volume)[0];
    if (!f) throw new Error('取不到台指期即時價');
    const px = +f.close, tm = Math.floor(now / 60) * 60;
    // 這一分鐘的 K 棒
    let bar = LIVE.bars[LIVE.bars.length - 1];
    const today = iso(now).slice(0, 10), hr = new Date(now * 1000).getUTCHours();
    const yday = iso(now - 86400).slice(0, 10);
    // 夜盤：下午三點開始的屬於下一個交易日；凌晨的屬於今天（週六凌晨屬於下週一）
    const td = s === 'D' ? today : hr < 6 ? (CALSET.has(today) ? today : nextTD(today)) : nextTD(today);
    const s0 = s === 'D' ? dayT(today, 525) : dayT(hr < 6 ? yday : today, 900);
    if (!bar || bar.t !== tm){ bar = { t:tm, o:px, h:px, l:px, c:px, net:0, gross:0, cb:0, cs:0, pb:0, ps:0, unk:0, vix:null, v:0, td, s, s0, k:0, live:true }; LIVE.bars.push(bar); if (LIVE.bars.length > 900) LIVE.bars.shift(); }
    bar.h = Math.max(bar.h, px); bar.l = Math.min(bar.l, px); bar.c = px;
    const fv = +f.total_volume || 0; if (LIVE.fut != null && fv >= LIVE.fut) bar.v += fv - LIVE.fut; LIVE.fut = fv;
    let n = 0;
    [...prods.values()].forEach((list, pi) => { for (const r of ors[pi] || []){
      const m = /^[A-Z0-9]{3}(\d+)([A-X])(\d)$/.exec(r.options_id); if (!m) continue; const suf = m[2] + m[3]; const it = list.find(q => q.lp.cl === suf || q.lp.pl === suf); if (!it) continue;
      const call = it.lp.cl === suf, K = +m[1], key = r.options_id, tv = +r.total_volume || 0, pv = LIVE.prevVol.get(key); LIVE.prevVol.set(key, tv);
      if (pv == null || tv <= pv) continue;
      const dv = tv - pv, c = +r.close, bp = +r.buy_price, sp = +r.sell_price;
      let side = 0; if (bp > 0 && sp > 0){ if (c >= sp) side = 1; else if (c <= bp) side = -1; else side = Math.sign(c - (bp + sp) / 2); }
      if (!side){ bar.unk += dv; continue; }
      const row = it.e.rows.find(x => x[0] === K); const iv = row ? row[10] / 100 : it.e.iv / 100;
      const T = Math.max(600, Date.UTC(+it.e.exp.slice(0, 4), +it.e.exp.slice(5, 7) - 1, +it.e.exp.slice(8, 10), 13, 30) / 1000 - now) / (365 * 86400);
      const F = it.e.F * px / (STRK.fut || it.e.F), sd = iv * Math.sqrt(T), d1 = (Math.log(F / K) + sd * sd / 2) / sd;
      const dl = call ? ncdf(d1) : ncdf(d1) - 1;
      bar.net += side * dl * dv * 0.25; bar.gross += Math.abs(dl) * dv * 0.25;
      if (call) bar[side > 0 ? 'cb' : 'cs'] += dv; else bar[side > 0 ? 'pb' : 'ps'] += dv; n++;
    } });
    bar.k = Math.floor((bar.t - bar.s0) / 60);
    LIVE.msg = `即時 ${hm(now)} 更新・本次 ${n} 檔有新成交・從開啟即時起累積 ${LIVE.bars.length} 分鐘（開啟前的盤中資料要等收盤後才會補上）`;
    await rebuild();
  } catch(err){ LIVE.msg = '即時更新失敗：' + err.message; $('#noteMain').innerHTML = noteMain(); }
  finally { LIVE.busy = false; }
}
function setLive(on){
  ST.live = on; clearInterval(LIVE.timer);
  $('#liveBtn').classList.toggle('on', on); $('#liveBtn').textContent = on ? '停止即時' : '開啟即時';
  $('#liveBtn').style.background = on ? css('--accent') : ''; $('#liveBtn').style.color = on ? '#fff' : '';
  if (on){
    if (!(SET.token || '').trim()){ LIVE.msg = '需要 FinMind 憑證：請到看盤頁「⚙ 設定」填入'; ST.live = false; $('#noteMain').innerHTML = noteMain(); return; }
    liveTick(); LIVE.timer = setInterval(() => { if (!document.hidden) liveTick(); }, 60000);
  } else { LIVE.msg = ''; $('#noteMain').innerHTML = noteMain(); }
}
$('#liveBtn').onclick = () => setLive(!ST.live);

/* ───────── 整體 ───────── */
function noteMain(){
  const b = VIEW && VIEW.bars[VIEW.bars.length - 1];
  const stale = b && !b.live ? `最後一根 ${VIEW.tf === 'D' ? b.td : mdhm(b.t)}（盤後逐筆資料，非即時）` : '';
  return `${stale}${LIVE.msg ? '・' + esc(LIVE.msg) : ''}<br>主線＝選擇權主動成交的 Delta 加權淨流量（推估），和過去同一時間比較後的強弱；紅色＝強多（≥ +60）、綠色＝強空（≤ −60），金色＝訊號線，▲▼＝GO 訊號。灰色底＝歷史資料還不夠、暫不計算；藍色底＝即時推估。拖曳或滑動平移，滾輪或兩指縮放。`;
}
function render(){
  if (!VIEW) return;
  document.querySelectorAll('#tfSeg button').forEach(b => b.classList.toggle('on', b.dataset.tf === ST.tf));
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === ST.mode));
  $('#blendBtn').style.background = ST.blend ? css('--accent') : ''; $('#blendBtn').style.color = ST.blend ? '#fff' : '';
  legend('#lgMain', [['台指期', css('--text')], ['多空力道', css('--force')], ['強多 ≥ +60', css('--up')], ['強空 ≤ −60', css('--down')], ['訊號線', css('--gold')]]);
  drawMain(); renderTop(); renderGo(); renderPanic(); renderQ();
  $('#noteMain').innerHTML = noteMain();
}
document.querySelectorAll('#tfSeg button').forEach(b => b.onclick = async () => { ST.tf = b.dataset.tf; store.set('force.tf', ST.tf); ST.view = { n:null, end:null }; await rebuild(); });
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = async () => { ST.mode = b.dataset.m; store.set('force.mode', ST.mode); await rebuild(); });
$('#blendBtn').onclick = async () => { ST.blend = !ST.blend; store.set('force.blend', ST.blend ? '1' : '0'); await rebuild(); };
$('#costIn').onchange = () => { VIEW.bt = backtest(VIEW, VIEW.base); renderGo(); };
document.querySelectorAll('#mapSeg button').forEach(b => b.onclick = () => { ST.mapK = b.dataset.k; store.set('force.mapK', ST.mapK); renderMap(); });
document.querySelectorAll('#rngSeg button').forEach(b => b.onclick = () => { ST.mapR = +b.dataset.r; store.set('force.mapR', ST.mapR); renderMap(); });
$('#dMap').addEventListener('toggle', () => { if ($('#dMap').open) renderMap(); });
$('#dPcr').addEventListener('toggle', () => { if ($('#dPcr').open) renderPcr(); });
$('#dInst').addEventListener('toggle', () => { if ($('#dInst').open) renderInst(); });
let rsz = null; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { drawMain(); if ($('#dMap').open) renderMap(); if ($('#dPcr').open) renderPcr(); }, 150); });
if (window.innerWidth > 900){ $('#dMap').open = true; }

(async () => {
  try {
    await loadAll();
    if (!BASE5.length){ setStatus('多空力道資料還在第一次計算中（每晚自動更新），請稍後再來。', true); return; }
    buildInstBias();
    $('#app').hidden = false; setStatus('');
    await rebuild();
    if ($('#dMap').open) renderMap();
  } catch(e){ console.error(e); setStatus('讀取失敗：' + e.message, true); }
})();
</script>
